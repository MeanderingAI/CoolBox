name: Publish documentation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_branch:
        description: Branch that should receive the generated documentation site
        required: true
        default: gh-pages
        type: string

permissions:
  contents: write

concurrency:
  group: docs-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Resolve publish branch
        id: resolve-branch
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            branch="${{ inputs.publish_branch }}"
          elif [ -n "${{ vars.DOCS_PUBLISH_BRANCH }}" ]; then
            branch="${{ vars.DOCS_PUBLISH_BRANCH }}"
          else
            branch="gh-pages"
          fi

          echo "Using publish branch: ${branch}"
          echo "publish_branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz libcurl4-openssl-dev libssl-dev libxml2-dev libeigen3-dev python3-dev emscripten
          python -m pip install --upgrade pip setuptools wheel build pybind11 numpy
          Rscript -e "install.packages(c('Rcpp', 'devtools', 'roxygen2', 'pkgdown', 'testthat'), repos = 'https://cloud.r-project.org')"

      - name: Build Python bindings
        run: |
          make build_python_bindings

      - name: Build Python distribution artifacts
        run: |
          python -m build ./_libraries/python_bindings --outdir ./_libraries/python_bindings/dist

      - name: Build JavaScript bindings
        run: |
          make build_js_bindings

      - name: Build unified docs site
        run: |
          bash ./_scripts/generate_docs_hub.sh "$GITHUB_WORKSPACE/.site"

      - name: Publish documentation branch
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .site
          publish_branch: ${{ steps.resolve-branch.outputs.publish_branch }}
          force_orphan: true
          enable_jekyll: false
