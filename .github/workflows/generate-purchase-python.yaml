name: generate_purchase_python

on:
  workflow_call:
    inputs:
      build_libs_run_id:
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: generate-purchase-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate_purchase_python:
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/workflows/fragments/purchase-compute-artifact-name

      - name: Download built C++ libraries (from build_libs) (with run-id)
        id: download_build_with_run
        if: "${{ inputs.build_libs_run_id != '' }}"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ steps.compute_artifact.outputs.artifact_name }}
          path: build/
          run-id: ${{ inputs.build_libs_run_id }}

      - name: Download built C++ libraries (from build_libs) (no run-id)
        id: download_build
        if: "${{ inputs.build_libs_run_id == '' }}"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ steps.compute_artifact.outputs.artifact_name }}
          path: build/

      - name: Fallback download (run-id)
        if: "${{ inputs.build_libs_run_id != '' }}"
        uses: actions/download-artifact@v8
        with:
          pattern: "coolbox-build-${{ steps.compute_artifact.outputs.osname }}-${{ steps.compute_artifact.outputs.arch }}-*"
          path: build/
          merge-multiple: true

      - name: Fallback download (no run-id)
        if: "${{ inputs.build_libs_run_id == '' }}"
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ format('coolbox-build-{0}-{1}-*', steps.compute_artifact.outputs.osname, steps.compute_artifact.outputs.arch) }}
          path: build/
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make doxygen libeigen3-dev libsqlite3-dev libgsl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          for pkg in cmake doxygen eigen sqlite gsl; do
            brew list "$pkg" &>/dev/null || brew install "$pkg"
          done

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          $ErrorActionPreference = 'Stop'
          choco install cmake -y
          if ($LASTEXITCODE -ne 0) {
            throw "CMake installation failed (exit code $LASTEXITCODE)"
          }

          $vcpkg = Get-Command vcpkg -ErrorAction SilentlyContinue
          if ($null -eq $vcpkg) {
            throw "vcpkg is required for the Windows Python package build"
          }

          $vcpkgRoot = Split-Path -Parent $vcpkg.Source
          $vcpkgToolchain = Join-Path $vcpkgRoot 'scripts\buildsystems\vcpkg.cmake'
          if (-not (Test-Path $vcpkgToolchain)) {
            throw "vcpkg toolchain file not found at $vcpkgToolchain"
          }

          & $vcpkg.Source install eigen3:x64-windows sqlite3:x64-windows gsl:x64-windows
          if ($LASTEXITCODE -ne 0) {
            throw "vcpkg dependency installation failed (exit code $LASTEXITCODE)"
          }

          choco install winflexbison -y
          if ($LASTEXITCODE -ne 0) {
            throw "WinFlexBison installation failed (exit code $LASTEXITCODE)"
          }

          $installedRoot = Join-Path $vcpkgRoot 'installed\x64-windows'
          $bisonExecutable = 'C:\ProgramData\chocolatey\lib\winflexbison\tools\win_bison.exe'
          foreach ($requiredPath in @(
            (Join-Path $installedRoot 'include\eigen3\Eigen\Core'),
            (Join-Path $installedRoot 'include\gsl\gsl_math.h'),
            $bisonExecutable
          )) {
            if (-not (Test-Path $requiredPath)) {
              throw "Required Windows dependency not found: $requiredPath"
            }
          }

          $prefixPath = "$installedRoot;$installedRoot\share\gsl;$installedRoot\lib\cmake\GSL;$installedRoot\share\sqlite3"
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_TARGET_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_TOOLCHAIN_FILE=$vcpkgToolchain" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKG_INSTALLED_ROOT=$installedRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CMAKE_PREFIX_PATH=$prefixPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BISON_EXECUTABLE=$bisonExecutable" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "EIGEN3_INCLUDE_DIR=$(Join-Path $installedRoot 'include\eigen3')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "SQLITE3_LIB_DIR=$(Join-Path $installedRoot 'lib')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GSL_INCLUDE_DIR=$(Join-Path $installedRoot 'include')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "GSL_LIB_DIR=$(Join-Path $installedRoot 'lib')" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Split-Path -Parent $bisonExecutable) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        shell: pwsh

      - name: Prepare Eigen headers (Windows)
        if: runner.os == 'Windows'
        run: |
          $candidates = @(
            $env:EIGEN3_INCLUDE_DIR,
            "C:\vcpkg\installed\x64-windows\include\eigen3",
            "C:\vcpkg\installed\x64-windows\include",
            "C:\msys64\mingw64\include\eigen3",
            "C:\msys64\mingw64\include",
            "C:\tools\msys64\mingw64\include\eigen3",
            "C:\tools\msys64\mingw64\include"
          )
          New-Item -ItemType Directory -Force -Path build | Out-Null
          foreach ($candidate in $candidates) {
            if ([string]::IsNullOrWhiteSpace($candidate)) { continue }
            if (Test-Path $candidate) {
              if (Test-Path "build\eigen-src") {
                Remove-Item -Recurse -Force "build\eigen-src"
              }
              Copy-Item -Recurse -Force $candidate "build\eigen-src"
              $workspaceEigen = Join-Path $env:GITHUB_WORKSPACE "build\eigen-src"
              $workspaceEigen3 = Join-Path $workspaceEigen "eigen3"
              if (Test-Path (Join-Path $workspaceEigen "Eigen\Core")) {
                "EIGEN3_INCLUDE_DIR=$workspaceEigen" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                Write-Host "Using Eigen headers from $candidate copied to $workspaceEigen"
                exit 0
              }
              if (Test-Path (Join-Path $workspaceEigen3 "Eigen\Core")) {
                "EIGEN3_INCLUDE_DIR=$workspaceEigen3" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                Write-Host "Using Eigen headers from $candidate copied to $workspaceEigen3"
                exit 0
              }
              Write-Host "Copied $candidate but Eigen/Core was not found in the copied tree"
              Get-ChildItem -Path $workspaceEigen -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 40 | Format-Table -AutoSize
              Remove-Item -Recurse -Force "build\eigen-src" -ErrorAction SilentlyContinue
            }
          }
          throw "Unable to locate Eigen headers for Python bindings"
        shell: pwsh

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools wheel build pybind11 numpy

      - name: Prepare native sources for Python bindings (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ -d build/_libraries ]; then
            echo "Using downloaded C++ artifacts from build/_libraries when available"
            ls -la build/_libraries || true
          else
            echo "No downloaded C++ artifacts; Python bindings will use vendored sources"
          fi

          test -f _deliverables/libraries/bindings/python_bindings/setup.py
          test -f _deliverables/libraries/bindings/python_bindings/vendor_src/GRAPHICS/charts/source/graphics.cpp
          test -f _deliverables/libraries/bindings/python_bindings/vendor_src/MISC/wave_generator/source/wave_generator.cpp
          echo "Verified vendored Python binding sources"
        shell: bash

      - name: Set COOLBOX_LIB_DIR for Python build
        if: runner.os != 'Windows'
        run: |
          echo "COOLBOX_LIB_DIR=${GITHUB_WORKSPACE}/build" >> $GITHUB_ENV
        shell: bash

      - name: Build Windows native libraries for Python packaging
        if: runner.os == 'Windows'
        run: |
          foreach ($requiredPath in @($env:VCPKG_TOOLCHAIN_FILE, $env:VCPKG_INSTALLED_ROOT, $env:BISON_EXECUTABLE)) {
            if (-not $requiredPath -or -not (Test-Path $requiredPath)) {
              throw "Required Windows build dependency not found: $requiredPath"
            }
          }

          Remove-Item -Recurse -Force build-python-msvc\CMakeCache.txt,build-python-msvc\CMakeFiles -ErrorAction SilentlyContinue
          $cmakeArgs = @(
            '-S', '.',
            '-B', 'build-python-msvc',
            '-A', 'x64',
            '-DBUILD_TESTING=OFF',
            '-DBUILD_BINARIES=OFF',
            '-DBUILD_PRODUCTS=OFF',
            "-DCMAKE_TOOLCHAIN_FILE=$($env:VCPKG_TOOLCHAIN_FILE)",
            "-DCMAKE_PREFIX_PATH=$($env:CMAKE_PREFIX_PATH)",
            "-DGSL_ROOT_DIR=$($env:VCPKG_INSTALLED_ROOT)",
            "-DBISON_EXECUTABLE=$($env:BISON_EXECUTABLE)",
            '-DVCPKG_TARGET_TRIPLET=x64-windows'
          )
          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) {
            throw "Python native library configuration failed (exit code $LASTEXITCODE)"
          }

          foreach ($requiredTarget in @('charts', 'wave_generator_utils')) {
            $targetProject = Get-ChildItem -Path build-python-msvc -Filter "$requiredTarget.vcxproj" -Recurse -File |
              Select-Object -First 1
            if (-not $targetProject) {
              throw "Required Python native library target was not generated: $requiredTarget"
            }
            Write-Host "Found native target project: $($targetProject.FullName)"
          }

          cmake --build build-python-msvc --config Release --target charts wave_generator_utils --parallel 2
          if ($LASTEXITCODE -ne 0) {
            throw "Python native library build failed (exit code $LASTEXITCODE)"
          }
        shell: pwsh

      - name: Set COOLBOX_LIB_DIR for Python build (Windows)
        if: runner.os == 'Windows'
        run: |
          "COOLBOX_LIB_DIR=$env:GITHUB_WORKSPACE\build-python-msvc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
        shell: pwsh

      - name: Build Python bindings
        env:
          COOLBOX_PYTHON_FORCE_VENDOR_SOURCES: ${{ runner.os != 'Windows' && '1' || '0' }}
        run: |
          cd _deliverables/libraries/bindings/python_bindings
          rm -rf build dist ml_toolbox.egg-info vendor_include/GRAPHICS vendor_include/MISC vendor_include/MATRIX vendor_src
          rm -f ml_toolbox/ml_core*.so ml_toolbox/ml_core*.pyd ml_toolbox/ml_core*.dylib ml_toolbox/ml_core*.dll

          if grep -R -n -F '../../../groups/' include vendor_include; then
            echo "::error::Python package headers contain repository-relative includes"
            exit 1
          fi

          for required_header in \
            vendor_include/MATH/pde_solver.hpp \
            vendor_include/MATH/spde.hpp \
            vendor_include/MATH/xarray.h; do
            if [ ! -f "$required_header" ]; then
              echo "::error::Missing required vendored header: $required_header"
              exit 1
            fi
          done

          python setup.py build
          python -m build --outdir ./dist

      - name: Package Python tarball
        run: |
          rm -rf release-assets staging-python
          mkdir -p release-assets staging-python
          cp -R _deliverables/libraries/bindings/python_bindings/dist/. staging-python/ 2>/dev/null || true
          find _deliverables/libraries/bindings/python_bindings -type f \( -name '*.so' -o -name '*.pyd' -o -name '*.dylib' -o -name '*.dll' \) -exec cp {} staging-python/ \;
          tar -C staging-python -czf release-assets/coolbox-python-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.tar.gz .
          python -c 'import pathlib,sys,zipfile; s=pathlib.Path(sys.argv[1]); z=pathlib.Path(sys.argv[2]); a=zipfile.ZipFile(z,"w",compression=zipfile.ZIP_DEFLATED); [a.write(p,p.relative_to(s)) for p in sorted(s.rglob("*")) if p.is_file()]; a.close()' \
            staging-python release-assets/coolbox-python-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.zip

      - name: Finalize Python release assets
        uses: ./.github/actions/finalize-purchase-assets
        with:
          assets_dir: release-assets
          ref_name: ${{ github.ref_name }}
          platform: ${{ matrix.platform }}
          workflow_name: ${{ github.workflow }}
          repository: ${{ github.repository }}
          commit_sha: ${{ github.sha }}
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}

      - name: Upload Python archives
        uses: actions/upload-artifact@v7
        with:
          name: python-extension-${{ matrix.platform }}-${{ github.ref_name }}
          path: |
            release-assets/coolbox-python-bindings-${{ matrix.platform }}-${{ github.ref_name }}.tar.gz
            release-assets/coolbox-python-bindings-${{ matrix.platform }}-${{ github.ref_name }}.zip
            release-assets/manifest.txt
            release-assets/SHA256SUMS
          retention-days: 14

      - name: Attach Python archives to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release-assets/coolbox-python-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.tar.gz \
            release-assets/coolbox-python-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.zip \
            release-assets/manifest.txt#coolbox-python-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.manifest.txt \
            release-assets/SHA256SUMS#coolbox-python-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.SHA256SUMS \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"