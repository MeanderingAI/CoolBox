name: build_cpp_docs

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-cpp-docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_cpp_docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Doxygen dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Build C++ Doxygen site
        run: |
          bash ./_scripts/build_cpp_docs.sh "$GITHUB_WORKSPACE/cpp-docs-site"

      - name: Upload C++ Doxygen artifact
        uses: actions/upload-artifact@v6
        with:
          name: cpp-doxygen-site
          path: cpp-docs-site/
          retention-days: 14
