name: Build & publish plang-lsp

on:
  workflow_run:
    workflows: ["Build Libraries & Release"]
    types: [completed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get remove -y containerd.io || true
          sudo apt-get install -y build-essential cmake curl pkg-config
          sudo apt-get install -y --no-install-recommends docker.io

      - name: Download plang_lsp artifact
        uses: actions/download-artifact@v8
        with:
          pattern: pl-lsp-binaries-linux-x86_64-*
          path: _deliverables/apps/lsp/dist
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}

      - name: Build plang_lsp locally if missing
        run: |
          set -e
          if [ -f "_deliverables/apps/lsp/dist/plang_lsp" ]; then
            echo "Using downloaded plang_lsp artifact"
            ls -la _deliverables/apps/lsp/dist
            exit 0
          fi

          echo "No plang_lsp artifact found; building locally"
          cmake -S . -B build -DBUILD_BINARIES=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          mkdir -p _deliverables/apps/lsp/dist
          cp build/_deliverables/apps/lsp/plang_lsp _deliverables/apps/lsp/dist/plang_lsp || cp build/apps/lsp/plang_lsp _deliverables/apps/lsp/dist/plang_lsp || cp build/plang_lsp _deliverables/apps/lsp/dist/plang_lsp
          ls -la _deliverables/apps/lsp/dist


      # Common GHCR login and owner normalization
      - uses: ./.github/workflows/fragments/ghcr-login.yaml


      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: _deliverables/apps/lsp
          file: _deliverables/apps/lsp/docker/Dockerfile.plang
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr-owner.outputs.value }}/plang-lsp:plang_lsp-${{ github.sha }}
            ghcr.io/${{ steps.ghcr-owner.outputs.value }}/plang-lsp:latest
