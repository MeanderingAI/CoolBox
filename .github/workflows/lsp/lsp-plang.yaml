name: Build & publish plang-lsp

on:
  workflow_run:
    workflows: ["Build Libraries & Release"]
    types: [completed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get remove -y containerd.io || true
          sudo apt-get install -y build-essential cmake curl pkg-config
          sudo apt-get install -y --no-install-recommends docker.io

      - name: Download plang_lsp artifact
        uses: actions/download-artifact@v8
        with:
          pattern: pl-lsp-binaries-linux-x86_64-*
          path: _deliverables/apps/lsp/dist
          merge-multiple: true
          run-id: ${{ github.event.workflow_run.id }}


      # Common GHCR login and owner normalization
      - uses: ./.github/workflows/fragments/ghcr-login.yaml


      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: _deliverables/apps/lsp
          file: _deliverables/apps/lsp/docker/Dockerfile.plang
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr-owner.outputs.value }}/plang-lsp:plang_lsp-${{ github.sha }}
            ghcr.io/${{ steps.ghcr-owner.outputs.value }}/plang-lsp:latest
