name: generate_purchase_r

on:
  workflow_call:
    inputs:
      build_libs_run_id:
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  R_LIBS_USER: ${{ github.workspace }}/.r-library

concurrency:
  group: generate-purchase-r-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate_purchase_r:
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      R_LIBS_USER: ${{ github.workspace }}/.r-library
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute artifact name
        id: compute_artifact
        run: |
          arch_env="${RUNNER_ARCH:-$(uname -m)}"
          arch_lc=$(echo "$arch_env" | tr '[:upper:]' '[:lower:]')
          if [[ "$arch_lc" == *arm* || "$arch_lc" == *aarch* ]]; then
            ARCH=arm64
          else
            ARCH=x86_64
          fi

          case "${RUNNER_OS}" in
            Linux) OSNAME=linux ;;
            macOS) OSNAME=macos ;;
            Windows) OSNAME=windows ;;
            *) OSNAME=linux ;;
          esac

          echo "artifact_name=coolbox-build-${OSNAME}-${ARCH}-${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "osname=${OSNAME}" >> $GITHUB_OUTPUT
          echo "arch=${ARCH}" >> $GITHUB_OUTPUT

      - name: Download built C++ libraries (from build_libs) (with run-id)
        id: download_build_with_run
        if: "${{ inputs.build_libs_run_id != '' }}"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ steps.compute_artifact.outputs.artifact_name }}
          path: build/
          run-id: ${{ inputs.build_libs_run_id }}

      - name: Download built C++ libraries (from build_libs) (no run-id)
        id: download_build
        if: "${{ inputs.build_libs_run_id == '' }}"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ steps.compute_artifact.outputs.artifact_name }}
          path: build/

      - name: Fallback download (run-id)
        if: "${{ inputs.build_libs_run_id != '' }}"
        uses: actions/download-artifact@v8
        with:
          pattern: "coolbox-build-${{ steps.compute_artifact.outputs.osname }}-${{ steps.compute_artifact.outputs.arch }}-*"
          path: build/
          merge-multiple: true

      - name: Fallback download (no run-id)
        if: "${{ inputs.build_libs_run_id == '' }}"
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ format('coolbox-build-{0}-{1}-*', steps.compute_artifact.outputs.osname, steps.compute_artifact.outputs.arch) }}
          path: build/
          merge-multiple: true

      - name: Set COOLBOX_LIB_DIR for R build
        run: |
          echo "COOLBOX_LIB_DIR=${GITHUB_WORKSPACE}/build" >> $GITHUB_ENV

      - name: Set up R (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y r-base r-base-dev

      - name: Set up R (macOS)
        if: runner.os == 'macOS'
        run: |
          brew untap aws/tap || true
          brew list r &>/dev/null || brew install r

      - name: Set up R (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install r.project -y
          $rBin = Get-ChildItem 'C:\Program Files\R' -Directory | Sort-Object Name -Descending | Select-Object -First 1 | ForEach-Object { Join-Path $_.FullName 'bin\x64' }
          if (-not $rBin) { throw 'R installation directory was not found.' }
          echo "$rBin" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y libcurl4-openssl-dev libssl-dev libxml2-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          for pkg in libxml2 openssl curl; do
            brew list "$pkg" &>/dev/null || brew install "$pkg"
          done

      - name: Prepare writable R library
        run: |
          mkdir -p "$R_LIBS_USER"
          echo "Using R library: $R_LIBS_USER"

      - name: Install R packages
        run: |
          Rscript -e "lib <- Sys.getenv('R_LIBS_USER'); dir.create(lib, recursive = TRUE, showWarnings = FALSE); .libPaths(c(lib, .libPaths())); install.packages('Rcpp', repos = 'https://cloud.r-project.org', lib = lib)"

      - name: Build R package tarball
        run: |
          rm -rf release-assets staging-r
          mkdir -p release-assets staging-r
          find _deliverables/libraries/bindings/r_bindings/coolboxr/src -maxdepth 1 -type f \( -name '*.o' -o -name '*.so' -o -name '*.dll' -o -name '*.dylib' -o -name '*.a' -o -name '*.lib' \) -delete
          R CMD build _deliverables/libraries/bindings/r_bindings/coolboxr
          mv coolboxr_*.tar.gz release-assets/coolbox-r-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.tar.gz
          tar -xzf release-assets/coolbox-r-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.tar.gz -C staging-r
          python -c 'import pathlib,sys,zipfile; s=pathlib.Path(sys.argv[1]); z=pathlib.Path(sys.argv[2]); a=zipfile.ZipFile(z,"w",compression=zipfile.ZIP_DEFLATED); [a.write(p,p.relative_to(s)) for p in sorted(s.rglob("*")) if p.is_file()]; a.close()' \
            staging-r release-assets/coolbox-r-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.zip

      - name: Finalize R release assets
        uses: ./.github/actions/finalize-purchase-assets
        with:
          assets_dir: release-assets
          ref_name: ${{ github.ref_name }}
          platform: ${{ matrix.platform }}
          workflow_name: ${{ github.workflow }}
          repository: ${{ github.repository }}
          commit_sha: ${{ github.sha }}
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}

      - name: Upload R archives
        uses: actions/upload-artifact@v7
        with:
          name: r-extension-${{ matrix.platform }}-${{ github.ref_name }}
          path: |
            release-assets/coolbox-r-bindings-${{ matrix.platform }}-${{ github.ref_name }}.tar.gz
            release-assets/coolbox-r-bindings-${{ matrix.platform }}-${{ github.ref_name }}.zip
            release-assets/manifest.txt
            release-assets/SHA256SUMS
          retention-days: 14


      - name: Ensure release exists (macOS only)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes "Automated release" --repo "${GITHUB_REPOSITORY}" || true

      - name: Attach R archives to release (macOS only)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.os == 'macos-latest'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release-assets/coolbox-r-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.tar.gz \
            release-assets/coolbox-r-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.zip \
            release-assets/manifest.txt#coolbox-r-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.manifest.txt \
            release-assets/SHA256SUMS#coolbox-r-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.SHA256SUMS \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"
      - name: Probe configured CMake tests (R job)
        run: |
          if [ -d build ]; then
            echo "--- CMake help (first 200 lines) ---"
            cmake --build build --target help 2>&1 | head -n 200 || true
            echo "--- CTest configured tests ---"
            ctest --test-dir build -N || true
            mkdir -p build/test-binaries || true
            shopt -s globstar || true
            for f in build/**/*_tests build/**/*_test build/**/tests/*; do
              if [ -f "$f" ] && [ -x "$f" ]; then
                cp "$f" build/test-binaries/ || true
              fi
            done
            if [ -d build/test-binaries ] && [ "$(ls -A build/test-binaries 2>/dev/null)" ]; then
              tar -czf build/test_binaries_r_job.tar.gz -C build test-binaries
              ls -la build/test_binaries_r_job.tar.gz || true
            else
              echo "No test binaries found to package"
            fi
          else
            echo "No build directory present; skipping CMake probe"
          fi

      - name: Upload test binaries artifact (R job)
        uses: actions/upload-artifact@v4
        with:
          name: r_test_binaries
          path: build/test_binaries_r_job.tar.gz
          retention-days: 14