name: generate_purchase_rust

on:
  workflow_call:
    inputs:
      build_libs_run_id:
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: generate-purchase-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate_purchase_rust:
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/workflows/fragments/purchase-compute-artifact-name

      - name: Download built C++ libraries (from build_libs) (with run-id)
        id: download_build_with_run
        if: "${{ inputs.build_libs_run_id != '' }}"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ steps.compute_artifact.outputs.artifact_name }}
          path: build/
          run-id: ${{ inputs.build_libs_run_id }}

      - name: Download built C++ libraries (from build_libs) (no run-id)
        id: download_build
        if: "${{ inputs.build_libs_run_id == '' }}"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ steps.compute_artifact.outputs.artifact_name }}
          path: build/

      - name: Fallback download (run-id)
        if: "${{ inputs.build_libs_run_id != '' }}"
        uses: actions/download-artifact@v8
        with:
          pattern: "coolbox-build-${{ steps.compute_artifact.outputs.osname }}-${{ steps.compute_artifact.outputs.arch }}-*"
          path: build/
          merge-multiple: true

      - name: Fallback download (no run-id)
        if: "${{ inputs.build_libs_run_id == '' }}"
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ format('coolbox-build-{0}-{1}-*', steps.compute_artifact.outputs.osname, steps.compute_artifact.outputs.arch) }}
          path: build/
          merge-multiple: true

      - name: Set COOLBOX_LIB_DIR for Rust build
        run: |
          echo "COOLBOX_LIB_DIR=${GITHUB_WORKSPACE}/build" >> $GITHUB_ENV
          echo "COOLBOX_C_BINDINGS_BUILD_DIR=${GITHUB_WORKSPACE}/_libraries/c_bindings/build" >> $GITHUB_ENV
          echo "COOLBOX_C_BINDINGS_BUILD_CONFIG_DIR=${GITHUB_WORKSPACE}/_libraries/c_bindings/build/Release" >> $GITHUB_ENV

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Build native C bindings (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cmake -S _libraries/c_bindings -B _libraries/c_bindings/build -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build _libraries/c_bindings/build --config Release --parallel

      - name: Build native C bindings (Windows x86_64)
        if: runner.os == 'Windows' && matrix.platform != 'windows-arm64'
        run: |
          $vsgen = powershell -File _scripts/detect_vs_generator.ps1
          cmake -S _libraries/c_bindings -B _libraries/c_bindings/build -G "$vsgen" -A x64 -DBUILD_TESTING=ON
          cmake --build _libraries/c_bindings/build --config Release --parallel

      - name: Build native C bindings (Windows ARM64 with MinGW)
        if: runner.os == 'Windows' && matrix.platform == 'windows-arm64'
        run: |
          cmake -S _libraries/c_bindings -B _libraries/c_bindings/build -G "MinGW Makefiles" -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build _libraries/c_bindings/build --config Release --parallel

      - name: Verify native C bindings runtime artifact
        run: |
          case "${RUNNER_OS}" in
            Linux)
              candidates=(
                "${COOLBOX_C_BINDINGS_BUILD_DIR}/libcoolbox_c_bindings.so"
                "${COOLBOX_C_BINDINGS_BUILD_CONFIG_DIR}/libcoolbox_c_bindings.so"
              )
              ;;
            macOS)
              candidates=(
                "${COOLBOX_C_BINDINGS_BUILD_DIR}/libcoolbox_c_bindings.dylib"
                "${COOLBOX_C_BINDINGS_BUILD_CONFIG_DIR}/libcoolbox_c_bindings.dylib"
              )
              ;;
            Windows)
              candidates=(
                "${COOLBOX_C_BINDINGS_BUILD_DIR}/coolbox_c_bindings.dll"
                "${COOLBOX_C_BINDINGS_BUILD_DIR}/libcoolbox_c_bindings.dll"
                "${COOLBOX_C_BINDINGS_BUILD_CONFIG_DIR}/coolbox_c_bindings.dll"
                "${COOLBOX_C_BINDINGS_BUILD_CONFIG_DIR}/libcoolbox_c_bindings.dll"
              )
              ;;
            *)
              echo "Unsupported runner OS: ${RUNNER_OS}" >&2
              exit 1
              ;;
          esac

          found_runtime=""
          for candidate in "${candidates[@]}"; do
            if [ -f "${candidate}" ]; then
              found_runtime="${candidate}"
              break
            fi
          done

          if [ -z "${found_runtime}" ]; then
            echo "coolbox_c_bindings runtime artifact was not produced in expected locations." >&2
            echo "Checked candidates:" >&2
            printf '  %s\n' "${candidates[@]}" >&2
            echo "Contents of ${COOLBOX_C_BINDINGS_BUILD_DIR}:" >&2
            ls -la "${COOLBOX_C_BINDINGS_BUILD_DIR}" >&2 || true
            echo "Contents of ${COOLBOX_C_BINDINGS_BUILD_CONFIG_DIR}:" >&2
            ls -la "${COOLBOX_C_BINDINGS_BUILD_CONFIG_DIR}" >&2 || true
            exit 1
          fi

          echo "Verified native runtime artifact: ${found_runtime}"

      - name: Build Rust bindings
        run: |
          if [ -d build/_libraries ]; then
            echo "Using prebuilt C++ libraries from build/; proceeding to cargo build without rebuilding C++"
          fi
          cargo build --manifest-path _libraries/rust_bindings/Cargo.toml --release


      - name: Copy C bindings DLLs for Rust tests (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p target/release/deps
          cp _libraries/c_bindings/build/*.dll target/release/deps/ || true
          cp _libraries/c_bindings/build/Debug/*.dll target/release/deps/ || true
          cp _libraries/c_bindings/build/Release/*.dll target/release/deps/ || true

      - name: Test Rust bindings
        run: |
          if [ -d "${COOLBOX_C_BINDINGS_BUILD_DIR}" ]; then
            export LD_LIBRARY_PATH="${COOLBOX_C_BINDINGS_BUILD_DIR}:${COOLBOX_C_BINDINGS_BUILD_CONFIG_DIR}:${LD_LIBRARY_PATH:-}"
            export DYLD_LIBRARY_PATH="${COOLBOX_C_BINDINGS_BUILD_DIR}:${COOLBOX_C_BINDINGS_BUILD_CONFIG_DIR}:${DYLD_LIBRARY_PATH:-}"
            case "${RUNNER_OS}" in
              Windows)
                export PATH="${COOLBOX_C_BINDINGS_BUILD_DIR};${COOLBOX_C_BINDINGS_BUILD_CONFIG_DIR};${PATH}"
                ;;
            esac
          fi
          cargo test --manifest-path _libraries/rust_bindings/Cargo.toml --release

      - name: Package Rust crate
        if: runner.os == 'Linux'
        run: |
          rm -rf release-assets staging-rust
          mkdir -p release-assets staging-rust
          cargo package --manifest-path _libraries/rust_bindings/Cargo.toml --allow-dirty --no-verify
          cp target/package/*.crate release-assets/coolbox-rust-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.crate
          tar -xzf release-assets/coolbox-rust-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.crate -C staging-rust
          find staging-rust -exec touch -t 198001010000 {} +
          tar -C staging-rust -czf release-assets/coolbox-rust-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.tar.gz .
          python -c 'import pathlib,sys,zipfile; s=pathlib.Path(sys.argv[1]); z=pathlib.Path(sys.argv[2]); a=zipfile.ZipFile(z,"w",compression=zipfile.ZIP_DEFLATED); [a.write(p,p.relative_to(s)) for p in sorted(s.rglob("*")) if p.is_file()]; a.close()' \
            staging-rust release-assets/coolbox-rust-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.zip

      - name: Finalize Rust release assets
        if: runner.os == 'Linux'
        uses: ./.github/actions/finalize-purchase-assets
        with:
          assets_dir: release-assets
          ref_name: ${{ github.ref_name }}
          platform: ${{ matrix.platform }}
          workflow_name: ${{ github.workflow }}
          repository: ${{ github.repository }}
          commit_sha: ${{ github.sha }}
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}

      - name: Upload Rust archives
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: rust-extension-${{ matrix.platform }}-${{ github.ref_name }}
          path: |
            release-assets/coolbox-rust-bindings-${{ matrix.platform }}-${{ github.ref_name }}.crate
            release-assets/coolbox-rust-bindings-${{ matrix.platform }}-${{ github.ref_name }}.tar.gz
            release-assets/coolbox-rust-bindings-${{ matrix.platform }}-${{ github.ref_name }}.zip
            release-assets/manifest.txt
            release-assets/SHA256SUMS
          retention-days: 14

      - name: Attach Rust archives to release
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release-assets/coolbox-rust-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.crate \
            release-assets/coolbox-rust-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.tar.gz \
            release-assets/coolbox-rust-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.zip \
            release-assets/manifest.txt#coolbox-rust-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.manifest.txt \
            release-assets/SHA256SUMS#coolbox-rust-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.SHA256SUMS \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"

      - name: Probe configured CMake tests (Rust job)
        run: |
          if [ -d build ]; then
            echo "--- CMake help (first 200 lines) ---"
            cmake --build build --target help 2>&1 | head -n 200 || true
            echo "--- CTest configured tests ---"
            ctest --test-dir build -N || true
            mkdir -p build/test-binaries || true
            shopt -s globstar || true
            for f in build/**/*_tests build/**/*_test build/**/tests/*; do
              if [ -f "$f" ] && [ -x "$f" ]; then
                cp "$f" build/test-binaries/ || true
              fi
            done
            if [ -d build/test-binaries ] && [ "$(ls -A build/test-binaries 2>/dev/null)" ]; then
              tar -czf build/test_binaries_rust_job.tar.gz -C build test-binaries
              ls -la build/test_binaries_rust_job.tar.gz || true
            else
              echo "No test binaries found to package"
            fi
          else
            echo "No build directory present; skipping CMake probe"
          fi

      - name: Upload test binaries artifact (Rust job)
        uses: actions/upload-artifact@v4
        with:
          name: rust_test_binaries
          path: build/test_binaries_rust_job.tar.gz
          retention-days: 14