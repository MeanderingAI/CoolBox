name: Build Products

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-products:
    runs-on: ${{ matrix.os }}
    name: Build Products (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: ubuntu-latest
            platform: linux-arm64
          - os: macos-latest
            platform: macos-arm64
          - os: macos-latest
            platform: macos-x86_64
          - os: windows-latest
            platform: windows-x86_64
          - os: windows-latest
            platform: windows-arm64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Linux dependency setup
      - name: Linux dependency setup
        if: runner.os == 'Linux'
        uses: ./.github/workflows/fragments/deps-linux

      # macOS dependency setup
      - name: macOS dependency setup
        if: runner.os == 'macOS'
        uses: ./.github/workflows/fragments/deps-macos

      # Windows dependency setup
      - name: Windows dependency setup
        if: runner.os == 'Windows'
        uses: ./.github/workflows/fragments/deps-windows

      - name: Ensure MSYS2 tools in PATH (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $msysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          if ([string]::IsNullOrWhiteSpace($msysRoot) -or !(Test-Path $msysRoot)) {
            $msysRoot = "C:\\msys64"
          }
          if (!(Test-Path $msysRoot)) { $msysRoot = "C:\\tools\\msys64" }

          $pathEntries = @(
            (Join-Path $msysRoot 'mingw64\bin'),
            (Join-Path $msysRoot 'usr\bin')
          )

          foreach ($pathEntry in $pathEntries) {
            if (Test-Path $pathEntry) {
              Add-Content -Path $env:GITHUB_PATH -Value $pathEntry
            }
          }

      - name: Verify CMake >= 3.20 is available (Windows)
        if: runner.os == 'Windows'
        run: |
          command -v cmake
          version_line="$(cmake --version | head -n 1)"
          echo "$version_line"
          cmake_version="$(echo "$version_line" | awk '{print $3}')"
          cmake_major="${cmake_version%%.*}"
          cmake_rest="${cmake_version#*.}"
          cmake_minor="${cmake_rest%%.*}"

          if [ -z "$cmake_major" ] || [ -z "$cmake_minor" ]; then
            echo "Unable to parse CMake version from: $version_line"
            exit 1
          fi

          if [ "$cmake_major" -lt 3 ] || { [ "$cmake_major" -eq 3 ] && [ "$cmake_minor" -lt 20 ]; }; then
            echo "CMake $cmake_version is too old; require >= 3.20"
            exit 1
          fi
        shell: msys2 {0}

      - name: Verify CMake >= 3.20 is available (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          command -v cmake
          version_line="$(cmake --version | head -n 1)"
          echo "$version_line"
          cmake_version="$(echo "$version_line" | awk '{print $3}')"
          cmake_major="${cmake_version%%.*}"
          cmake_rest="${cmake_version#*.}"
          cmake_minor="${cmake_rest%%.*}"

          if [ -z "$cmake_major" ] || [ -z "$cmake_minor" ]; then
            echo "Unable to parse CMake version from: $version_line"
            exit 1
          fi

          if [ "$cmake_major" -lt 3 ] || { [ "$cmake_major" -eq 3 ] && [ "$cmake_minor" -lt 20 ]; }; then
            echo "CMake $cmake_version is too old; require >= 3.20"
            exit 1
          fi

      - name: Configure product build (Windows x86_64 / MSYS2)
        if: runner.os == 'Windows' && matrix.platform == 'windows-x86_64'
        run: |
          cmake -S . -B build -Wno-dev -G 'MinGW Makefiles' -DBUILD_BINARIES=OFF -DBUILD_PRODUCTS=ON -DBUILD_PRODUCT_INSTALLER_ABSTRACTIONS=ON -DBUILD_IO_SQL=ON -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH='/mingw64'
        shell: msys2 {0}

      - name: Configure product build (Windows ARM64 / MSVC cross-compile)
        if: runner.os == 'Windows' && matrix.platform == 'windows-arm64'
        shell: pwsh
        run: |
          function Find-VcpkgToolchain {
            $candidateRoots = @()
            if ($env:VCPKG_ROOT) { $candidateRoots += $env:VCPKG_ROOT }
            $command = Get-Command vcpkg.exe -ErrorAction SilentlyContinue
            if ($null -ne $command) {
              $candidateRoots += (Split-Path -Parent $command.Source)
              $candidateRoots += (Split-Path -Parent $command.Path)
            }
            if ($env:USERPROFILE) { $candidateRoots += (Join-Path $env:USERPROFILE 'vcpkg') }
            if ($env:LOCALAPPDATA) { $candidateRoots += (Join-Path $env:LOCALAPPDATA 'vcpkg') }
            $candidateRoots += 'C:\vcpkg'

            foreach ($candidateRoot in ($candidateRoots | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique)) {
              $toolchain = Join-Path $candidateRoot 'scripts\buildsystems\vcpkg.cmake'
              if (Test-Path $toolchain) {
                return $toolchain
              }
            }

            return $null
          }

          $vcpkgToolchain = Find-VcpkgToolchain
          if ($null -eq $vcpkgToolchain) {
            throw 'Unable to locate vcpkg toolchain file. Set VCPKG_ROOT or install vcpkg so scripts\buildsystems\vcpkg.cmake is available.'
          }

          $vcpkgRoot = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $vcpkgToolchain))
          $vcpkgExe = Join-Path $vcpkgRoot 'vcpkg.exe'
          if (-not (Test-Path $vcpkgExe)) {
            $vcpkgCommand = Get-Command vcpkg.exe -ErrorAction SilentlyContinue
            if ($null -ne $vcpkgCommand) {
              $vcpkgExe = $vcpkgCommand.Source
            }
          }
          if (-not (Test-Path $vcpkgExe)) {
            throw 'Unable to locate vcpkg.exe. Set VCPKG_ROOT or ensure vcpkg is installed on PATH.'
          }

          & $vcpkgExe install eigen3:arm64-windows sqlite3:arm64-windows gsl:arm64-windows openssl:arm64-windows
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          $arm64Installed = Join-Path $vcpkgRoot 'installed\arm64-windows'
          $bisonExecutable = 'C:\ProgramData\chocolatey\lib\winflexbison\tools\win_bison.exe'

          # Windows dependency setup may have already configured build/ with MinGW.
          # Clear cache before forcing a Visual Studio generator.
          Remove-Item -Recurse -Force build/CMakeCache.txt,build/CMakeFiles -ErrorAction SilentlyContinue

          $cmakeArgs = @(
            '-S', '.',
            '-B', 'build',
            '-Wno-dev',
            # Detect latest Visual Studio generator using script
            '-G', (& .\_scripts\detect_vs_generator.ps1),
            '-A', 'ARM64',
            '-DBUILD_BINARIES=OFF',
            '-DBUILD_PRODUCTS=ON',
            '-DBUILD_PRODUCT_INSTALLER_ABSTRACTIONS=ON',
            '-DBUILD_IO_SQL=ON',
            '-DBUILD_TESTING=OFF',
            "-DCMAKE_TOOLCHAIN_FILE=$($vcpkgToolchain)",
            "-DCMAKE_PREFIX_PATH=$arm64Installed;$arm64Installed\share\gsl;$arm64Installed\lib\cmake\GSL;$arm64Installed\share\sqlite3;$arm64Installed\share\openssl",
            "-DGSL_ROOT_DIR=$arm64Installed",
            "-DBISON_EXECUTABLE=$bisonExecutable",
            '-DVCPKG_TARGET_TRIPLET=arm64-windows'
          )

          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Configure product build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ -n "$SQLITE3_ROOT" ]; then
            CMAKE_SQLITE_ARGS="-DSQLITE3_ROOT=$SQLITE3_ROOT -DSQLite3_ROOT=$SQLITE3_ROOT -DCMAKE_PREFIX_PATH=$SQLITE3_ROOT"
          else
            CMAKE_SQLITE_ARGS=""
          fi
          cmake -S . -B build -Wno-dev -DBUILD_BINARIES=OFF -DBUILD_PRODUCTS=ON -DBUILD_PRODUCT_INSTALLER_ABSTRACTIONS=ON -DBUILD_IO_SQL=ON -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release $CMAKE_SQLITE_ARGS

      - name: Prepare Windows signing environment
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          COOLBOX_WINDOWS_SIGN_CERT_BASE64_SECRET: ${{ secrets.COOLBOX_WINDOWS_SIGN_CERT_BASE64 }}
          COOLBOX_WINDOWS_SIGN_CERT_PASSWORD_SECRET: ${{ secrets.COOLBOX_WINDOWS_SIGN_CERT_PASSWORD }}
          COOLBOX_WINDOWS_SIGN_TIMESTAMP_URL_SECRET: ${{ secrets.COOLBOX_WINDOWS_SIGN_TIMESTAMP_URL }}
        run: |
          $sdkSearchRoots = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin",
            "${env:ProgramFiles}\Windows Kits\10\bin"
          ) | Where-Object { $_ -and (Test-Path $_) }

          function Find-SignTool {
            if (-not $sdkSearchRoots) {
              return $null
            }

            Get-ChildItem -Path $sdkSearchRoots -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }

          $signtool = Find-SignTool
          if (-not $signtool) {
            Write-Host 'signtool.exe was not found in the preinstalled Windows SDK. Installing the latest SDK.'
            make -f Makefile.win install_latest_windows_sdk
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            $signtool = Find-SignTool
          }

          if (-not $signtool) {
            throw 'signtool.exe was not found after Windows SDK preparation.'
          }

          $signtoolDirectory = Split-Path -Parent $signtool.FullName
          Add-Content -Path $env:GITHUB_PATH -Value $signtoolDirectory

          $certDirectory = Join-Path $env:RUNNER_TEMP 'coolbox-signing'
          New-Item -ItemType Directory -Force -Path $certDirectory | Out-Null

          $certPath = Join-Path $certDirectory 'coolbox-release-signing.pfx'
          $certPassword = $env:COOLBOX_WINDOWS_SIGN_CERT_PASSWORD_SECRET
          $timestampUrl = $env:COOLBOX_WINDOWS_SIGN_TIMESTAMP_URL_SECRET
          if (-not $timestampUrl) {
            $timestampUrl = 'http://timestamp.digicert.com'
          }

          if ($env:COOLBOX_WINDOWS_SIGN_CERT_BASE64_SECRET) {
            Write-Host 'Using repository secret-backed Windows signing certificate.'
            $certBytes = [Convert]::FromBase64String($env:COOLBOX_WINDOWS_SIGN_CERT_BASE64_SECRET.Trim())
            [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          } else {
            Write-Host 'No repository signing certificate secret configured. Falling back to a transient self-signed CI certificate.'
            $certPath = Join-Path $certDirectory 'coolbox-ci-signing.pfx'
            if (-not $certPassword) {
              $certPassword = "CoolBox-${{ github.run_id }}-${{ github.run_attempt }}"
            }
            make -f Makefile.win generate_windows_signing_cert WINDOWS_SIGN_CERT_OUTPUT_DIR="$certDirectory" WINDOWS_SIGN_CERT_FILE_NAME=coolbox-ci-signing WINDOWS_SIGN_CERT_PASSWORD="$certPassword" WINDOWS_SIGN_CERT_SUBJECT="CN=CoolBox CI Signing" WINDOWS_SIGN_CERT_FRIENDLY_NAME="CoolBox CI Signing"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          Add-Content -Path $env:GITHUB_ENV -Value "COOLBOX_WINDOWS_SIGN_CERT_PATH=$certPath"
          Add-Content -Path $env:GITHUB_ENV -Value "COOLBOX_WINDOWS_SIGN_CERT_PASSWORD=$certPassword"
          Add-Content -Path $env:GITHUB_ENV -Value "COOLBOX_WINDOWS_SIGN_TIMESTAMP_URL=$timestampUrl"

      - name: Build product targets explicitly
        run: |
          set -e
          help_out="$(cmake --build build --target help 2>&1 || true)"
          products=(MStudio file_browser bower_shell)
          for product in "${products[@]}"; do
            if echo "$help_out" | grep -Eq "(^|[[:space:]])${product}([[:space:]]|$)"; then
              echo "Building product target: $product"
              cmake --build build --target "$product" --config Release
            else
              echo "Skipping missing product target: $product"
            fi
          done

      - name: Sign Windows product artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & .\_scripts\sign_windows_artifacts.ps1 -Root build -Configuration Release

      - name: Package product artifacts
        run: |
          set -e
          mkdir -p release-assets

          create_archives() {
            local source_dir="$1"
            local base_name="$2"

            tar czf "release-assets/${base_name}.tar.gz" -C "${source_dir}" .
            python -c 'import pathlib,sys,zipfile; s=pathlib.Path(sys.argv[1]); z=pathlib.Path(sys.argv[2]); a=zipfile.ZipFile(z,"w",compression=zipfile.ZIP_DEFLATED); [a.write(p,p.relative_to(s)) for p in sorted(s.rglob("*")) if p.is_file()]; a.close()' \
              "$source_dir" "release-assets/${base_name}.zip"
          }

          package_product() {
            local product="$1"
            local product_bin
            product_bin="$(find build -type f \( -name "$product" -o -name "$product.exe" \) | head -n 1)"

            if [ -z "$product_bin" ]; then
              echo "⚠ No built executable found for ${product}"
              return
            fi

            local product_dir
            local staging="staging-product-${product}"
            local notes_tool
            local product_title
            product_dir="$(dirname "$product_bin")"
            mkdir -p "${staging}"

            notes_tool="$(find build -type f \( -name 'installer_abstraction_notes' -o -name 'installer_abstraction_notes.exe' \) | head -n 1)"
            if [ -z "$notes_tool" ]; then
              echo "⚠ No installer notes generator found for ${product}"
              rm -rf "${staging}"
              return
            fi

            case "$product" in
              MStudio)
                product_title="MStudio"
                ;;
              file_browser)
                product_title="File Browser"
                ;;
              bower_shell)
                product_title="Bower Shell"
                ;;
              *)
                product_title="$product"
                ;;
            esac

            cp -v "$product_bin" "${staging}/"
            find "$product_dir" -maxdepth 1 -type f \( -name '*.dll' -o -name '*.so' -o -name '*.so.*' -o -name '*.dylib' \) -exec cp -v {} "${staging}/" \; 2>/dev/null || true
            "$notes_tool" pre-release "$product_title" "$product" > "${staging}/PRERELEASE.txt"
            "$notes_tool" install "$product_title" "$product" > "${staging}/INSTALL.txt"

            create_archives "${staging}" "coolbox-product-${product}-${{ matrix.platform }}-${{ github.ref_name }}"
            rm -rf "${staging}"
          }

          package_product MStudio
          package_product file_browser
          package_product bower_shell

      - name: Upload product build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: product-release-assets-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: ignore

      - name: Attach product archives to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          assets=(release-assets/*)
          if [ ${#assets[@]} -eq 0 ]; then
            echo "No product release assets found for ${{ matrix.platform }}"
            exit 0
          fi
          gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber --repo "${GITHUB_REPOSITORY}"