name: generate_purchase_swift

on:
  workflow_call:
    inputs:
      build_libs_run_id:
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: generate-purchase-swift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate_purchase_swift:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PLATFORM: linux-x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Swift
        uses: swift-actions/setup-swift@v3
        with:
          swift-version: "5.9"

      - name: Build Swift bindings
        run: |
          cd _deliverables/libraries/bindings/swift_bindings
          swift build -c release

      - name: Stage Swift bindings package
        run: |
          rm -rf release-assets staging-swift
          mkdir -p release-assets staging-swift/module staging-swift/bin
          cp -R _deliverables/libraries/bindings/swift_bindings/. staging-swift/module/
          find _deliverables/libraries/bindings/swift_bindings/.build/release -maxdepth 1 -type f \( -name '*.so' -o -name '*.a' -o -name '*.dylib' \) -exec cp {} staging-swift/bin/ \; || true
          tar -C staging-swift -czf release-assets/coolbox-swift-bindings-${PLATFORM}-${GITHUB_REF_NAME}.tar.gz .
          python -c 'import pathlib,sys,zipfile; s=pathlib.Path(sys.argv[1]); z=pathlib.Path(sys.argv[2]); a=zipfile.ZipFile(z,"w",compression=zipfile.ZIP_DEFLATED); [a.write(p,p.relative_to(s)) for p in sorted(s.rglob("*")) if p.is_file()]; a.close()' \
            staging-swift release-assets/coolbox-swift-bindings-${PLATFORM}-${GITHUB_REF_NAME}.zip

      - name: Finalize Swift release assets
        uses: ./.github/actions/finalize-purchase-assets
        with:
          assets_dir: release-assets
          ref_name: ${{ github.ref_name }}
          platform: ${{ env.PLATFORM }}
          workflow_name: ${{ github.workflow }}
          repository: ${{ github.repository }}
          commit_sha: ${{ github.sha }}
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}

      - name: Upload Swift archives
        uses: actions/upload-artifact@v7
        with:
          name: swift-extension-${{ env.PLATFORM }}-${{ github.ref_name }}
          path: |
            release-assets/coolbox-swift-bindings-${{ env.PLATFORM }}-${{ github.ref_name }}.tar.gz
            release-assets/coolbox-swift-bindings-${{ env.PLATFORM }}-${{ github.ref_name }}.zip
            release-assets/manifest.txt
            release-assets/SHA256SUMS
          retention-days: 14

      - name: Attach Swift archives to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release-assets/coolbox-swift-bindings-${PLATFORM}-${GITHUB_REF_NAME}.tar.gz \
            release-assets/coolbox-swift-bindings-${PLATFORM}-${GITHUB_REF_NAME}.zip \
            release-assets/manifest.txt#coolbox-swift-bindings-${PLATFORM}-${GITHUB_REF_NAME}.manifest.txt \
            release-assets/SHA256SUMS#coolbox-swift-bindings-${PLATFORM}-${GITHUB_REF_NAME}.SHA256SUMS \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"
