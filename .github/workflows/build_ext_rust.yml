name: build_ext_rust

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-ext-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_ext_rust:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Show Rust toolchain
        run: |
          rustc --version
          cargo --version

      - name: Build Rust bindings
        run: |
          cargo build --manifest-path _libraries/rust_bindings/Cargo.toml --release

      - name: Test Rust bindings
        run: |
          cargo test --manifest-path _libraries/rust_bindings/Cargo.toml --release

      - name: Package Rust crate
        if: runner.os == 'Linux'
        run: |
          rm -rf release-assets
          mkdir -p release-assets
          cargo package --manifest-path _libraries/rust_bindings/Cargo.toml --allow-dirty --no-verify
          cp _libraries/rust_bindings/target/package/*.crate release-assets/coolbox-rust-bindings-${GITHUB_REF_NAME}.crate

      - name: Upload Rust crate
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v6
        with:
          name: rust-extension-${{ github.ref_name }}
          path: release-assets/coolbox-rust-bindings-${{ github.ref_name }}.crate
          retention-days: 14

      - name: Attach Rust crate to release
        if: runner.os == 'Linux' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2.5.0
        with:
          files: release-assets/coolbox-rust-bindings-${{ github.ref_name }}.crate
