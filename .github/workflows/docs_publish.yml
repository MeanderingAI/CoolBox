name: Publish documentation

on:
  workflow_call:
    inputs:
      publish_branch:
        description: Branch that should receive the generated documentation site
        required: false
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      publish_branch:
        description: Branch that should receive the generated documentation site
        required: true
        default: gh-pages
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: docs-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_publish:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Resolve publish branch
        id: resolve-branch
        run: |
          if [ -n "${{ inputs.publish_branch }}" ]; then
            branch="${{ inputs.publish_branch }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            branch="${{ inputs.publish_branch }}"
          elif [ -n "${{ vars.DOCS_PUBLISH_BRANCH }}" ]; then
            branch="${{ vars.DOCS_PUBLISH_BRANCH }}"
          else
            branch="gh-pages"
          fi

          echo "Using publish branch: ${branch}"
          echo "publish_branch=${branch}" >> "$GITHUB_OUTPUT"

      - name: Resolve release tag
        id: resolve-release-tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            release_tag="${GITHUB_REF_NAME}"
          else
            release_tag="$(python - <<'PY'
          import json
          import os
          import urllib.request

          repo = os.environ.get('GITHUB_REPOSITORY', '')
          token = os.environ.get('GITHUB_TOKEN', '')
          if not repo:
            print('')
            raise SystemExit(0)

          request = urllib.request.Request(
            f'https://api.github.com/repos/{repo}/releases/latest',
            headers={
              'Accept': 'application/vnd.github+json',
              **({'Authorization': f'Bearer {token}'} if token else {}),
            },
          )

          try:
            with urllib.request.urlopen(request) as response:
              payload = json.load(response)
              print(payload.get('tag_name', ''))
          except Exception:
            print('')
          PY
          )"
          fi

          echo "Resolved release tag: ${release_tag}"
          echo "release_tag=${release_tag}" >> "$GITHUB_OUTPUT"

      - name: Set up Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Download prebuilt C++ docs
        uses: actions/download-artifact@v8
        with:
          name: cpp-doxygen-site
          path: .prebuilt/cpp-docs

      - name: Set up R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install documentation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz libcurl4-openssl-dev libssl-dev libxml2-dev libeigen3-dev python3-dev emscripten
          python -m pip install --upgrade pip setuptools wheel build pybind11 numpy

      - name: Suppress third-party R compile warnings
        run: |
          cat > "$RUNNER_TEMP/r-makevars" <<'EOF'
          CFLAGS += -w
          CXXFLAGS += -w
          CXX11FLAGS += -w
          CXX14FLAGS += -w
          CXX17FLAGS += -w
          CXX20FLAGS += -w
          FCFLAGS += -w
          FFLAGS += -w
          EOF
          echo "R_MAKEVARS_USER=$RUNNER_TEMP/r-makevars" >> "$GITHUB_ENV"
          echo "R_LIBS_USER=$GITHUB_WORKSPACE/.r-library" >> "$GITHUB_ENV"
          mkdir -p "$GITHUB_WORKSPACE/.r-library"

      - name: Install and verify R documentation packages
        run: |
          Rscript -e "lib <- Sys.getenv('R_LIBS_USER'); dir.create(lib, recursive = TRUE, showWarnings = FALSE); .libPaths(c(lib, .libPaths())); if (!requireNamespace('pak', quietly = TRUE)) install.packages('pak', repos = 'https://cloud.r-project.org', lib = lib); pak::pkg_install(c('cran::Rcpp', 'cran::devtools', 'cran::roxygen2', 'cran::pkgdown', 'cran::testthat'), ask = FALSE, lib = lib); print(.libPaths()); missing <- c('devtools', 'roxygen2', 'pkgdown')[!vapply(c('devtools', 'roxygen2', 'pkgdown'), requireNamespace, logical(1), quietly = TRUE)]; if (length(missing)) stop(sprintf('Missing R documentation packages: %s', paste(missing, collapse = ', ')))"

      - name: Build Python bindings
        continue-on-error: true
        run: |
          make build_python_bindings

      - name: Build Python distribution artifacts
        continue-on-error: true
        run: |
          python -m build ./_libraries/python_bindings --outdir ./_libraries/python_bindings/dist

      - name: Build JavaScript bindings
        continue-on-error: true
        run: |
          make build_js_bindings

      - name: Build unified docs site
        env:
          DOCS_REPOSITORY: ${{ github.repository }}
          DOCS_RELEASE_TAG: ${{ steps.resolve-release-tag.outputs.release_tag }}
          DOCS_CPP_DIR: ${{ github.workspace }}/.prebuilt/cpp-docs
        run: |
          bash ./_scripts/generate_docs_hub.sh "$GITHUB_WORKSPACE/.site"

      - name: Publish documentation branch
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .site
          publish_branch: ${{ steps.resolve-branch.outputs.publish_branch }}
          force_orphan: true
          enable_jekyll: false
