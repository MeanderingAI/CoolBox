name: Build Libraries & Release

on:
  workflow_call:
    outputs:
      run_id:
        description: Workflow run identifier for downstream artifact downloads
        value: ${{ jobs.build.outputs.run_id }}
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            lib_ext: "*.a -o -name *.so"
          - os: ubuntu-latest
            platform: linux-arm64
            lib_ext: "*.a -o -name *.so"
          - os: macos-latest
            platform: macos-arm64
            lib_ext: "*.a -o -name *.dylib"
          - os: macos-latest
            platform: macos-x86_64
            lib_ext: "*.a -o -name *.dylib"
          - os: windows-latest
            platform: windows-x86_64
            lib_ext: "*.lib -o -name *.dll"
          - os: windows-latest
            platform: windows-arm64
            lib_ext: "*.lib -o -name *.dll"

    runs-on: ${{ matrix.os }}
    outputs:
      run_id: ${{ steps.set_run_id.outputs.run_id }}
    name: Build (${{ matrix.platform }})
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup CMake 4.3.1
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.3.1'

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ make libeigen3-dev libgsl-dev libsqlite3-dev doxygen gfortran

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          for pkg in eigen gsl doxygen gcc sqlite; do
            brew list "$pkg" &>/dev/null || brew install "$pkg"
          done
          sqlite_prefix="$(brew --prefix sqlite)"
          echo "SQLITE3_ROOT=$sqlite_prefix" >> "$GITHUB_ENV"
          echo "SQLite3_ROOT=$sqlite_prefix" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$sqlite_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
          echo "$sqlite_prefix/bin" >> "$GITHUB_PATH"
          
      - name: Show CMake cache (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "=== build/CMakeCache.txt ==="
          if [ -f build/CMakeCache.txt ]; then
            grep -i 'BUILD_IO_SQL\|SQLite3' build/CMakeCache.txt || true
          else
            echo "No CMakeCache.txt found"
          fi

      - name: Install MSYS2 (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true

      - name: Install MSYS2 packages (Windows x86_64)
        if: runner.os == 'Windows' && matrix.platform == 'windows-x86_64'
        run: |
          set -e
          echo "Installing x86_64 packages"
          pacman -S --noconfirm --needed mingw-w64-x86_64-toolchain mingw-w64-x86_64-gcc mingw-w64-x86_64-eigen3 mingw-w64-x86_64-gsl mingw-w64-x86_64-sqlite3 bison make
        shell: msys2 {0}

      - name: Install MSYS2 packages (Windows ARM64)
        if: runner.os == 'Windows' && matrix.platform == 'windows-arm64'
        run: |
          set -e
          echo "Installing x64 helper packages for ARM64 cross-build"
          pacman -S --noconfirm --needed mingw-w64-x86_64-make bison
        shell: msys2 {0}

      - name: Install vcpkg dependencies (Windows ARM64)
        if: runner.os == 'Windows' && matrix.platform == 'windows-arm64'
        shell: powershell
        run: |
          function Find-VcpkgExe {
            $command = Get-Command vcpkg.exe -ErrorAction SilentlyContinue
            $candidates = @(
              $(if ($null -ne $command) { $command.Source }),
              $(if ($null -ne $command) { $command.Path }),
              $(if ($env:VCPKG_ROOT) { Join-Path $env:VCPKG_ROOT 'vcpkg.exe' }),
              'C:\vcpkg\vcpkg.exe',
              $(if ($env:USERPROFILE) { Join-Path $env:USERPROFILE 'vcpkg\vcpkg.exe' }),
              $(if ($env:LOCALAPPDATA) { Join-Path $env:LOCALAPPDATA 'vcpkg\vcpkg.exe' })
            ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique

            foreach ($candidate in $candidates) {
              if (Test-Path $candidate) {
                return $candidate
              }
            }

            return $null
          }

          $vcpkgExe = Find-VcpkgExe
          if ($null -eq $vcpkgExe) {
            & .\_scripts\install_vcpkg.ps1
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            $vcpkgExe = Find-VcpkgExe
          }

          if ($null -eq $vcpkgExe) {
            throw 'vcpkg.exe was not found after installation attempt. Windows ARM64 hosted cross-builds require vcpkg with arm64-windows dependencies.'
          }

          $vcpkgRoot = Split-Path -Parent $vcpkgExe
          Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$vcpkgRoot"
          Add-Content -Path $env:GITHUB_ENV -Value 'VCPKG_DEFAULT_TRIPLET=arm64-windows'

          & $vcpkgExe install eigen3:arm64-windows sqlite3:arm64-windows gsl:arm64-windows openssl:arm64-windows
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Ensure mingw in PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          $msysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          if ([string]::IsNullOrWhiteSpace($msysRoot) -or !(Test-Path $msysRoot)) {
            $msysRoot = "C:\\msys64"
          }
          if (!(Test-Path $msysRoot)) { $msysRoot = "C:\\tools\\msys64" }
          $targetBin = 'mingw64\bin'
          $msysBin = Join-Path $msysRoot $targetBin
          if (Test-Path $msysBin) { echo "$msysBin" >> $env:GITHUB_PATH }
          $usrBin = Join-Path $msysRoot 'usr\bin'
          if (Test-Path $usrBin) { echo "$usrBin" >> $env:GITHUB_PATH }
        shell: powershell

      - name: Verify CMake 4.3.1 is available (Windows)
        if: runner.os == 'Windows'
        run: |
          command -v cmake
          cmake --version
          cmake --version | grep 'cmake version 4.3.1'
        shell: msys2 {0}

      - name: Verify CMake 4.3.1 is available (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          command -v cmake
          cmake --version
          cmake --version | grep 'cmake version 4.3.1'

      - name: Configure CMake (Windows x86_64 / MSYS2)
        if: runner.os == 'Windows' && matrix.platform == 'windows-x86_64'
        run: |
          cmake -S . -B build -Wno-dev -G 'MinGW Makefiles' -DBUILD_BINARIES=OFF -DBUILD_PRODUCTS=ON -DBUILD_PRODUCT_INSTALLER_ABSTRACTIONS=ON -DBUILD_IO_SQL=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH='/mingw64'
        shell: msys2 {0}

      - name: Configure CMake (Windows ARM64 / MSVC cross-compile)
        if: runner.os == 'Windows' && matrix.platform == 'windows-arm64'
        shell: powershell
        run: |
          $vcpkgToolchain = Join-Path $env:VCPKG_ROOT 'scripts\buildsystems\vcpkg.cmake'
          if (!(Test-Path $vcpkgToolchain)) {
            throw "vcpkg toolchain file not found at $vcpkgToolchain"
          }

          $cmakeArgs = @(
            '-S', '.',
            '-B', 'build',
            '-Wno-dev',
            # Detect latest Visual Studio generator using script
            '-G', (powershell -File _scripts/detect_vs_generator.ps1),
            '-A', 'ARM64',
            '-DBUILD_BINARIES=OFF',
            '-DBUILD_PRODUCTS=ON',
            '-DBUILD_PRODUCT_INSTALLER_ABSTRACTIONS=ON',
            '-DBUILD_IO_SQL=ON',
            '-DBUILD_TESTING=ON',
            "-DCMAKE_TOOLCHAIN_FILE=$($vcpkgToolchain)",
            '-DVCPKG_TARGET_TRIPLET=arm64-windows'
          )

          & cmake @cmakeArgs
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Show CMake cache (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "=== build/CMakeCache.txt ==="
          if [ -f build/CMakeCache.txt ]; then
            grep -i 'BUILD_IO_SQL\|SQLite3' build/CMakeCache.txt || true
          else
            echo "No CMakeCache.txt found"
          fi

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ -n "$SQLITE3_ROOT" ]; then
            CMAKE_SQLITE_ARGS="-DSQLITE3_ROOT=$SQLITE3_ROOT -DSQLite3_ROOT=$SQLITE3_ROOT -DCMAKE_PREFIX_PATH=$SQLITE3_ROOT"
          else
            CMAKE_SQLITE_ARGS=""
          fi
          if [ -n "$CMAKE_TOOLCHAIN_FILE" ]; then
            CMAKE_EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE"
            cmake -S . -B build -Wno-dev -DBUILD_BINARIES=OFF -DBUILD_PRODUCTS=ON -DBUILD_PRODUCT_INSTALLER_ABSTRACTIONS=ON -DBUILD_IO_SQL=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release $CMAKE_EXTRA_ARGS $CMAKE_SQLITE_ARGS
          else
            cmake -S . -B build -Wno-dev -DBUILD_BINARIES=OFF -DBUILD_PRODUCTS=ON -DBUILD_PRODUCT_INSTALLER_ABSTRACTIONS=ON -DBUILD_IO_SQL=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release $CMAKE_SQLITE_ARGS
          fi

      - name: Prepare Windows signing environment
        if: runner.os == 'Windows'
        shell: powershell
        env:
          COOLBOX_WINDOWS_SIGN_CERT_BASE64_SECRET: ${{ secrets.COOLBOX_WINDOWS_SIGN_CERT_BASE64 }}
          COOLBOX_WINDOWS_SIGN_CERT_PASSWORD_SECRET: ${{ secrets.COOLBOX_WINDOWS_SIGN_CERT_PASSWORD }}
          COOLBOX_WINDOWS_SIGN_TIMESTAMP_URL_SECRET: ${{ secrets.COOLBOX_WINDOWS_SIGN_TIMESTAMP_URL }}
        run: |
          $sdkSearchRoots = @(
            "${env:ProgramFiles(x86)}\Windows Kits\10\bin",
            "${env:ProgramFiles}\Windows Kits\10\bin"
          ) | Where-Object { $_ -and (Test-Path $_) }

          function Find-SignTool {
            if (-not $sdkSearchRoots) {
              return $null
            }

            Get-ChildItem -Path $sdkSearchRoots -Recurse -Filter signtool.exe -ErrorAction SilentlyContinue |
              Sort-Object FullName -Descending |
              Select-Object -First 1
          }

          $signtool = Find-SignTool
          if (-not $signtool) {
            Write-Host 'signtool.exe was not found in the preinstalled Windows SDK. Installing the latest SDK.'
            make -f Makefile.win install_latest_windows_sdk
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
            $signtool = Find-SignTool
          }

          if (-not $signtool) {
            throw 'signtool.exe was not found after Windows SDK preparation.'
          }

          $signtoolDirectory = Split-Path -Parent $signtool.FullName
          Add-Content -Path $env:GITHUB_PATH -Value $signtoolDirectory

          $certDirectory = Join-Path $env:RUNNER_TEMP 'coolbox-signing'
          New-Item -ItemType Directory -Force -Path $certDirectory | Out-Null

          $certPath = Join-Path $certDirectory 'coolbox-release-signing.pfx'
          $certPassword = $env:COOLBOX_WINDOWS_SIGN_CERT_PASSWORD_SECRET
          $timestampUrl = $env:COOLBOX_WINDOWS_SIGN_TIMESTAMP_URL_SECRET
          if (-not $timestampUrl) {
            $timestampUrl = 'http://timestamp.digicert.com'
          }

          if ($env:COOLBOX_WINDOWS_SIGN_CERT_BASE64_SECRET) {
            Write-Host 'Using repository secret-backed Windows signing certificate.'
            $certBytes = [Convert]::FromBase64String($env:COOLBOX_WINDOWS_SIGN_CERT_BASE64_SECRET.Trim())
            [System.IO.File]::WriteAllBytes($certPath, $certBytes)
          } else {
            Write-Host 'No repository signing certificate secret configured. Falling back to a transient self-signed CI certificate.'
            $certPath = Join-Path $certDirectory 'coolbox-ci-signing.pfx'
            if (-not $certPassword) {
              $certPassword = "CoolBox-${{ github.run_id }}-${{ github.run_attempt }}"
            }
            make -f Makefile.win generate_windows_signing_cert WINDOWS_SIGN_CERT_OUTPUT_DIR="$certDirectory" WINDOWS_SIGN_CERT_FILE_NAME=coolbox-ci-signing WINDOWS_SIGN_CERT_PASSWORD="$certPassword" WINDOWS_SIGN_CERT_SUBJECT="CN=CoolBox CI Signing" WINDOWS_SIGN_CERT_FRIENDLY_NAME="CoolBox CI Signing"
            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

          Add-Content -Path $env:GITHUB_ENV -Value "COOLBOX_WINDOWS_SIGN_CERT_PATH=$certPath"
          Add-Content -Path $env:GITHUB_ENV -Value "COOLBOX_WINDOWS_SIGN_CERT_PASSWORD=$certPassword"
          Add-Content -Path $env:GITHUB_ENV -Value "COOLBOX_WINDOWS_SIGN_TIMESTAMP_URL=$timestampUrl"

      - name: Build all libraries
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            make -f Makefile.win build_libraries
          else
            make build_libraries
          fi

      - name: Build and run tests
        run: |
          if [ "$RUNNER_OS" = "Windows" ] && [ "${{ matrix.platform }}" = "windows-arm64" ]; then
            echo "Skipping Windows ARM64 test execution on x64 hosted runner; this job cross-compiles ARM64 artifacts with MSVC."
          elif [ "$RUNNER_OS" = "Windows" ]; then
            make -f Makefile.win test
          else
            make test
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.platform }}
          path: build/Testing/
          if-no-files-found: ignore

      - name: Package and upload LSP artifacts
        if: always()
        run: |
          set -e
          mkdir -p apps/lsp/dist || true
          cp build/apps/lsp/plang_lsp apps/lsp/dist/plang_lsp || cp build/plang_lsp apps/lsp/dist/plang_lsp || true
          cp build/apps/lsp/plrust_lsp apps/lsp/dist/plrust_lsp || cp build/plrust_lsp apps/lsp/dist/plrust_lsp || true
          cp build/apps/lsp/pljava_lsp apps/lsp/dist/pljava_lsp || cp build/pljava_lsp apps/lsp/dist/pljava_lsp || true
          cp build/apps/lsp/plpython_lsp apps/lsp/dist/plpython_lsp || cp build/plpython_lsp apps/lsp/dist/plpython_lsp || true
          cp build/apps/lsp/plvlang_lsp apps/lsp/dist/plvlang_lsp || cp build/plvlang_lsp apps/lsp/dist/plvlang_lsp || true
          cp build/apps/lsp/plc3_lsp apps/lsp/dist/plc3_lsp || cp build/plc3_lsp apps/lsp/dist/plc3_lsp || true
          if [ -d "apps/lsp/dist" ] && [ "$(ls -A apps/lsp/dist)" ]; then
            mkdir -p build
            tar -czf build/pl_lsp_dist.tar.gz -C apps/lsp dist
            ls -la build/pl_lsp_dist.tar.gz || true
          else
            echo "Warning: apps/lsp/dist does not exist or is empty"
          fi

      - name: Upload LSP dist archive
        uses: actions/upload-artifact@v7
        with:
          name: pl-lsp-dist-${{ matrix.platform }}-${{ github.ref_name }}
          path: build/pl_lsp_dist.tar.gz
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload individual LSP binaries (fallback)
        uses: actions/upload-artifact@v7
        with:
          name: pl-lsp-binaries-${{ matrix.platform }}-${{ github.ref_name }}
          path: |
            apps/lsp/dist/plang_lsp
            apps/lsp/dist/plrust_lsp
            apps/lsp/dist/pljava_lsp
            apps/lsp/dist/plpython_lsp
            apps/lsp/dist/plvlang_lsp
            apps/lsp/dist/plc3_lsp
          if-no-files-found: ignore
          retention-days: 14

      - name: Debug - list built library files
        run: |
          echo "=== All built library files ==="
          find build/_libraries \( -name '*.so' -o -name '*.dylib' -o -name '*.a' -o -name '*.dll' -o -name '*.lib' \) 2>/dev/null || echo "None found"

      - name: Package libraries by category
        run: |
          mkdir -p release-assets

          create_archives() {
            local source_dir="$1"
            local base_name="$2"

            tar czf "release-assets/${base_name}.tar.gz" -C "${source_dir}" .
            python -c 'import pathlib,sys,zipfile; s=pathlib.Path(sys.argv[1]); z=pathlib.Path(sys.argv[2]); a=zipfile.ZipFile(z,"w",compression=zipfile.ZIP_DEFLATED); [a.write(p,p.relative_to(s)) for p in sorted(s.rglob("*")) if p.is_file()]; a.close()' \
              "$source_dir" "release-assets/${base_name}.zip"
          }

          package_category() {
            local category="$1"    # e.g. IO, ML, security, ELECTRONICS, GRAPHICS, MISC
            local label="$2"       # e.g. io, ml, security, electronics, graphics, misc
            local src_dir="_libraries/packages/${category}"
            local build_dir="build/_libraries/packages/${category}"
            local staging="staging-${label}"

            echo "::group::Packaging ${label}"

            # Create staging with lib/ and include/ subdirectories
            mkdir -p "${staging}/lib" "${staging}/include"

            # Copy built shared libraries (.so, .dylib) and static archives (.a)
            local lib_count=0
            while IFS= read -r f; do
              [ -n "$f" ] && cp -v "$f" "${staging}/lib/" && lib_count=$((lib_count + 1))
            done < <(find "${build_dir}" \( -name '*.so' -o -name '*.dylib' -o -name '*.a' -o -name '*.dll' -o -name '*.lib' \) 2>/dev/null)

            # Copy header files from include/ and headers/ directories
            local hdr_count=0
            for hdr_dir in $(find "${src_dir}" -type d \( -name 'include' -o -name 'headers' \) 2>/dev/null); do
              lib_name=$(basename "$(dirname "$hdr_dir")")
              mkdir -p "${staging}/include/${lib_name}"
              cp -v "${hdr_dir}"/*.h "${staging}/include/${lib_name}/" 2>/dev/null && hdr_count=$((hdr_count + 1))
              cp -v "${hdr_dir}"/*.hpp "${staging}/include/${lib_name}/" 2>/dev/null && hdr_count=$((hdr_count + 1))
            done

            if [ "$lib_count" -gt 0 ] || [ "$hdr_count" -gt 0 ]; then
              create_archives "${staging}" "coolbox-${label}-${{ matrix.platform }}-${{ github.ref_name }}"
              echo "✓ Packaged ${label}: ${lib_count} libraries, headers from ${hdr_count} dirs"
            else
              echo "⚠ No artifacts found for ${label}"
            fi

            rm -rf "${staging}"
            echo "::endgroup::"
          }

          package_category IO          io
          package_category ML          ml
          package_category security    security
          package_category ELECTRONICS electronics
          package_category GRAPHICS    graphics
          package_category MISC        misc

      - name: Package all headers (full SDK, platform-independent)
        if: matrix.platform == 'linux-x86_64'
        run: |
          mkdir -p staging-headers
          find _libraries/packages -type d \( -name 'include' -o -name 'headers' \) | while read -r hdr_dir; do
            lib_name=$(basename "$(dirname "$hdr_dir")")
            mkdir -p "staging-headers/${lib_name}"
            cp "${hdr_dir}"/*.h "staging-headers/${lib_name}/" 2>/dev/null || true
            cp "${hdr_dir}"/*.hpp "staging-headers/${lib_name}/" 2>/dev/null || true
          done
            tar czf release-assets/coolbox-headers-${{ github.ref_name }}.tar.gz -C staging-headers .
                python -c 'import pathlib,sys,zipfile; s=pathlib.Path(sys.argv[1]); z=pathlib.Path(sys.argv[2]); a=zipfile.ZipFile(z,"w",compression=zipfile.ZIP_DEFLATED); [a.write(p,p.relative_to(s)) for p in sorted(s.rglob("*")) if p.is_file()]; a.close()' \
              "staging-headers" "release-assets/coolbox-headers-${{ github.ref_name }}.zip"
          rm -rf staging-headers

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/

      - name: Upload full build directory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coolbox-build-${{ matrix.platform }}-${{ github.ref_name }}
          path: build/
          if-no-files-found: ignore

      - name: Set workflow run id output
        id: set_run_id
        run: |
          echo "run_id=${GITHUB_RUN_ID:-}" >> $GITHUB_OUTPUT

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: all-assets
          merge-multiple: true

      - name: Create Release & Upload Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" all-assets/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" all-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Release ${GITHUB_REF_NAME}" \
              --generate-notes
          fi


