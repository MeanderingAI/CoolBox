name: Build Libraries & Release

on:
  workflow_call:
    outputs:
      run_id:
        description: Workflow run identifier for downstream artifact downloads
        value: ${{ jobs.build.outputs.run_id }}
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            lib_ext: "*.a -o -name *.so"
          - os: ubuntu-latest
            platform: linux-arm64
            lib_ext: "*.a -o -name *.so"
          - os: macos-latest
            platform: macos-arm64
            lib_ext: "*.a -o -name *.dylib"
          - os: macos-latest
            platform: macos-x86_64
            lib_ext: "*.a -o -name *.dylib"
          - os: windows-latest
            platform: windows-x86_64
            lib_ext: "*.lib -o -name *.dll"
          - os: windows-latest
            platform: windows-arm64
            lib_ext: "*.lib -o -name *.dll"

    runs-on: ${{ matrix.os }}
    outputs:
      run_id: ${{ steps.set_run_id.outputs.run_id }}
    name: Build (${{ matrix.platform }})
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # Linux dependencies
      - name: Linux dependency setup
        if: runner.os == 'Linux'
        uses: ./.github/workflows/fragments/deps-linux

      # Linux signing environment
      - name: Setup Linux signing environment
        if: runner.os == 'Linux'
        uses: ./.github/workflows/fragments/setup-sign-linux
        with:
          signing-key-base64: ${{ secrets.COOLBOX_SIGNING_KEY_BASE64 }}
          signing-key-password: ${{ secrets.COOLBOX_SIGNING_KEY_PASSWORD }}


      # macOS dependencies
      - name: macOS dependency setup
        if: runner.os == 'macOS'
        uses: ./.github/workflows/fragments/deps-macos

      # macOS signing environment
      - name: Setup macOS signing environment
        if: runner.os == 'macOS'
        uses: ./.github/workflows/fragments/setup-sign-macosx
        with:
          signing-cert-base64: ${{ secrets.COOLBOX_SIGNING_CERT_BASE64 }}
          signing-cert-password: ${{ secrets.COOLBOX_SIGNING_CERT_PASSWORD }}


      # Windows dependencies and signing environment
      - name: Windows dependency and signing setup
        if: runner.os == 'Windows'
        uses: ./.github/workflows/fragments/deps-windows

      # Windows signing environment
      - name: Setup Windows signing environment
        if: runner.os == 'Windows'
        uses: ./.github/workflows/fragments/setup-sign-windows
        with:
          signing-cert-base64: ${{ secrets.COOLBOX_WINDOWS_SIGN_CERT_BASE64 }}
          signing-cert-password: ${{ secrets.COOLBOX_WINDOWS_SIGN_CERT_PASSWORD }}
          signing-timestamp-url: ${{ secrets.COOLBOX_WINDOWS_SIGN_TIMESTAMP_URL }}


      - name: Build all libraries
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            make -f Makefile.win build_libraries
          else
            make build_libraries
          fi

      - name: Build and run tests
        id: release-tests
        run: |
          if [ "$RUNNER_OS" = "Windows" ] && [ "${{ matrix.platform }}" = "windows-arm64" ]; then
            echo "Skipping Windows ARM64 test execution on x64 hosted runner; this job cross-compiles ARM64 artifacts with MSVC."
          elif [ "$RUNNER_OS" = "Windows" ]; then
            make -f Makefile.win test
          else
            make test
          fi

      - name: Diagnose Windows graphics crashes
        if: failure() && steps.release-tests.outcome == 'failure' && matrix.platform == 'windows-x86_64'
        shell: msys2 {0}
        run: |
          set -euo pipefail
          mkdir -p build/Testing/graphics-debug
          diagnostic_status=0
          for target in charts_tests fonts_tests canvas_tests; do
            executable="$(find build -type f -name "$target.exe" -print -quit)"
            if [ -z "$executable" ]; then
              echo "Missing graphics test executable: $target.exe"
              diagnostic_status=1
              continue
            fi
            executable="$(realpath "$executable")"
            status=0
            (
              cd "$(dirname "$executable")"
              timeout 60s /mingw64/bin/gdb.exe --batch \
                -ex "set pagination off" \
                -ex "run" \
                -ex "thread apply all bt full" \
                -ex "info sharedlibrary" \
                --args "$executable"
            ) \
              > "build/Testing/graphics-debug/$target.log" 2>&1 || status=$?
            cat "build/Testing/graphics-debug/$target.log"
            echo "Debugger exit status for $target: $status"
            if [ "$status" -ne 0 ]; then
              diagnostic_status=1
            fi
          done
          exit "$diagnostic_status"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.platform }}
          path: build/Testing/
          if-no-files-found: ignore


      # LSP packaging and upload steps are now handled in the dedicated build-lsp workflow/job

      - name: Debug - list built library files
        run: |
          echo "=== All built library files ==="
          find build/_libraries \( -name '*.so' -o -name '*.dylib' -o -name '*.a' -o -name '*.dll' -o -name '*.lib' \) 2>/dev/null || echo "None found"

      - name: Package libraries by category
        run: |
          mkdir -p release-assets
          archive_count=0

          create_archives() {
            local source_dir="$1"
            local base_name="$2"

            tar czf "release-assets/${base_name}.tar.gz" -C "${source_dir}" .
            python -c 'import pathlib,sys,zipfile; s=pathlib.Path(sys.argv[1]); z=pathlib.Path(sys.argv[2]); a=zipfile.ZipFile(z,"w",compression=zipfile.ZIP_DEFLATED); [a.write(p,p.relative_to(s)) for p in sorted(s.rglob("*")) if p.is_file()]; a.close()' \
              "$source_dir" "release-assets/${base_name}.zip"
            archive_count=$((archive_count + 1))
          }

          package_category() {
            local category="$1"    # e.g. IO, ML, security, ELECTRONICS, GRAPHICS, MISC
            local label="$2"       # e.g. io, ml, security, electronics, graphics, misc
            local src_dir="_libraries/packages/${category}"
            local build_dir="build/_libraries/packages/${category}"
            local staging="staging-${label}"

            if [ ! -d "${src_dir}" ] && [ -d "_deliverables/libraries/groups/${category}" ]; then
              src_dir="_deliverables/libraries/groups/${category}"
            fi

            if [ ! -d "${build_dir}" ] && [ -d "build/_deliverables/libraries/groups/${category}" ]; then
              build_dir="build/_deliverables/libraries/groups/${category}"
            fi

            echo "::group::Packaging ${label}"

            # Create staging with lib/ and include/ subdirectories
            mkdir -p "${staging}/lib" "${staging}/include"

            # Copy built shared libraries (.so, .dylib) and static archives (.a)
            local lib_count=0
            while IFS= read -r f; do
              [ -n "$f" ] && cp -v "$f" "${staging}/lib/" && lib_count=$((lib_count + 1))
            done < <(find "${build_dir}" \( -name '*.so' -o -name '*.dylib' -o -name '*.a' -o -name '*.dll' -o -name '*.lib' \) 2>/dev/null)

            # Copy header files from include/ and headers/ directories
            local hdr_count=0
            for hdr_dir in $(find "${src_dir}" -type d \( -name 'include' -o -name 'headers' \) 2>/dev/null); do
              lib_name=$(basename "$(dirname "$hdr_dir")")
              mkdir -p "${staging}/include/${lib_name}"
              cp -v "${hdr_dir}"/*.h "${staging}/include/${lib_name}/" 2>/dev/null && hdr_count=$((hdr_count + 1))
              cp -v "${hdr_dir}"/*.hpp "${staging}/include/${lib_name}/" 2>/dev/null && hdr_count=$((hdr_count + 1))
            done

            if [ "$lib_count" -gt 0 ] || [ "$hdr_count" -gt 0 ]; then
              create_archives "${staging}" "coolbox-${label}-${{ matrix.platform }}-${{ github.ref_name }}"
              echo "✓ Packaged ${label}: ${lib_count} libraries, headers from ${hdr_count} dirs"
            else
              echo "⚠ No artifacts found for ${label}"
            fi

            rm -rf "${staging}"
            echo "::endgroup::"
          }

          package_category IO          io
          package_category ML          ml
          package_category security    security
          package_category ELECTRONICS electronics
          package_category GRAPHICS    graphics
          package_category MISC        misc

          if [ "$archive_count" -eq 0 ]; then
            echo "No category archives produced; creating fallback aggregate package from available build outputs."
            staging="staging-libraries-fallback"
            mkdir -p "${staging}/lib" "${staging}/include"

            lib_count=0
            while IFS= read -r f; do
              [ -n "$f" ] && cp -v "$f" "${staging}/lib/" && lib_count=$((lib_count + 1))
            done < <(find build -type f \( -name '*.so' -o -name '*.dylib' -o -name '*.a' -o -name '*.dll' -o -name '*.lib' \) 2>/dev/null)

            hdr_count=0
            while IFS= read -r hdr_dir; do
              lib_name=$(basename "$(dirname "$hdr_dir")")
              mkdir -p "${staging}/include/${lib_name}"
              cp -v "${hdr_dir}"/*.h "${staging}/include/${lib_name}/" 2>/dev/null || true
              cp -v "${hdr_dir}"/*.hpp "${staging}/include/${lib_name}/" 2>/dev/null || true
              hdr_count=$((hdr_count + 1))
            done < <(find _deliverables/libraries/groups -type d \( -name 'include' -o -name 'headers' \) 2>/dev/null)

            if [ "$lib_count" -gt 0 ] || [ "$hdr_count" -gt 0 ]; then
              create_archives "${staging}" "coolbox-libraries-${{ matrix.platform }}-${{ github.ref_name }}"
              echo "✓ Fallback package created: ${lib_count} libraries, ${hdr_count} header roots"
            else
              echo "⚠ No fallback artifacts found in build/ or _deliverables/libraries/groups"
            fi

            rm -rf "${staging}"
          fi

      - name: Package all headers (full SDK, platform-independent)
        if: matrix.platform == 'linux-x86_64'
        run: |
          mkdir -p staging-headers

          header_root=""
          if [ -d "_libraries/packages" ]; then
            header_root="_libraries/packages"
          elif [ -d "_deliverables/libraries/groups" ]; then
            header_root="_deliverables/libraries/groups"
          fi

          if [ -z "$header_root" ]; then
            echo "No header source root found (_libraries/packages or _deliverables/libraries/groups)."
          else
            find "$header_root" -type d \( -name 'include' -o -name 'headers' \) | while read -r hdr_dir; do
            lib_name=$(basename "$(dirname "$hdr_dir")")
            mkdir -p "staging-headers/${lib_name}"
            cp "${hdr_dir}"/*.h "staging-headers/${lib_name}/" 2>/dev/null || true
            cp "${hdr_dir}"/*.hpp "staging-headers/${lib_name}/" 2>/dev/null || true
            done
          fi

          tar czf release-assets/coolbox-headers-${{ github.ref_name }}.tar.gz -C staging-headers .
          python -c 'import pathlib,sys,zipfile; s=pathlib.Path(sys.argv[1]); z=pathlib.Path(sys.argv[2]); a=zipfile.ZipFile(z,"w",compression=zipfile.ZIP_DEFLATED); [a.write(p,p.relative_to(s)) for p in sorted(s.rglob("*")) if p.is_file()]; a.close()' \
              "staging-headers" "release-assets/coolbox-headers-${{ github.ref_name }}.zip"
          rm -rf staging-headers

      - name: Upload release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/
          if-no-files-found: ignore

      - name: Upload full build directory
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coolbox-build-${{ matrix.platform }}-${{ github.ref_name }}
          path: build/
          if-no-files-found: ignore

      - name: Set workflow run id output
        id: set_run_id
        run: |
          echo "run_id=${GITHUB_RUN_ID:-}" >> $GITHUB_OUTPUT

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: all-assets
          merge-multiple: true

      - name: Create Release & Upload Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" all-assets/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" all-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Release ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
