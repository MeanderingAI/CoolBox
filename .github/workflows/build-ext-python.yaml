name: build_ext_python

on:
  workflow_call:
    inputs:
      build_libs_run_id:
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-ext-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_ext_python:
    if: ${{ github.event_name == 'workflow_call' }}
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute artifact name
        id: compute_artifact
        run: |
          arch_env="${RUNNER_ARCH:-$(uname -m)}"
          arch_lc=$(echo "$arch_env" | tr '[:upper:]' '[:lower:]')
          if [[ "$arch_lc" == *arm* || "$arch_lc" == *aarch* ]]; then
            ARCH=arm64
          else
            ARCH=x86_64
          fi

          case "${RUNNER_OS}" in
            Linux) OSNAME=linux ;;
            macOS) OSNAME=macos ;;
            Windows) OSNAME=windows ;;
            *) OSNAME=linux ;;
          esac

          echo "artifact_name=coolbox-build-${OSNAME}-${ARCH}-${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "osname=${OSNAME}" >> $GITHUB_OUTPUT
          echo "arch=${ARCH}" >> $GITHUB_OUTPUT

      - name: Download built C++ libraries (from build_libs) (with run-id)
        id: download_build_with_run
        if: "${{ inputs.build_libs_run_id != '' }}"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ steps.compute_artifact.outputs.artifact_name }}
          path: build/
          run-id: ${{ inputs.build_libs_run_id }}

      - name: Download built C++ libraries (from build_libs) (no run-id)
        id: download_build
        if: "${{ inputs.build_libs_run_id == '' }}"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ steps.compute_artifact.outputs.artifact_name }}
          path: build/

      - name: Fallback download (run-id)
        if: "${{ inputs.build_libs_run_id != '' }}"
        uses: actions/download-artifact@v8
        with:
          pattern: "coolbox-build-${{ steps.compute_artifact.outputs.osname }}-${{ steps.compute_artifact.outputs.arch }}-*"
          path: build/
          merge-multiple: true

      - name: Fallback download (no run-id)
        if: "${{ inputs.build_libs_run_id == '' }}"
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ format('coolbox-build-{0}-{1}-*', steps.compute_artifact.outputs.osname, steps.compute_artifact.outputs.arch) }}
          path: build/
          merge-multiple: true

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make libeigen3-dev libsqlite3-dev libgsl-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          for pkg in cmake eigen sqlite gsl; do
            brew list "$pkg" &>/dev/null || brew install "$pkg"
          done

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install cmake -y
          $vcpkg = Get-Command vcpkg -ErrorAction SilentlyContinue
          if ($null -ne $vcpkg) {
            try {
              & $vcpkg.Source install eigen3:x64-windows sqlite3:x64-windows gsl:x64-windows
              "EIGEN3_INCLUDE_DIR=C:/vcpkg/installed/x64-windows/include/eigen3" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              "SQLITE3_LIB_DIR=C:/vcpkg/installed/x64-windows/lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              if (Test-Path "C:/vcpkg/installed/x64-windows/include") {
                "GSL_INCLUDE_DIR=C:/vcpkg/installed/x64-windows/include" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                "GSL_LIB_DIR=C:/vcpkg/installed/x64-windows/lib" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            } catch {
              Write-Host "vcpkg install failed, continuing"
            }
          } else {
            Write-Host "vcpkg not found, continuing"
          }
        shell: powershell

      - name: Prepare Eigen headers (Windows)
        if: runner.os == 'Windows'
        run: |
          $candidates = @(
            $env:EIGEN3_INCLUDE_DIR,
            "C:\vcpkg\installed\x64-windows\include\eigen3",
            "C:\vcpkg\installed\x64-windows\include",
            "C:\msys64\mingw64\include\eigen3",
            "C:\msys64\mingw64\include",
            "C:\tools\msys64\mingw64\include\eigen3",
            "C:\tools\msys64\mingw64\include"
          )
          New-Item -ItemType Directory -Force -Path build | Out-Null
          foreach ($candidate in $candidates) {
            if ([string]::IsNullOrWhiteSpace($candidate)) { continue }
            if (Test-Path $candidate) {
              if (Test-Path "build\eigen-src") {
                Remove-Item -Recurse -Force "build\eigen-src"
              }
              Copy-Item -Recurse -Force $candidate "build\eigen-src"
              $workspaceEigen = Join-Path $env:GITHUB_WORKSPACE "build\eigen-src"
              $workspaceEigen3 = Join-Path $workspaceEigen "eigen3"
              if (Test-Path (Join-Path $workspaceEigen "Eigen\Core")) {
                "EIGEN3_INCLUDE_DIR=$workspaceEigen" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                Write-Host "Using Eigen headers from $candidate copied to $workspaceEigen"
                exit 0
              }
              if (Test-Path (Join-Path $workspaceEigen3 "Eigen\Core")) {
                "EIGEN3_INCLUDE_DIR=$workspaceEigen3" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                Write-Host "Using Eigen headers from $candidate copied to $workspaceEigen3"
                exit 0
              }
              Write-Host "Copied $candidate but Eigen/Core was not found in the copied tree"
              Get-ChildItem -Path $workspaceEigen -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 40 | Format-Table -AutoSize
              Remove-Item -Recurse -Force "build\eigen-src" -ErrorAction SilentlyContinue
            }
          }
          throw "Unable to locate Eigen headers for Python bindings"
        shell: powershell

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip setuptools wheel build pybind11 numpy

      - name: Configure and build C++ libraries (top-level, enable tests)
        run: |
          if [ -d build/_libraries ]; then
            echo "Using downloaded build/ from build_libs; will probe existing targets"
            ls -la build/_libraries || true
          else
            mkdir -p build
            GSL_CMAKE_ARGS=""
            if [ "$(uname)" = "Darwin" ]; then
              if command -v brew >/dev/null 2>&1; then
                GSL_PREFIX="$(brew --prefix gsl 2>/dev/null || true)"
                if [ -n "$GSL_PREFIX" ]; then
                  GSL_CMAKE_ARGS="-DGSL_INCLUDE_DIR=$GSL_PREFIX/include -DGSL_LIBRARY=$GSL_PREFIX/lib/libgsl.dylib -DGSL_CBLAS_LIBRARY=$GSL_PREFIX/lib/libgslcblas.dylib"
                fi
              fi
            else
              if command -v pkg-config >/dev/null 2>&1 && pkg-config --exists gsl; then
                GSL_PREFIX="$(pkg-config --variable=prefix gsl)"
                GSL_CMAKE_ARGS="-DGSL_INCLUDE_DIR=$GSL_PREFIX/include -DGSL_LIBRARY=$GSL_PREFIX/lib/libgsl.so -DGSL_CBLAS_LIBRARY=$GSL_PREFIX/lib/libgslcblas.so"
              fi
            fi
            echo "Using GSL_CMAKE_ARGS=$GSL_CMAKE_ARGS"
            cmake -S . -B build -DBUILD_TESTING=ON -DBUILD_BINARIES=ON -DCMAKE_BUILD_TYPE=Release $GSL_CMAKE_ARGS
            cmake --build build --parallel || true
          fi

          echo "--- CMake available targets (first 200 lines) ---"
          cmake --build build --target help 2>&1 | head -n 200 || true

          echo "--- CTest configured tests ---"
          ctest --test-dir build -N || true

          help_out="$(cmake --build build --target help 2>&1 || true)"
          MISSING=(data_structures_tests battery_tests curcuitry_tests canvas_tests charts_tests components_tests fonts_tests windows_tests cryptocurrency_utils_tests password_hash_utils_tests metadata_management_tests thread_pool_tests wave_generator_utils_tests bayesian_network_tests decision_tree_tests deep_learning_tests dimensionality_reduction_tests distribution_tests gabor_patches_tests generalized_linear_model_tests hidden_markov_model_tests knn_tests latent_sentiment_analysis_tests marked_point_process_tests multi_arm_bandit_tests self_organizing_maps_tests support_vector_machine_tests tracker_tests vae_tests)
          for t in "${MISSING[@]}"; do
            if echo "$help_out" | awk '{print $1}' | grep -q "^${t}$"; then
              echo "[PRESENT] Building $t"
              cmake --build build --target "$t" --parallel || echo "::warning::Failed to build $t"
            else
              echo "[MISSING] $t not present in build help"
            fi
          done
        shell: bash

      - name: Set COOLBOX_LIB_DIR for Python build
        run: |
          echo "COOLBOX_LIB_DIR=${GITHUB_WORKSPACE}/build" >> $GITHUB_ENV
        shell: bash

      - name: Build Python bindings
        run: |
          cd _libraries/python_bindings
          rm -rf build dist ml_toolbox.egg-info vendor_include vendor_src
          python setup.py build
          python -m build --outdir ./dist

      - name: Package Python tarball
        run: |
          rm -rf release-assets staging-python
          mkdir -p release-assets staging-python
          cp -R _libraries/python_bindings/dist/. staging-python/ 2>/dev/null || true
          find _libraries/python_bindings -type f \( -name '*.so' -o -name '*.pyd' -o -name '*.dylib' -o -name '*.dll' \) -exec cp {} staging-python/ \;
          tar -C staging-python -czf release-assets/coolbox-python-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.tar.gz .
          python -c 'import pathlib,sys,zipfile; s=pathlib.Path(sys.argv[1]); z=pathlib.Path(sys.argv[2]); a=zipfile.ZipFile(z,"w",compression=zipfile.ZIP_DEFLATED); [a.write(p,p.relative_to(s)) for p in sorted(s.rglob("*")) if p.is_file()]; a.close()' \
            staging-python release-assets/coolbox-python-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.zip

      - name: Upload Python archives
        uses: actions/upload-artifact@v7
        with:
          name: python-extension-${{ matrix.platform }}-${{ github.ref_name }}
          path: |
            release-assets/coolbox-python-bindings-${{ matrix.platform }}-${{ github.ref_name }}.tar.gz
            release-assets/coolbox-python-bindings-${{ matrix.platform }}-${{ github.ref_name }}.zip
          retention-days: 14

      - name: Attach Python archives to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release-assets/coolbox-python-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.tar.gz \
            release-assets/coolbox-python-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.zip \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"
