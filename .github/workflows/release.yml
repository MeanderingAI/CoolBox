name: Build Libraries & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            lib_ext: "*.a -o -name *.so"
          - os: macos-latest
            platform: macos-arm64
            lib_ext: "*.a -o -name *.dylib"

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make libeigen3-dev libgtest-dev libgsl-dev doxygen

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install cmake eigen googletest gsl doxygen

      - name: Configure CMake (libraries only)
        run: cmake -S . -B build -DBUILD_BINARIES=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build all libraries
        run: |
          cd build
          for f in $(find ../_libraries/backages -name CMakeLists.txt); do
            for t in $(grep -E '^add_library' "$f" 2>/dev/null | grep -v 'INTERFACE' | sed -E 's/add_library\(([^ ]+).*/\1/'); do
              echo "::group::Building $t"
              cmake --build . --target "$t" || echo "::warning::Failed to build $t"
              echo "::endgroup::"
            done
          done

      - name: Build all tests
        run: |
          cd build
          for f in $(find ../_libraries/backages -name CMakeLists.txt); do
            for t in $(grep -E '^add_executable.*_tests' "$f" 2>/dev/null | sed -E 's/add_executable\(([^ ]+).*/\1/'); do
              echo "::group::Building test $t"
              cmake --build . --target "$t" || echo "::warning::Failed to build test $t"
              echo "::endgroup::"
            done
          done

      - name: Run tests
        run: |
          cd build
          echo "::group::CTest Results"
          ctest --output-on-failure --no-compress-output -T Test -R "Tests$" 2>&1 || true
          echo "::endgroup::"
          echo ""
          echo "═══════════════════════════════════════════"
          echo "  TEST RESULTS SUMMARY (${{ matrix.platform }})"
          echo "═══════════════════════════════════════════"
          ctest --output-on-failure -R "Tests$" 2>&1 | tail -20
          echo ""

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}
          path: build/Testing/
          if-no-files-found: ignore

      - name: Package IO libraries
        run: |
          mkdir -p release-assets
          tar czf release-assets/coolbox-io-${{ matrix.platform }}-${{ github.ref_name }}.tar.gz \
            _libraries/backages/IO/*/include \
            _libraries/backages/IO/*/headers \
            $(find build/_libraries/backages/IO -name '*.a' -o -name '*.so' -o -name '*.dylib' 2>/dev/null) \
            2>/dev/null || echo "No IO artifacts"

      - name: Package ML libraries
        run: |
          tar czf release-assets/coolbox-ml-${{ matrix.platform }}-${{ github.ref_name }}.tar.gz \
            _libraries/backages/ML/*/include \
            _libraries/backages/ML/*/headers \
            $(find build/_libraries/backages/ML -name '*.a' -o -name '*.so' -o -name '*.dylib' 2>/dev/null) \
            2>/dev/null || echo "No ML artifacts"

      - name: Package Security libraries
        run: |
          tar czf release-assets/coolbox-security-${{ matrix.platform }}-${{ github.ref_name }}.tar.gz \
            _libraries/backages/security/*/include \
            _libraries/backages/security/*/headers \
            $(find build/_libraries/backages/security -name '*.a' -o -name '*.so' -o -name '*.dylib' 2>/dev/null) \
            2>/dev/null || echo "No Security artifacts"

      - name: Package Electronics libraries
        run: |
          tar czf release-assets/coolbox-electronics-${{ matrix.platform }}-${{ github.ref_name }}.tar.gz \
            _libraries/backages/ELECTRONICS/*/include \
            $(find build/_libraries/backages/ELECTRONICS -name '*.a' -o -name '*.so' -o -name '*.dylib' 2>/dev/null) \
            2>/dev/null || echo "No Electronics artifacts"

      - name: Package Graphics libraries
        run: |
          tar czf release-assets/coolbox-graphics-${{ matrix.platform }}-${{ github.ref_name }}.tar.gz \
            _libraries/backages/GRAPHICS/*/include \
            _libraries/backages/GRAPHICS/*/headers \
            $(find build/_libraries/backages/GRAPHICS -name '*.a' -o -name '*.so' -o -name '*.dylib' 2>/dev/null) \
            2>/dev/null || echo "No Graphics artifacts"

      - name: Package Misc libraries
        run: |
          tar czf release-assets/coolbox-misc-${{ matrix.platform }}-${{ github.ref_name }}.tar.gz \
            _libraries/backages/MISC/*/include \
            _libraries/backages/MISC/*/headers \
            $(find build/_libraries/backages/MISC -name '*.a' -o -name '*.so' -o -name '*.dylib' 2>/dev/null) \
            2>/dev/null || echo "No Misc artifacts"

      - name: Package all headers (full SDK, platform-independent)
        if: matrix.platform == 'linux-x86_64'
        run: |
          tar czf release-assets/coolbox-headers-${{ github.ref_name }}.tar.gz \
            $(find _libraries/backages -name 'include' -type d -o -name 'headers' -type d) \
            2>/dev/null || echo "No headers found"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: all-assets
          merge-multiple: true

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: all-assets/*
