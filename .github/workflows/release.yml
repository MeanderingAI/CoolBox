name: Build Libraries & Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            lib_ext: "*.a -o -name *.so"
          - os: macos-latest
            platform: macos-arm64
            lib_ext: "*.a -o -name *.dylib"
          - os: windows-latest
            platform: windows-x86_64
            lib_ext: "*.lib -o -name *.dll"

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make libeigen3-dev libgtest-dev libgsl-dev doxygen

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          for pkg in cmake eigen googletest gsl doxygen; do
            brew list "$pkg" &>/dev/null || brew install "$pkg"
          done

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install doxygen.install -y
          choco install mingw -y
          vcpkg install gsl:x64-windows sqlite3:x64-windows
          echo "CMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" >> $env:GITHUB_ENV
        shell: powershell

      - name: Configure CMake (libraries only)
        run: |
          CMAKE_EXTRA_ARGS=""
          if [ -n "$CMAKE_TOOLCHAIN_FILE" ]; then
            CMAKE_EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE"
          fi
          cmake -S . -B build -DBUILD_BINARIES=OFF -DCMAKE_BUILD_TYPE=Release $CMAKE_EXTRA_ARGS

      - name: Build all libraries
        run: |
          cd build
          for f in $(find ../_libraries/backages -name CMakeLists.txt); do
            for t in $(grep -E '^add_library' "$f" 2>/dev/null | grep -v 'INTERFACE' | sed -E 's/add_library\(([^ ]+).*/\1/'); do
              echo "::group::Building $t"
              cmake --build . --target "$t" --config Release || echo "::warning::Failed to build $t"
              echo "::endgroup::"
            done
          done

      - name: Build all tests
        run: |
          cd build
          for f in $(find ../_libraries/backages -name CMakeLists.txt); do
            for t in $(grep -E 'add_executable.*_tests' "$f" 2>/dev/null | sed -E 's/.*add_executable\(([^ ]+).*/\1/'); do
              echo "::group::Building test $t"
              cmake --build . --target "$t" --config Release || echo "::warning::Failed to build test $t"
              echo "::endgroup::"
            done
          done

      - name: Run tests
        run: |
          cd build
          echo "::group::CTest Results"
          ctest --output-on-failure --no-compress-output -T Test -R "Tests$" 2>&1 || true
          echo "::endgroup::"
          echo ""
          echo "═══════════════════════════════════════════"
          echo "  TEST RESULTS SUMMARY (${{ matrix.platform }})"
          echo "═══════════════════════════════════════════"
          ctest --output-on-failure -R "Tests$" 2>&1 | tail -20
          echo ""

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.platform }}
          path: build/Testing/
          if-no-files-found: ignore

      - name: Debug - list built library files
        run: |
          echo "=== All built library files ==="
          find build/_libraries \( -name '*.so' -o -name '*.dylib' -o -name '*.a' -o -name '*.dll' -o -name '*.lib' \) 2>/dev/null || echo "None found"

      - name: Package libraries by category
        run: |
          mkdir -p release-assets

          package_category() {
            local category="$1"    # e.g. IO, ML, security, ELECTRONICS, GRAPHICS, MISC
            local label="$2"       # e.g. io, ml, security, electronics, graphics, misc
            local src_dir="_libraries/backages/${category}"
            local build_dir="build/_libraries/backages/${category}"
            local staging="staging-${label}"

            echo "::group::Packaging ${label}"

            # Create staging with lib/ and include/ subdirectories
            mkdir -p "${staging}/lib" "${staging}/include"

            # Copy built shared libraries (.so, .dylib) and static archives (.a)
            local lib_count=0
            while IFS= read -r f; do
              [ -n "$f" ] && cp -v "$f" "${staging}/lib/" && lib_count=$((lib_count + 1))
            done < <(find "${build_dir}" \( -name '*.so' -o -name '*.dylib' -o -name '*.a' -o -name '*.dll' -o -name '*.lib' \) 2>/dev/null)

            # Copy header files from include/ and headers/ directories
            local hdr_count=0
            for hdr_dir in $(find "${src_dir}" -type d \( -name 'include' -o -name 'headers' \) 2>/dev/null); do
              lib_name=$(basename "$(dirname "$hdr_dir")")
              mkdir -p "${staging}/include/${lib_name}"
              cp -v "${hdr_dir}"/*.h "${staging}/include/${lib_name}/" 2>/dev/null && hdr_count=$((hdr_count + 1))
              cp -v "${hdr_dir}"/*.hpp "${staging}/include/${lib_name}/" 2>/dev/null && hdr_count=$((hdr_count + 1))
            done

            if [ "$lib_count" -gt 0 ] || [ "$hdr_count" -gt 0 ]; then
              tar czf "release-assets/coolbox-${label}-${{ matrix.platform }}-${{ github.ref_name }}.tar.gz" \
                -C "${staging}" lib include
              echo "✓ Packaged ${label}: ${lib_count} libraries, headers from ${hdr_count} dirs"
            else
              echo "⚠ No artifacts found for ${label}"
            fi

            rm -rf "${staging}"
            echo "::endgroup::"
          }

          package_category IO          io
          package_category ML          ml
          package_category security    security
          package_category ELECTRONICS electronics
          package_category GRAPHICS    graphics
          package_category MISC        misc

      - name: Package all headers (full SDK, platform-independent)
        if: matrix.platform == 'linux-x86_64'
        run: |
          mkdir -p staging-headers
          find _libraries/backages -type d \( -name 'include' -o -name 'headers' \) | while read -r hdr_dir; do
            lib_name=$(basename "$(dirname "$hdr_dir")")
            mkdir -p "staging-headers/${lib_name}"
            cp "${hdr_dir}"/*.h "staging-headers/${lib_name}/" 2>/dev/null || true
            cp "${hdr_dir}"/*.hpp "staging-headers/${lib_name}/" 2>/dev/null || true
          done
          tar czf release-assets/coolbox-headers-${{ github.ref_name }}.tar.gz -C staging-headers .
          rm -rf staging-headers

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release

    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-assets-*
          path: all-assets
          merge-multiple: true

      - name: Create Release & Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          files: all-assets/*
