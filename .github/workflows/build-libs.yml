name: Build libraries

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-libs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl pkg-config

      - name: Configure CMake (enable tests)
        run: |
          cmake -S . -B build -DBUILD_BINARIES=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release

      - name: Build libraries and targets
        run: cmake --build build --parallel

      - name: List configured tests
        run: |
          mkdir -p build
          echo "Configured CTest tests:" > build/ctest_list.txt
          ctest --test-dir build -N >> build/ctest_list.txt || true
          echo "--- end of test list ---"

      - name: Package built test binaries
        run: |
          set -e
          mkdir -p build/test-binaries
          shopt -s globstar || true
          # Find built test executables (common suffixes) and copy them
          for f in build/**/*_tests build/**/*_test build/**/tests/*; do
            if [ -f "$f" ] && [ -x "$f" ]; then
              dest="build/test-binaries/$(basename "$f")"
              cp "$f" "$dest" || true
            fi
          done
          if [ -d build/test-binaries ] && [ "$(ls -A build/test-binaries)" ]; then
            tar -czf build/test_binaries.tar.gz -C build test-binaries
            ls -la build/test_binaries.tar.gz
          else
            echo "No test binaries found to package"
          fi

      - name: Upload test binaries artifact
        uses: actions/upload-artifact@v4
        with:
          name: test_binaries
          path: build/test_binaries.tar.gz
          retention-days: 14

      - name: Prepare binaries for artifacts
        run: |
          mkdir -p apps/lsp/dist
          cp build/apps/lsp/plang_lsp apps/lsp/dist/plang_lsp || cp build/plang_lsp apps/lsp/dist/plang_lsp || true
          cp build/apps/lsp/plrust_lsp apps/lsp/dist/plrust_lsp || cp build/plrust_lsp apps/lsp/dist/plrust_lsp || true
          cp build/apps/lsp/pljava_lsp apps/lsp/dist/pljava_lsp || cp build/pljava_lsp apps/lsp/dist/pljava_lsp || true
          cp build/apps/lsp/plpython_lsp apps/lsp/dist/plpython_lsp || cp build/plpython_lsp apps/lsp/dist/plpython_lsp || true
      - name: Build and package notepad product (per-platform)
        run: |
          set -e
          if [ -f "_Product/notepad/Makefile" ]; then
            echo "Building _Product/notepad on ${matrix.platform}..."
            make -C _Product/notepad || true
            mkdir -p release-assets
            if [ -d "_Product/notepad/bin" ] && [ "$(ls -A _Product/notepad/bin)" ]; then
              base="notepad-${{ matrix.platform }}-${{ github.ref_name }}"
              tar -czf "release-assets/${base}.tar.gz" -C _Product/notepad bin
              python -c 'import pathlib,sys,zipfile; s=pathlib.Path(sys.argv[1]); z=pathlib.Path(sys.argv[2]); a=zipfile.ZipFile(z,"w",compression=zipfile.ZIP_DEFLATED); [a.write(p,p.relative_to(s)) for p in sorted(s.rglob("*")) if p.is_file()]; a.close()' \
                _Product/notepad release-assets/${base}.zip || true
              echo "Packaged notepad -> release-assets/${base}.tar.gz"
            else
              echo "No notepad binary found to package for ${matrix.platform}"
            fi
          else
            echo "No _Product/notepad/Makefile found; skipping notepad packaging"
          fi
      - name: Package LSP dist directory
        run: |
          set -e
          if [ -d "apps/lsp/dist" ] && [ "$(ls -A apps/lsp/dist)" ]; then
            mkdir -p build
            tar -czf build/pl_lsp_dist.tar.gz -C apps/lsp dist
            ls -la build/pl_lsp_dist.tar.gz
          else
            echo "Warning: apps/lsp/dist does not exist or is empty"
          fi

      - name: Upload LSP dist archive
        uses: actions/upload-artifact@v4
        with:
          name: pl_lsp_dist
          path: build/pl_lsp_dist.tar.gz
          retention-days: 14

      - name: Upload individual LSP binaries (fallback)
        uses: actions/upload-artifact@v4
        with:
          name: plang_lsp
          path: |
            apps/lsp/dist/plang_lsp
            apps/lsp/dist/plrust_lsp
            apps/lsp/dist/pljava_lsp
            apps/lsp/dist/plpython_lsp
          retention-days: 14
