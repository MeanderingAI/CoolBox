name: generate_purchase_v

on:
  workflow_call:
    inputs:
      build_libs_run_id:
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: generate-purchase-v-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate_purchase_v:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PLATFORM: linux-x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install native build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - name: Build C bindings required by V package
        run: |
          cmake -S _deliverables/libraries/bindings/c_bindings -B _deliverables/libraries/bindings/c_bindings/build -DBUILD_TESTING=ON
          cmake --build _deliverables/libraries/bindings/c_bindings/build --config Release
          ctest --test-dir _deliverables/libraries/bindings/c_bindings/build --output-on-failure

      - name: Stage V bindings package
        run: |
          rm -rf release-assets staging-v
          mkdir -p release-assets staging-v/module staging-v/native/include staging-v/native/lib
          cp -R _deliverables/libraries/bindings/vlang_bindings/. staging-v/module/
          cp -R _deliverables/libraries/bindings/c_bindings/include/. staging-v/native/include/
          find _deliverables/libraries/bindings/c_bindings/build -maxdepth 1 -type f \( -name 'libcoolbox_c_bindings.*' -o -name 'coolbox_c_bindings.lib' -o -name 'coolbox_c_bindings.dll' \) -exec cp {} staging-v/native/lib/ \;
          tar -C staging-v -czf release-assets/coolbox-v-bindings-${PLATFORM}-${GITHUB_REF_NAME}.tar.gz .
          python -c 'import pathlib,sys,zipfile; s=pathlib.Path(sys.argv[1]); z=pathlib.Path(sys.argv[2]); a=zipfile.ZipFile(z,"w",compression=zipfile.ZIP_DEFLATED); [a.write(p,p.relative_to(s)) for p in sorted(s.rglob("*")) if p.is_file()]; a.close()' \
            staging-v release-assets/coolbox-v-bindings-${PLATFORM}-${GITHUB_REF_NAME}.zip

      - name: Finalize V release assets
        uses: ./.github/actions/finalize-purchase-assets
        with:
          assets_dir: release-assets
          ref_name: ${{ github.ref_name }}
          platform: ${{ env.PLATFORM }}
          workflow_name: ${{ github.workflow }}
          repository: ${{ github.repository }}
          commit_sha: ${{ github.sha }}
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}

      - name: Upload V archives
        uses: actions/upload-artifact@v7
        with:
          name: v-extension-${{ env.PLATFORM }}-${{ github.ref_name }}
          path: |
            release-assets/coolbox-v-bindings-${{ env.PLATFORM }}-${{ github.ref_name }}.tar.gz
            release-assets/coolbox-v-bindings-${{ env.PLATFORM }}-${{ github.ref_name }}.zip
            release-assets/manifest.txt
            release-assets/SHA256SUMS
          retention-days: 14

      - name: Attach V archives to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release-assets/coolbox-v-bindings-${PLATFORM}-${GITHUB_REF_NAME}.tar.gz \
            release-assets/coolbox-v-bindings-${PLATFORM}-${GITHUB_REF_NAME}.zip \
            release-assets/manifest.txt#coolbox-v-bindings-${PLATFORM}-${GITHUB_REF_NAME}.manifest.txt \
            release-assets/SHA256SUMS#coolbox-v-bindings-${PLATFORM}-${GITHUB_REF_NAME}.SHA256SUMS \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"