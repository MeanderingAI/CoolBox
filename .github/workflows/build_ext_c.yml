name: build_ext_c

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-ext-c-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_ext_c:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install native build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential doxygen

      - name: Configure C bindings
        run: |
          cmake -S _libraries/c_bindings -B _libraries/c_bindings/build -DBUILD_TESTING=ON

      - name: Build C bindings
        run: |
          cmake --build _libraries/c_bindings/build --config Release

      - name: Test C bindings
        run: |
          ctest --test-dir _libraries/c_bindings/build --output-on-failure

      - name: Generate C binding docs
        run: |
          rm -rf _libraries/c_bindings/target
          bash _libraries/c_bindings/generate_docs.sh

      - name: Stage C bindings package
        run: |
          rm -rf release-assets staging-c
          mkdir -p release-assets staging-c/include staging-c/lib
          cp -R _libraries/c_bindings/include/. staging-c/include/
          cp -R _libraries/c_bindings/target/. staging-c/
          find _libraries/c_bindings/build -maxdepth 1 -type f \( -name 'libcoolbox_c_bindings.*' -o -name 'coolbox_c_bindings.lib' -o -name 'coolbox_c_bindings.dll' \) -exec cp {} staging-c/lib/ \;
          tar -C staging-c -czf release-assets/coolbox-c-bindings-linux-x86_64-${GITHUB_REF_NAME}.tar.gz .

      - name: Upload C tarball
        uses: actions/upload-artifact@v6
        with:
          name: c-extension-linux-x86_64-${{ github.ref_name }}
          path: release-assets/coolbox-c-bindings-linux-x86_64-${{ github.ref_name }}.tar.gz
          retention-days: 14

      - name: Attach C tarball to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/coolbox-c-bindings-linux-x86_64-${{ github.ref_name }}.tar.gz
