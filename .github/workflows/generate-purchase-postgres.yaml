name: generate_purchase_postgres

on:
  workflow_call:
    inputs:
      build_libs_run_id:
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: generate-purchase-postgres-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate_purchase_postgres:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PLATFORM: linux-x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Validate Postgres binding scripts
        run: |
          python _scripts/build_scripts/build_extensions.py postgres_bindings

      - name: Stage Postgres bindings package
        run: |
          rm -rf release-assets staging-postgres
          mkdir -p release-assets staging-postgres
          cp -R _deliverables/libraries/bindings/postgres_bindings/. staging-postgres/
          tar -C staging-postgres -czf release-assets/coolbox-postgres-bindings-${PLATFORM}-${GITHUB_REF_NAME}.tar.gz .
          python -c 'import pathlib,sys,zipfile; s=pathlib.Path(sys.argv[1]); z=pathlib.Path(sys.argv[2]); a=zipfile.ZipFile(z,"w",compression=zipfile.ZIP_DEFLATED); [a.write(p,p.relative_to(s)) for p in sorted(s.rglob("*")) if p.is_file()]; a.close()' \
            staging-postgres release-assets/coolbox-postgres-bindings-${PLATFORM}-${GITHUB_REF_NAME}.zip

      - name: Finalize Postgres release assets
        uses: ./.github/actions/finalize-purchase-assets
        with:
          assets_dir: release-assets
          ref_name: ${{ github.ref_name }}
          platform: ${{ env.PLATFORM }}
          workflow_name: ${{ github.workflow }}
          repository: ${{ github.repository }}
          commit_sha: ${{ github.sha }}
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}

      - name: Upload Postgres archives
        uses: actions/upload-artifact@v7
        with:
          name: postgres-extension-${{ env.PLATFORM }}-${{ github.ref_name }}
          path: |
            release-assets/coolbox-postgres-bindings-${{ env.PLATFORM }}-${{ github.ref_name }}.tar.gz
            release-assets/coolbox-postgres-bindings-${{ env.PLATFORM }}-${{ github.ref_name }}.zip
            release-assets/manifest.txt
            release-assets/SHA256SUMS
          retention-days: 14

      - name: Attach Postgres archives to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release-assets/coolbox-postgres-bindings-${PLATFORM}-${GITHUB_REF_NAME}.tar.gz \
            release-assets/coolbox-postgres-bindings-${PLATFORM}-${GITHUB_REF_NAME}.zip \
            release-assets/manifest.txt#coolbox-postgres-bindings-${PLATFORM}-${GITHUB_REF_NAME}.manifest.txt \
            release-assets/SHA256SUMS#coolbox-postgres-bindings-${PLATFORM}-${GITHUB_REF_NAME}.SHA256SUMS \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"
