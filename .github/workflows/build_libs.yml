name: Build Libraries & Release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            lib_ext: "*.a -o -name *.so"
          - os: macos-latest
            platform: macos-arm64
            lib_ext: "*.a -o -name *.dylib"
          - os: windows-latest
            platform: windows-x86_64
            lib_ext: "*.lib -o -name *.dll"

    runs-on: ${{ matrix.os }}
    name: Build (${{ matrix.platform }})
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make libeigen3-dev libgtest-dev libgsl-dev libsqlite3-dev doxygen gfortran

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          for pkg in cmake eigen googletest gsl doxygen gcc; do
            brew list "$pkg" &>/dev/null || brew install "$pkg"
          done
          # Ensure sqlite is available for find_package(SQLite3)
          brew list sqlite &>/dev/null || brew install sqlite
          
      - name: Show CMake cache (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "=== build/CMakeCache.txt ==="
          if [ -f build/CMakeCache.txt ]; then
            grep -i 'BUILD_IO_SQL\|SQLite3' build/CMakeCache.txt || true
          else
            echo "No CMakeCache.txt found"
          fi

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: |
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-sqlite3

      - name: Ensure mingw64 in PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          $msysBin = "C:\\msys64\\mingw64\\bin"
          if (!(Test-Path $msysBin)) { $msysBin = "C:\\tools\\msys64\\mingw64\\bin" }
          echo "$msysBin" >> $env:GITHUB_PATH
        shell: powershell

      - name: Install Windows packages via vcpkg (optional)
        if: runner.os == 'Windows'
        run: |
          try {
            & vcpkg install gsl:x64-windows sqlite3:x64-windows
          } catch {
            Write-Host "vcpkg install failed or vcpkg not available, continuing"
          }
        shell: powershell

      - name: Configure CMake (Windows / MSYS2)
        if: runner.os == 'Windows'
        run: |
          echo "Running CMake inside MSYS2 so mingw/gfortran/sqlite is available"
          CMAKE_EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=C:/vcpkg/scripts/buildsystems/vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows"
          bash -lc "cmake -S . -B build -Wno-dev -G 'MinGW Makefiles' -DBUILD_BINARIES=OFF -DBUILD_IO_SQL=ON -DCMAKE_BUILD_TYPE=Release $CMAKE_EXTRA_ARGS"

      - name: Show CMake cache (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "=== build/CMakeCache.txt ==="
          if [ -f build/CMakeCache.txt ]; then
            grep -i 'BUILD_IO_SQL\|SQLite3' build/CMakeCache.txt || true
          else
            echo "No CMakeCache.txt found"
          fi

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ -n "$CMAKE_TOOLCHAIN_FILE" ]; then
            CMAKE_EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE"
            cmake -S . -B build -Wno-dev -DBUILD_BINARIES=OFF -DBUILD_IO_SQL=ON -DCMAKE_BUILD_TYPE=Release $CMAKE_EXTRA_ARGS
          else
            cmake -S . -B build -Wno-dev -DBUILD_BINARIES=OFF -DBUILD_IO_SQL=ON -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Build all libraries
        run: |
          cd build
          for f in $(find ../_libraries/backages -name CMakeLists.txt); do
            for t in $(grep -E '^add_library' "$f" 2>/dev/null | grep -v 'INTERFACE' | sed -E 's/add_library\(([^ ]+).*/\1/'); do
              echo "::group::Building $t"
              cmake --build . --target "$t" --config Release || echo "::warning::Failed to build $t"
              echo "::endgroup::"
            done
          done

      - name: Build all tests
        run: |
          cd build
          for f in $(find ../_libraries/backages -name CMakeLists.txt); do
            for t in $(grep -E 'add_executable.*_tests' "$f" 2>/dev/null | sed -E 's/.*add_executable\(([^ ]+).*/\1/'); do
              echo "::group::Building test $t"
              cmake --build . --target "$t" --config Release || echo "::warning::Failed to build test $t"
              echo "::endgroup::"
            done
          done

      - name: Run tests
        run: |
          cd build
          echo "::group::CTest Results"
          # Ensure we run tests for the Release configuration on multi-config generators
          ctest -C Release --output-on-failure --no-compress-output -R "Tests$" 2>&1 || true
          echo "::endgroup::"
          echo ""
          echo "═══════════════════════════════════════════"
          echo "  TEST RESULTS SUMMARY (${{ matrix.platform }})"
          echo "═══════════════════════════════════════════"
          # Also show a concise summary
          ctest -C Release --output-on-failure -R "Tests$" 2>&1 | tail -20 || true
          echo ""
          # If some CI tooling expects a DartConfiguration.tcl, generate it via a dashboard run
          if [ ! -f DartConfiguration.tcl ]; then
            echo "Generating DartConfiguration.tcl via 'ctest -D Experimental'"
            ctest -D Experimental || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.platform }}
          path: build/Testing/
          if-no-files-found: ignore

      - name: Debug - list built library files
        run: |
          echo "=== All built library files ==="
          find build/_libraries \( -name '*.so' -o -name '*.dylib' -o -name '*.a' -o -name '*.dll' -o -name '*.lib' \) 2>/dev/null || echo "None found"

      - name: Package libraries by category
        run: |
          mkdir -p release-assets

          package_category() {
            local category="$1"    # e.g. IO, ML, security, ELECTRONICS, GRAPHICS, MISC
            local label="$2"       # e.g. io, ml, security, electronics, graphics, misc
            local src_dir="_libraries/backages/${category}"
            local build_dir="build/_libraries/backages/${category}"
            local staging="staging-${label}"

            echo "::group::Packaging ${label}"

            # Create staging with lib/ and include/ subdirectories
            mkdir -p "${staging}/lib" "${staging}/include"

            # Copy built shared libraries (.so, .dylib) and static archives (.a)
            local lib_count=0
            while IFS= read -r f; do
              [ -n "$f" ] && cp -v "$f" "${staging}/lib/" && lib_count=$((lib_count + 1))
            done < <(find "${build_dir}" \( -name '*.so' -o -name '*.dylib' -o -name '*.a' -o -name '*.dll' -o -name '*.lib' \) 2>/dev/null)

            # Copy header files from include/ and headers/ directories
            local hdr_count=0
            for hdr_dir in $(find "${src_dir}" -type d \( -name 'include' -o -name 'headers' \) 2>/dev/null); do
              lib_name=$(basename "$(dirname "$hdr_dir")")
              mkdir -p "${staging}/include/${lib_name}"
              cp -v "${hdr_dir}"/*.h "${staging}/include/${lib_name}/" 2>/dev/null && hdr_count=$((hdr_count + 1))
              cp -v "${hdr_dir}"/*.hpp "${staging}/include/${lib_name}/" 2>/dev/null && hdr_count=$((hdr_count + 1))
            done

            if [ "$lib_count" -gt 0 ] || [ "$hdr_count" -gt 0 ]; then
              tar czf "release-assets/coolbox-${label}-${{ matrix.platform }}-${{ github.ref_name }}.tar.gz" \
                -C "${staging}" lib include
              echo "✓ Packaged ${label}: ${lib_count} libraries, headers from ${hdr_count} dirs"
            else
              echo "⚠ No artifacts found for ${label}"
            fi

            rm -rf "${staging}"
            echo "::endgroup::"
          }

          package_category IO          io
          package_category ML          ml
          package_category security    security
          package_category ELECTRONICS electronics
          package_category GRAPHICS    graphics
          package_category MISC        misc

      - name: Package all headers (full SDK, platform-independent)
        if: matrix.platform == 'linux-x86_64'
        run: |
          mkdir -p staging-headers
          find _libraries/backages -type d \( -name 'include' -o -name 'headers' \) | while read -r hdr_dir; do
            lib_name=$(basename "$(dirname "$hdr_dir")")
            mkdir -p "staging-headers/${lib_name}"
            cp "${hdr_dir}"/*.h "staging-headers/${lib_name}/" 2>/dev/null || true
            cp "${hdr_dir}"/*.hpp "staging-headers/${lib_name}/" 2>/dev/null || true
          done
          tar czf release-assets/coolbox-headers-${{ github.ref_name }}.tar.gz -C staging-headers .
          rm -rf staging-headers

      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: all-assets
          merge-multiple: true

      - name: Create Release & Upload Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" all-assets/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" all-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Release ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
