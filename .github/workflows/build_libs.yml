name: Build Libraries & Release

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build:
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            lib_ext: "*.a -o -name *.so"
          - os: ubuntu-latest
            platform: linux-arm64
            lib_ext: "*.a -o -name *.so"
          - os: macos-latest
            platform: macos-arm64
            lib_ext: "*.a -o -name *.dylib"
          - os: macos-latest
            platform: macos-x86_64
            lib_ext: "*.a -o -name *.dylib"
          - os: windows-latest
            platform: windows-x86_64
            lib_ext: "*.lib -o -name *.dll"
          - os: windows-latest
            platform: windows-arm64
            lib_ext: "*.lib -o -name *.dll"

    runs-on: ${{ matrix.os }}
    outputs:
      run_id: ${{ steps.set_run_id.outputs.run_id }}
    name: Build (${{ matrix.platform }})
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make libeigen3-dev libgtest-dev libgsl-dev libsqlite3-dev doxygen gfortran

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          for pkg in cmake eigen googletest gsl doxygen gcc; do
            brew list "$pkg" &>/dev/null || brew install "$pkg"
          done
          # Ensure sqlite is available for find_package(SQLite3)
          brew list sqlite &>/dev/null || brew install sqlite
          
      - name: Show CMake cache (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          echo "=== build/CMakeCache.txt ==="
          if [ -f build/CMakeCache.txt ]; then
            grep -i 'BUILD_IO_SQL\|SQLite3' build/CMakeCache.txt || true
          else
            echo "No CMakeCache.txt found"
          fi

      - name: Install MSYS2 (Windows)
        if: runner.os == 'Windows'
        id: msys2
        uses: msys2/setup-msys2@v2.30.0
        with:
          msystem: MINGW64
          path-type: inherit
          update: true

      - name: Install MSYS2 packages (Windows x86_64)
        if: runner.os == 'Windows' && runner.arch == 'X64'
        run: |
          set -e
          echo "Installing x86_64 packages"
          pacman -S --noconfirm --needed mingw-w64-x86_64-toolchain mingw-w64-x86_64-gcc mingw-w64-x86_64-cmake mingw-w64-x86_64-eigen3 mingw-w64-x86_64-gsl mingw-w64-x86_64-sqlite3 make
        shell: msys2 {0}

      - name: Install MSYS2 packages (Windows ARM64)
        if: runner.os == 'Windows' && runner.arch == 'ARM64'
        run: |
          set -e
          echo "Installing aarch64 packages"
          pacman -S --noconfirm --needed mingw-w64-aarch64-toolchain mingw-w64-aarch64-gcc mingw-w64-aarch64-cmake mingw-w64-aarch64-eigen3 mingw-w64-aarch64-gsl mingw-w64-aarch64-sqlite3 make
        shell: msys2 {0}

      - name: Ensure mingw in PATH (Windows)
        if: runner.os == 'Windows'
        run: |
          $msysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          if ([string]::IsNullOrWhiteSpace($msysRoot) -or !(Test-Path $msysRoot)) {
            $msysRoot = "C:\\msys64"
          }
          if (!(Test-Path $msysRoot)) { $msysRoot = "C:\\tools\\msys64" }
          $targetBin = if (${env:matrix_platform} -like '*arm64*') { 'mingw64\bin' } else { 'mingw64\bin' }
          # For MSYS2, both aarch64 and x86_64 use mingw64 layout for GitHub runners
          $msysBin = Join-Path $msysRoot $targetBin
          if (Test-Path $msysBin) { echo "$msysBin" >> $env:GITHUB_PATH }
        shell: powershell

      - name: Verify CMake is available (Windows)
        if: runner.os == 'Windows'
        run: |
          command -v cmake
          cmake --version
        shell: msys2 {0}

      - name: Configure CMake (Windows / MSYS2)
        if: runner.os == 'Windows'
        run: |
          cmake -S . -B build -Wno-dev -G 'MinGW Makefiles' -DBUILD_BINARIES=OFF -DBUILD_IO_SQL=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=/mingw64
        shell: msys2 {0}

      - name: Show CMake cache (Windows)
        if: runner.os == 'Windows'
        run: |
          echo "=== build/CMakeCache.txt ==="
          if [ -f build/CMakeCache.txt ]; then
            grep -i 'BUILD_IO_SQL\|SQLite3' build/CMakeCache.txt || true
          else
            echo "No CMakeCache.txt found"
          fi

      - name: Configure CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          if [ -n "$CMAKE_TOOLCHAIN_FILE" ]; then
            CMAKE_EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE"
            cmake -S . -B build -Wno-dev -DBUILD_BINARIES=OFF -DBUILD_IO_SQL=ON -DCMAKE_BUILD_TYPE=Release $CMAKE_EXTRA_ARGS
          else
            cmake -S . -B build -Wno-dev -DBUILD_BINARIES=OFF -DBUILD_IO_SQL=ON -DCMAKE_BUILD_TYPE=Release
          fi
      - name: Build all libraries
        run: |
          cd build
          # Get available targets from the configured buildsystem to avoid
          # attempting to build targets that were not actually generated.
          help_out="$(cmake --build . --target help 2>&1 || true)"
          for f in $(find ../_libraries/backages -name CMakeLists.txt); do
            for t in $(grep -E '^add_library' "$f" 2>/dev/null | grep -v 'INTERFACE' | sed -E 's/add_library\(([^ ]+).*/\1/'); do
              echo "::group::Building $t"
              if echo "$help_out" | grep -E "^${t}\\b" >/dev/null; then
                cmake --build . --target "$t" --config Release || echo "::warning::Failed to build $t"
              else
                echo "::warning::Target $t not available in build system; skipping"
                echo "::group::Diagnostics for missing target $t"
                if [ -f CMakeCache.txt ]; then
                  echo "CMakeCache BUILD_TESTING:"
                  grep -i '^BUILD_TESTING:' CMakeCache.txt || true
                  echo "CMakeCache entries mentioning gtest/googletest:"
                  grep -i 'gtest\|googletest' CMakeCache.txt || true
                else
                  echo "No CMakeCache.txt found in build/"
                fi
                echo "Does help output expose GTest::gtest_main?"
                echo "$help_out" | grep -E '^GTest::gtest_main\b' || echo "(no)"
                echo "Searching build tree for gtest/googletest occurrences:"
                grep -R -n -i 'gtest\|googletest' . || true
                echo "::endgroup::"
              fi
              echo "::endgroup::"
            done
          done

      - name: Build all tests
        run: |
          cd build
          help_out="$(cmake --build . --target help 2>&1 || true)"
          for f in $(find ../_libraries/backages -name CMakeLists.txt); do
            for t in $(grep -E 'add_executable.*_tests' "$f" 2>/dev/null | sed -E 's/.*add_executable\(([^ ]+).*/\1/'); do
              echo "::group::Building test $t"
              if echo "$help_out" | grep -E "^${t}\\b" >/dev/null; then
                cmake --build . --target "$t" --config Release || echo "::warning::Failed to build test $t"
              else
                echo "::warning::Test target $t not present in build system; skipping"
                echo "::group::Diagnostics for missing test $t"
                if [ -f CMakeCache.txt ]; then
                  echo "CMakeCache BUILD_TESTING:"
                  grep -i '^BUILD_TESTING:' CMakeCache.txt || true
                  echo "CMakeCache entries mentioning gtest/googletest:"
                  grep -i 'gtest\|googletest' CMakeCache.txt || true
                else
                  echo "No CMakeCache.txt found in build/"
                fi
                echo "Does help output expose GTest::gtest_main?"
                echo "$help_out" | grep -E '^GTest::gtest_main\b' || echo "(no)"
                echo "Searching build tree for gtest/googletest occurrences:"
                grep -R -n -i 'gtest\|googletest' . || true
                echo "::endgroup::"
              fi
              echo "::endgroup::"
            done
          done

      - name: Run tests
        run: |
          cd build
          echo "::group::CTest Results"
          # Ensure we run tests for the Release configuration on multi-config generators
          ctest -C Release --output-on-failure --no-compress-output -R "Tests$" 2>&1 || true
          echo "::endgroup::"
          echo ""
          echo "═══════════════════════════════════════════"
          echo "  TEST RESULTS SUMMARY (${{ matrix.platform }})"
          echo "═══════════════════════════════════════════"
          # Also show a concise summary
          ctest -C Release --output-on-failure -R "Tests$" 2>&1 | tail -20 || true
          echo ""
          # If some CI tooling expects a DartConfiguration.tcl, generate it via a dashboard run
          if [ ! -f DartConfiguration.tcl ]; then
            echo "Generating DartConfiguration.tcl via 'ctest -D Experimental'"
            ctest -D Experimental || true
          fi

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: test-results-${{ matrix.platform }}
          path: build/Testing/
          if-no-files-found: ignore

      - name: Package and upload LSP artifacts
        if: always()
        run: |
          set -e
          mkdir -p apps/lsp/dist || true
          cp build/apps/lsp/plang_lsp apps/lsp/dist/plang_lsp || cp build/plang_lsp apps/lsp/dist/plang_lsp || true
          cp build/apps/lsp/plrust_lsp apps/lsp/dist/plrust_lsp || cp build/plrust_lsp apps/lsp/dist/plrust_lsp || true
          cp build/apps/lsp/pljava_lsp apps/lsp/dist/pljava_lsp || cp build/pljava_lsp apps/lsp/dist/pljava_lsp || true
          cp build/apps/lsp/plpython_lsp apps/lsp/dist/plpython_lsp || cp build/plpython_lsp apps/lsp/dist/plpython_lsp || true
          if [ -d "apps/lsp/dist" ] && [ "$(ls -A apps/lsp/dist)" ]; then
            mkdir -p build
            tar -czf build/pl_lsp_dist.tar.gz -C apps/lsp dist
            ls -la build/pl_lsp_dist.tar.gz || true
          else
            echo "Warning: apps/lsp/dist does not exist or is empty"
          fi

      - name: Upload LSP dist archive
        uses: actions/upload-artifact@v6
        with:
          name: pl_lsp_dist
          path: build/pl_lsp_dist.tar.gz
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload individual LSP binaries (fallback)
        uses: actions/upload-artifact@v6
        with:
          name: plang_lsp
          path: |
            apps/lsp/dist/plang_lsp
            apps/lsp/dist/plrust_lsp
            apps/lsp/dist/pljava_lsp
            apps/lsp/dist/plpython_lsp
          if-no-files-found: ignore
          retention-days: 14

      - name: Debug - list built library files
        run: |
          echo "=== All built library files ==="
          find build/_libraries \( -name '*.so' -o -name '*.dylib' -o -name '*.a' -o -name '*.dll' -o -name '*.lib' \) 2>/dev/null || echo "None found"

      - name: Package libraries by category
        run: |
          mkdir -p release-assets

          create_archives() {
            local source_dir="$1"
            local base_name="$2"

            tar czf "release-assets/${base_name}.tar.gz" -C "${source_dir}" .
            python -c 'import pathlib,sys,zipfile; s=pathlib.Path(sys.argv[1]); z=pathlib.Path(sys.argv[2]); a=zipfile.ZipFile(z,"w",compression=zipfile.ZIP_DEFLATED); [a.write(p,p.relative_to(s)) for p in sorted(s.rglob("*")) if p.is_file()]; a.close()' \
              "$source_dir" "release-assets/${base_name}.zip"
          }

          package_category() {
            local category="$1"    # e.g. IO, ML, security, ELECTRONICS, GRAPHICS, MISC
            local label="$2"       # e.g. io, ml, security, electronics, graphics, misc
            local src_dir="_libraries/backages/${category}"
            local build_dir="build/_libraries/backages/${category}"
            local staging="staging-${label}"

            echo "::group::Packaging ${label}"

            # Create staging with lib/ and include/ subdirectories
            mkdir -p "${staging}/lib" "${staging}/include"

            # Copy built shared libraries (.so, .dylib) and static archives (.a)
            local lib_count=0
            while IFS= read -r f; do
              [ -n "$f" ] && cp -v "$f" "${staging}/lib/" && lib_count=$((lib_count + 1))
            done < <(find "${build_dir}" \( -name '*.so' -o -name '*.dylib' -o -name '*.a' -o -name '*.dll' -o -name '*.lib' \) 2>/dev/null)

            # Copy header files from include/ and headers/ directories
            local hdr_count=0
            for hdr_dir in $(find "${src_dir}" -type d \( -name 'include' -o -name 'headers' \) 2>/dev/null); do
              lib_name=$(basename "$(dirname "$hdr_dir")")
              mkdir -p "${staging}/include/${lib_name}"
              cp -v "${hdr_dir}"/*.h "${staging}/include/${lib_name}/" 2>/dev/null && hdr_count=$((hdr_count + 1))
              cp -v "${hdr_dir}"/*.hpp "${staging}/include/${lib_name}/" 2>/dev/null && hdr_count=$((hdr_count + 1))
            done

            if [ "$lib_count" -gt 0 ] || [ "$hdr_count" -gt 0 ]; then
              create_archives "${staging}" "coolbox-${label}-${{ matrix.platform }}-${{ github.ref_name }}"
              echo "✓ Packaged ${label}: ${lib_count} libraries, headers from ${hdr_count} dirs"
            else
              echo "⚠ No artifacts found for ${label}"
            fi

            rm -rf "${staging}"
            echo "::endgroup::"
          }

          package_category IO          io
          package_category ML          ml
          package_category security    security
          package_category ELECTRONICS electronics
          package_category GRAPHICS    graphics
          package_category MISC        misc

      - name: Package all headers (full SDK, platform-independent)
        if: matrix.platform == 'linux-x86_64'
        run: |
          mkdir -p staging-headers
          find _libraries/backages -type d \( -name 'include' -o -name 'headers' \) | while read -r hdr_dir; do
            lib_name=$(basename "$(dirname "$hdr_dir")")
            mkdir -p "staging-headers/${lib_name}"
            cp "${hdr_dir}"/*.h "staging-headers/${lib_name}/" 2>/dev/null || true
            cp "${hdr_dir}"/*.hpp "staging-headers/${lib_name}/" 2>/dev/null || true
          done
            tar czf release-assets/coolbox-headers-${{ github.ref_name }}.tar.gz -C staging-headers .
                python -c 'import pathlib,sys,zipfile; s=pathlib.Path(sys.argv[1]); z=pathlib.Path(sys.argv[2]); a=zipfile.ZipFile(z,"w",compression=zipfile.ZIP_DEFLATED); [a.write(p,p.relative_to(s)) for p in sorted(s.rglob("*")) if p.is_file()]; a.close()' \
              "staging-headers" "release-assets/coolbox-headers-${{ github.ref_name }}.zip"
          rm -rf staging-headers

      - name: Upload release assets
        uses: actions/upload-artifact@v6
        with:
          name: release-assets-${{ matrix.platform }}
          path: release-assets/

      - name: Upload full build directory
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: coolbox-build-${{ matrix.platform }}-${{ github.ref_name }}
          path: build/
          if-no-files-found: ignore

      - name: Set workflow run id output
        id: set_run_id
        run: |
          echo "run_id=${GITHUB_RUN_ID:-}" >> $GITHUB_OUTPUT

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Create Release
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-assets-*
          path: all-assets
          merge-multiple: true

      - name: Create Release & Upload Assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" all-assets/* --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" all-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Release ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
