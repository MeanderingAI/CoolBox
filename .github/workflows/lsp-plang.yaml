name: Build & publish plang-lsp

on:
  workflow_run:
    workflows: ["Build Libraries & Release"]
    types: [completed]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get remove -y containerd.io || true
          sudo apt-get install -y build-essential cmake curl pkg-config
          sudo apt-get install -y --no-install-recommends docker.io

      - name: Download plang_lsp artifact
        uses: actions/download-artifact@v8
        with:
          name: plang_lsp
          path: apps/lsp/dist
          run-id: ${{ github.event.workflow_run.id }}

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize GHCR owner
        id: ghcr-owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: apps/lsp
          file: apps/lsp/docker/Dockerfile.plang
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr-owner.outputs.value }}/plang-lsp:plang_lsp-${{ github.sha }}
            ghcr.io/${{ steps.ghcr-owner.outputs.value }}/plang-lsp:latest
