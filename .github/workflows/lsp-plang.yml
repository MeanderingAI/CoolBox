name: Build & publish plang-lsp

on:
  workflow_run:
    workflows: ["Build libraries"]
    types: [completed]

jobs:
  build-and-push:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl pkg-config docker.io

      - name: Download plang_lsp artifact
        uses: actions/download-artifact@v4
        with:
          name: plang_lsp
          path: apps/lsp/dist

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: apps/lsp
          file: apps/lsp/docker/Dockerfile.plang
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/plang-lsp:plang_lsp-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/plang-lsp:latest
