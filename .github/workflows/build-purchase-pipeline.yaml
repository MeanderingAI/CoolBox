name: build_purchase_pipeline

on:
  push:
    branches:
      - 'v*'
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      publish_branch:
        description: Branch that should receive the generated documentation site
        required: false
        default: gh-pages
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-release-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci_diagnostics:
    runs-on: ubuntu-latest
    name: CI diagnostics
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log guard evaluations
        run: |
          set -euo pipefail
          echo "GITHUB_EVENT_NAME=${GITHUB_EVENT_NAME:-}"
          echo "GITHUB_REF=${GITHUB_REF:-}"
          echo "GITHUB_REF_NAME=${GITHUB_REF_NAME:-}"
          if [[ "${GITHUB_REF:-}" == refs/heads/v* ]]; then
            BRANCH_OK=true
          else
            BRANCH_OK=false
          fi
          echo "startsWith(github.ref, 'refs/heads/v') => ${BRANCH_OK}"
          echo "\nPer-job quick summary (purchase generation and product builds both fan out from build_libs)"
          for job in build_libs build_products build_cpp_docs build_tutorials generate_purchase_python generate_purchase_js generate_purchase_go generate_purchase_c generate_purchase_java generate_purchase_r generate_purchase_rust generate_purchase_swift generate_purchase_postgres; do
            echo "- ${job}: if-condition (startsWith branch) => ${BRANCH_OK}; needs: $( if [[ "${job}" == "build_libs" || "${job}" == "build_cpp_docs" || "${job}" == "build_tutorials" ]]; then echo "none"; else echo "build_libs"; fi )"
          done
          echo "\nNote: If 'build_libs' is skipped, any job that lists it in 'needs' will be skipped even if its own 'if' would pass."

  build_libs:
    uses: ./.github/workflows/build-libs.yaml
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/v')
    secrets: inherit

  build_products:
    needs:
      - build_libs
    uses: ./.github/workflows/build-products.yaml
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/v')
    secrets: inherit

  post_build_check:
    needs:
      - build_libs
    runs-on: ubuntu-latest
    if: ${{ always() }}
    name: Post-build diagnostics
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Report build_libs outcome
        run: |
          echo "build_libs result: ${{ needs.build_libs.result }}"

      - name: Try to download release assets
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          pattern: release-assets-*
          path: all-assets
          merge-multiple: true

      - name: List downloaded artifacts
        run: |
          echo "Files in all-assets:" || true
          ls -la all-assets || true
          echo "Files in workspace build folder:" || true
          ls -la build || true

  collect_diagnostics_artifact:
    needs:
      - build_libs
      - build_products
      - build_cpp_docs
      - build_tutorials
      - generate_purchase_python
      - generate_purchase_js
      - generate_purchase_go
      - generate_purchase_c
      - generate_purchase_java
      - generate_purchase_r
      - generate_purchase_rust
      - generate_purchase_swift
      - generate_purchase_postgres
      - generate_lsp_images
      - publish_lsp_packages
    runs-on: ubuntu-latest
    if: ${{ always() }}
    name: Collect diagnostics artifact
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create diagnostics directory and run info
        run: |
          mkdir -p diagnostics/artifacts
          echo "GITHUB_RUN_ID=${GITHUB_RUN_ID:-}" > diagnostics/run_info.txt
          echo "GITHUB_REF=${GITHUB_REF:-}" >> diagnostics/run_info.txt
          echo "GITHUB_REF_NAME=${GITHUB_REF_NAME:-}" >> diagnostics/run_info.txt

      - name: Summarize job results
        run: |
          echo "build_libs: ${{ needs.build_libs.result }}" > diagnostics/jobs_summary.txt
          echo "build_products: ${{ needs.build_products.result }}" >> diagnostics/jobs_summary.txt
          echo "build_cpp_docs: ${{ needs.build_cpp_docs.result }}" >> diagnostics/jobs_summary.txt
          echo "build_tutorials: ${{ needs.build_tutorials.result }}" >> diagnostics/jobs_summary.txt
          echo "generate_purchase_python: ${{ needs.generate_purchase_python.result }}" >> diagnostics/jobs_summary.txt
          echo "generate_purchase_js: ${{ needs.generate_purchase_js.result }}" >> diagnostics/jobs_summary.txt
          echo "generate_purchase_go: ${{ needs.generate_purchase_go.result }}" >> diagnostics/jobs_summary.txt
          echo "generate_purchase_c: ${{ needs.generate_purchase_c.result }}" >> diagnostics/jobs_summary.txt
          echo "generate_purchase_java: ${{ needs.generate_purchase_java.result }}" >> diagnostics/jobs_summary.txt
          echo "generate_purchase_r: ${{ needs.generate_purchase_r.result }}" >> diagnostics/jobs_summary.txt
          echo "generate_purchase_rust: ${{ needs.generate_purchase_rust.result }}" >> diagnostics/jobs_summary.txt
          echo "generate_purchase_swift: ${{ needs.generate_purchase_swift.result }}" >> diagnostics/jobs_summary.txt
          echo "generate_purchase_postgres: ${{ needs.generate_purchase_postgres.result }}" >> diagnostics/jobs_summary.txt
          echo "generate_lsp_images: ${{ needs.generate_lsp_images.result }}" >> diagnostics/jobs_summary.txt
          echo "publish_lsp_packages: ${{ needs.publish_lsp_packages.result }}" >> diagnostics/jobs_summary.txt
          echo "----" >> diagnostics/jobs_summary.txt
          ls -la || true

      - name: Try to download release assets and LSP artifacts
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: |
            release-assets-*
            pl-lsp-dist-*
            pl-lsp-binaries-*
          path: diagnostics/artifacts
          merge-multiple: true

      - name: List diagnostics contents
        run: |
          echo "Diagnostics dir:"
          ls -la diagnostics || true
          echo "Artifacts dir:"
          ls -la diagnostics/artifacts || true

      - name: Archive diagnostics
        run: |
          tar -czf diagnostics-${{ github.run_id }}.tar.gz diagnostics || true

      - name: Upload diagnostics artifact
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.run_id }}
          path: diagnostics-${{ github.run_id }}.tar.gz
          retention-days: 30

  build_cpp_docs:
    uses: ./.github/workflows/build-cpp-docs.yaml
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/v')
    secrets: inherit

  build_tutorials:
    uses: ./.github/workflows/build-tutorials.yaml
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/v')
    secrets: inherit








  generate_purchase_python:
    needs:
      - build_libs
    uses: ./.github/workflows/generate-purchase-python.yaml
    secrets: inherit

  generate_purchase_js:
    needs:
      - build_libs
    uses: ./.github/workflows/generate-purchase-js.yaml
    secrets: inherit

  generate_purchase_go:
    needs:
      - build_libs
    uses: ./.github/workflows/generate-purchase-go.yaml
    secrets: inherit

  generate_purchase_c:
    needs:
      - build_libs
    uses: ./.github/workflows/generate-purchase-c.yaml
    secrets: inherit

  generate_purchase_java:
    needs:
      - build_libs
      - generate_purchase_c
    uses: ./.github/workflows/generate-purchase-java.yaml
    secrets: inherit

  generate_purchase_r:
    needs:
      - build_libs
    uses: ./.github/workflows/generate-purchase-r.yaml
    secrets: inherit

  generate_purchase_rust:
    needs:
      - build_libs
    uses: ./.github/workflows/generate-purchase-rust.yaml
    secrets: inherit

  generate_purchase_swift:
    needs:
      - build_libs
    uses: ./.github/workflows/generate-purchase-swift.yaml
    secrets: inherit

  generate_purchase_postgres:
    needs:
      - build_libs
    uses: ./.github/workflows/generate-purchase-postgres.yaml
    secrets: inherit

  docs_publish:
    if: ${{ always() && needs.build_cpp_docs.result == 'success' && needs.build_tutorials.result == 'success' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/heads/v')) }}
    needs:
      - build_cpp_docs
      - build_tutorials
      - generate_purchase_python
      - generate_purchase_js
      - generate_purchase_go
      - generate_purchase_c
      - generate_purchase_java
      - generate_purchase_r
      - generate_purchase_rust
      - generate_purchase_swift
      - generate_purchase_postgres
    permissions:
      contents: write
      pages: write
      id-token: write
    uses: ./.github/workflows/docs-publish.yaml
    with:
      publish_branch: ${{ inputs.publish_branch }}
    secrets: inherit

  generate_lsp_images:
    needs:
      - build_libs
    if: startsWith(github.ref, 'refs/heads/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install docker
        run: |
          sudo apt-get update
          sudo apt-get remove -y containerd.io || true
          sudo apt-get install -y --no-install-recommends docker.io

      - name: Install fallback LSP build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cmake build-essential libgsl-dev doxygen

      - name: Download LSP artifacts
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pl-lsp-dist-linux-x86_64-${{ github.ref_name }}
          path: _deliverables/apps/lsp/dist

      - name: "Fallback: download individual LSP binaries"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: pl-lsp-binaries-linux-x86_64-${{ github.ref_name }}
          path: _deliverables/apps/lsp/dist

      - name: Extract LSP dist archive if present
        run: |
          set -e
          ARGV="_deliverables/apps/lsp/dist/pl_lsp_dist.tar.gz"
          if [ -f "$ARGV" ]; then
            echo "Extracting $ARGV -> _deliverables/apps/lsp"
            mkdir -p _deliverables/apps/lsp
            tar -xzf "$ARGV" -C _deliverables/apps/lsp || true
            ls -la _deliverables/apps/lsp/dist || true
          else
            ALT="_deliverables/apps/lsp/dist/build/pl_lsp_dist.tar.gz"
            if [ -f "$ALT" ]; then
              echo "Extracting $ALT -> _deliverables/apps/lsp"
              mkdir -p _deliverables/apps/lsp
              tar -xzf "$ALT" -C _deliverables/apps/lsp || true
              ls -la _deliverables/apps/lsp/dist || true
            else
              echo "No pl_lsp_dist archive found; continuing (fallback binaries may be present)"
            fi
          fi

      - name: "Fallback: build LSP binaries locally if missing"
        run: |
          set -e
          required_bins=(plang_lsp plrust_lsp pljava_lsp plscala_lsp plpython_lsp)
          missing=0
          for bin in "${required_bins[@]}"; do
            if [ ! -f "_deliverables/apps/lsp/dist/${bin}" ]; then
              missing=1
            fi
          done

          if [ "$missing" -eq 0 ]; then
            echo "LSP binaries present, skipping local build"
            ls -la _deliverables/apps/lsp/dist
            exit 0
          fi
          echo "No LSP binaries found; attempting local build"
          cmake -S . -B build -DBUILD_BINARIES=ON -DBUILD_PRODUCTS=OFF -DBUILD_TESTING=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel --target plang_lsp plrust_lsp pljava_lsp plscala_lsp plpython_lsp
          mkdir -p _deliverables/apps/lsp/dist
          for bin in "${required_bins[@]}"; do
            cp "build/_deliverables/apps/lsp/${bin}" "_deliverables/apps/lsp/dist/${bin}"
          done

      - name: Verify required LSP binaries before Docker build
        run: |
          set -e
          required_bins=(plang_lsp plrust_lsp pljava_lsp plscala_lsp plpython_lsp)
          missing=0
          for bin in "${required_bins[@]}"; do
            if [ ! -f "_deliverables/apps/lsp/dist/${bin}" ]; then
              echo "Missing required LSP binary: _deliverables/apps/lsp/dist/${bin}" >&2
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "Contents of _deliverables/apps/lsp/dist:" >&2
            ls -la _deliverables/apps/lsp/dist >&2 || true
            echo "Contents of build/_deliverables/apps/lsp:" >&2
            ls -la build/_deliverables/apps/lsp >&2 || true
            exit 1
          fi

      - name: Ensure binaries are executable
        run: chmod +x _deliverables/apps/lsp/dist/* || true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Normalize GHCR owner
        id: ghcr-owner
        run: echo "value=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build & push plang LSP image
        uses: docker/build-push-action@v5
        with:
          context: _deliverables/apps/lsp
          file: _deliverables/apps/lsp/docker/Dockerfile.plang
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr-owner.outputs.value }}/plang-lsp:plang_lsp-${{ github.sha }}
            ghcr.io/${{ steps.ghcr-owner.outputs.value }}/plang-lsp:latest

      - name: Build & push plrust LSP image
        uses: docker/build-push-action@v5
        with:
          context: _deliverables/apps/lsp
          file: _deliverables/apps/lsp/docker/Dockerfile.rust
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr-owner.outputs.value }}/plrust-lsp:plrust_lsp-${{ github.sha }}
            ghcr.io/${{ steps.ghcr-owner.outputs.value }}/plrust-lsp:latest

      - name: Build & push pljava LSP image
        uses: docker/build-push-action@v5
        with:
          context: _deliverables/apps/lsp
          file: _deliverables/apps/lsp/docker/Dockerfile.java
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr-owner.outputs.value }}/pljava-lsp:pljava_lsp-${{ github.sha }}
            ghcr.io/${{ steps.ghcr-owner.outputs.value }}/pljava-lsp:latest

      - name: Build & push plscala LSP image
        uses: docker/build-push-action@v5
        with:
          context: _deliverables/apps/lsp
          file: _deliverables/apps/lsp/docker/Dockerfile.scala
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr-owner.outputs.value }}/plscala-lsp:plscala_lsp-${{ github.sha }}
            ghcr.io/${{ steps.ghcr-owner.outputs.value }}/plscala-lsp:latest

      - name: Build & push plpython LSP image
        uses: docker/build-push-action@v5
        with:
          context: _deliverables/apps/lsp
          file: _deliverables/apps/lsp/docker/Dockerfile.python
          push: true
          tags: |
            ghcr.io/${{ steps.ghcr-owner.outputs.value }}/plpython-lsp:plpython_lsp-${{ github.sha }}
            ghcr.io/${{ steps.ghcr-owner.outputs.value }}/plpython-lsp:latest

  publish_lsp_packages:
    needs:
      - generate_lsp_images
    if: startsWith(github.ref, 'refs/heads/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download plang LSP artifact
        uses: actions/download-artifact@v8
        with:
          name: pl-lsp-binaries-linux-x86_64-${{ github.ref_name }}
          path: dist/raw

      - name: Stage per-language LSP artifacts
        run: |
          set -e
          mkdir -p dist/plang dist/plrust dist/pljava dist/plpython
          cp dist/raw/plang_lsp dist/plang/ || true
          cp dist/raw/plrust_lsp dist/plrust/ || true
          cp dist/raw/pljava_lsp dist/pljava/ || true
          cp dist/raw/plpython_lsp dist/plpython/ || true

      - name: Package artifacts
        run: |
          set -e
          mkdir -p release_assets
          for d in dist/*; do
            if [ -e "$d" ]; then
              cp -r "$d" release_assets/ || true
            fi
          done
          for entry in release_assets/*; do
            if [ -d "$entry" ]; then
              base=$(basename "$entry")
              tar -czf "${base}-${GITHUB_REF_NAME}.tar.gz" -C "$entry" .
            fi
          done
          ls -la

      - name: Create release and upload packages
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }}
          files: release_assets/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
