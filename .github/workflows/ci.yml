name: CI Build and Test

on:
  push:
    branches:
      - 'deb/*'
  pull_request:
    branches:
      - 'deb/*'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make libeigen3-dev

      - name: Build all targets
        run: |
          cmake -S . -B build -DBUILD_TESTING=ON
          cmake --build build -- -j $(nproc || 2)

      - name: Build and Run detected tests
        run: |
          cd build
          # Ensure CMake help lists available targets and only build test targets that exist
          help_out="$(cmake --build . --target help 2>&1 || true)"
          tests_found=()
          for t in $(echo "$help_out" | awk '{print $1}' | grep '_tests$' || true); do
            tests_found+=("$t")
          done
          if [ ${#tests_found[@]} -eq 0 ]; then
            echo "No test targets discovered in configured build system; skipping build/run"
            exit 0
          fi
          for t in "${tests_found[@]}"; do
            echo "Building test target: $t"
            cmake --build . --target "$t" --config Release || echo "::warning::Failed to build $t"
          done
          echo "Running ctest..."
          ctest -C Release --output-on-failure || true
