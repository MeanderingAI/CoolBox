name: build_ext_java

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-ext-java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_ext_java:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Build Java bindings
        run: |
          mvn -f _libraries/java_bindings/pom.xml test package javadoc:javadoc

      - name: Package Java bindings
        run: |
          rm -rf release-assets staging-java
          mkdir -p release-assets staging-java
          cp -R _libraries/java_bindings/target/. staging-java/
          tar -C staging-java -czf release-assets/coolbox-java-bindings-${GITHUB_REF_NAME}.tar.gz .

      - name: Upload Java tarball
        uses: actions/upload-artifact@v6
        with:
          name: java-extension-${{ github.ref_name }}
          path: release-assets/coolbox-java-bindings-${{ github.ref_name }}.tar.gz
          retention-days: 14

      - name: Attach Java tarball to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/coolbox-java-bindings-${{ github.ref_name }}.tar.gz
