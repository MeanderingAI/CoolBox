name: build_ext_java

on:
  workflow_call:
    inputs:
      build_libs_run_id:
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-ext-java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_ext_java:
    if: ${{ github.event_name == 'workflow_call' }}
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute artifact name
        id: compute_artifact
        run: |
          arch_env="${RUNNER_ARCH:-$(uname -m)}"
          arch_lc=$(echo "$arch_env" | tr '[:upper:]' '[:lower:]')
          if [[ "$arch_lc" == *arm* || "$arch_lc" == *aarch* ]]; then
            ARCH=arm64
          else
            ARCH=x86_64
          fi

          case "${RUNNER_OS}" in
            Linux) OSNAME=linux ;;
            macOS) OSNAME=macos ;;
            Windows) OSNAME=windows ;;
            *) OSNAME=linux ;;
          esac

          echo "artifact_name=coolbox-build-${OSNAME}-${ARCH}-${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "osname=${OSNAME}" >> $GITHUB_OUTPUT
          echo "arch=${ARCH}" >> $GITHUB_OUTPUT

      - name: Download built C++ libraries (from build_libs) (with run-id)
        id: download_build_with_run
        if: "${{ inputs.build_libs_run_id != '' }}"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ steps.compute_artifact.outputs.artifact_name }}
          path: build/
          run-id: ${{ inputs.build_libs_run_id }}

      - name: Download built C++ libraries (from build_libs) (no run-id)
        id: download_build
        if: "${{ inputs.build_libs_run_id == '' }}"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ steps.compute_artifact.outputs.artifact_name }}
          path: build/

      - name: Fallback download (run-id)
        if: "${{ inputs.build_libs_run_id != '' }}"
        uses: actions/download-artifact@v8
        with:
          pattern: "coolbox-build-${{ steps.compute_artifact.outputs.osname }}-${{ steps.compute_artifact.outputs.arch }}-*"
          path: build/
          merge-multiple: true

      - name: Fallback download (no run-id)
        if: "${{ inputs.build_libs_run_id == '' }}"
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ format('coolbox-build-{0}-{1}-*', steps.compute_artifact.outputs.osname, steps.compute_artifact.outputs.arch) }}
          path: build/
          merge-multiple: true

      - name: Set COOLBOX_LIB_DIR for Java build
        run: |
          echo "COOLBOX_LIB_DIR=${GITHUB_WORKSPACE}/build" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Download prebuilt library assets (non-tag fallback)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/download-artifact@v8
        with:
          name: release-assets-linux-x86_64
          path: .prebuilt/release-assets

      - name: Download prebuilt C bindings (non-tag fallback)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/download-artifact@v8
        with:
          name: c-extension-linux-x86_64-${{ github.ref_name }}
          path: .prebuilt/c-extension

      - name: Download prebuilt native release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .prebuilt/release-assets .prebuilt/c-extension
          mkdir -p .prebuilt/release-assets .prebuilt/c-extension

          gh release download "${GITHUB_REF_NAME}" \
            --pattern "coolbox-misc-linux-x86_64-${GITHUB_REF_NAME}.tar.gz" \
            --dir .prebuilt/release-assets

          gh release download "${GITHUB_REF_NAME}" \
            --pattern "coolbox-c-bindings-linux-x86_64-${GITHUB_REF_NAME}.tar.gz" \
            --dir .prebuilt/c-extension

      - name: Prepare native runtime assets
        run: |
          rm -rf .prebuilt/java-native
          mkdir -p .prebuilt/java-native
          tar -xzf .prebuilt/release-assets/coolbox-misc-linux-x86_64-${GITHUB_REF_NAME}.tar.gz -C .prebuilt/java-native
          tar -xzf .prebuilt/c-extension/coolbox-c-bindings-linux-x86_64-${GITHUB_REF_NAME}.tar.gz -C .prebuilt/java-native

      - name: Build Java bindings
        env:
          COOLBOX_C_BINDINGS_DIR: ${{ github.workspace }}/.prebuilt/java-native/lib
          LD_LIBRARY_PATH: ${{ github.workspace }}/.prebuilt/java-native/lib
        run: |
          mvn \
            -f _libraries/java_bindings/pom.xml \
            -Dskip.c.bindings.build=true \
            -Dcoolbox.c.bindings.dir=${GITHUB_WORKSPACE}/.prebuilt/java-native/lib \
            test package javadoc:javadoc

      - name: Package Java bindings
        run: |
          rm -rf release-assets staging-java
          mkdir -p release-assets staging-java
          cp -R _libraries/java_bindings/target/. staging-java/
          mkdir -p staging-java/native
          cp -R .prebuilt/java-native/. staging-java/native/
          tar -C staging-java -czf release-assets/coolbox-java-bindings-${GITHUB_REF_NAME}.tar.gz .
          python -c 'import pathlib,sys,zipfile; s=pathlib.Path(sys.argv[1]); z=pathlib.Path(sys.argv[2]); a=zipfile.ZipFile(z,"w",compression=zipfile.ZIP_DEFLATED); [a.write(p,p.relative_to(s)) for p in sorted(s.rglob("*")) if p.is_file()]; a.close()' \
            staging-java release-assets/coolbox-java-bindings-${GITHUB_REF_NAME}.zip

      - name: Upload Java archives
        uses: actions/upload-artifact@v7
        with:
          name: java-extension-${{ github.ref_name }}
          path: |
            release-assets/coolbox-java-bindings-${{ github.ref_name }}.tar.gz
            release-assets/coolbox-java-bindings-${{ github.ref_name }}.zip
          retention-days: 14

      - name: Attach Java archives to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release-assets/coolbox-java-bindings-${GITHUB_REF_NAME}.tar.gz \
            release-assets/coolbox-java-bindings-${GITHUB_REF_NAME}.zip \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"
