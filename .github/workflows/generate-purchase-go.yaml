name: generate_purchase_go

on:
  workflow_call:
    inputs:
      build_libs_run_id:
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group: generate-purchase-go-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate_purchase_go:
    runs-on: ${{ matrix.os }}
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-latest
            platform: macos-arm64
          - os: windows-latest
            platform: windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute artifact name
        id: compute_artifact
        run: |
          arch_env="${RUNNER_ARCH:-$(uname -m)}"
          arch_lc=$(echo "$arch_env" | tr '[:upper:]' '[:lower:]')
          if [[ "$arch_lc" == *arm* || "$arch_lc" == *aarch* ]]; then
            ARCH=arm64
          else
            ARCH=x86_64
          fi

          case "${RUNNER_OS}" in
            Linux) OSNAME=linux ;;
            macOS) OSNAME=macos ;;
            Windows) OSNAME=windows ;;
            *) OSNAME=linux ;;
          esac

          echo "artifact_name=coolbox-build-${OSNAME}-${ARCH}-${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "osname=${OSNAME}" >> $GITHUB_OUTPUT
          echo "arch=${ARCH}" >> $GITHUB_OUTPUT

      - name: Download built C++ libraries (from build_libs) (with run-id)
        id: download_build_with_run
        if: "${{ inputs.build_libs_run_id != '' }}"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ steps.compute_artifact.outputs.artifact_name }}
          path: build/
          run-id: ${{ inputs.build_libs_run_id }}

      - name: Download built C++ libraries (from build_libs) (no run-id)
        id: download_build
        if: "${{ inputs.build_libs_run_id == '' }}"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ steps.compute_artifact.outputs.artifact_name }}
          path: build/

      - name: Fallback download (run-id)
        if: "${{ inputs.build_libs_run_id != '' }}"
        uses: actions/download-artifact@v8
        with:
          pattern: "coolbox-build-${{ steps.compute_artifact.outputs.osname }}-${{ steps.compute_artifact.outputs.arch }}-*"
          path: build/
          merge-multiple: true

      - name: Fallback download (no run-id)
        if: "${{ inputs.build_libs_run_id == '' }}"
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ format('coolbox-build-{0}-{1}-*', steps.compute_artifact.outputs.osname, steps.compute_artifact.outputs.arch) }}
          path: build/
          merge-multiple: true

      - name: Detect Go/C bindings paths
        id: detect_bindings
        run: |
          go_candidates=(
            "_libraries/go_bindings"
            "_deliverables/libraries/bindings/go_bindings"
          )
          c_candidates=(
            "_deliverables/libraries/bindings/c_bindings"
            "_libraries/c_bindings"
          )

          go_dir=""
          c_dir=""

          for d in "${go_candidates[@]}"; do
            if [ -f "$d/go.mod" ]; then
              go_dir="$d"
              break
            fi
          done

          for d in "${c_candidates[@]}"; do
            if [ -f "$d/CMakeLists.txt" ]; then
              c_dir="$d"
              break
            fi
          done

          if [ -n "$go_dir" ]; then
            echo "has_go_bindings=true" >> "$GITHUB_OUTPUT"
            echo "go_bindings_dir=$go_dir" >> "$GITHUB_OUTPUT"
          else
            echo "has_go_bindings=false" >> "$GITHUB_OUTPUT"
            echo "go_bindings_dir=" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$c_dir" ]; then
            echo "c_bindings_dir=$c_dir" >> "$GITHUB_OUTPUT"
          else
            echo "c_bindings_dir=_deliverables/libraries/bindings/c_bindings" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip Go bindings job when module is absent
        if: steps.detect_bindings.outputs.has_go_bindings != 'true'
        run: |
          echo "::notice::No go.mod found for Go bindings (checked _libraries/go_bindings and _deliverables/libraries/bindings/go_bindings). Skipping Go bindings build/package steps."

      - name: Set COOLBOX_LIB_DIR for Go build
        if: steps.detect_bindings.outputs.has_go_bindings == 'true'
        run: |
          echo "COOLBOX_LIB_DIR=${GITHUB_WORKSPACE}/build" >> $GITHUB_ENV
          echo "COOLBOX_C_BINDINGS_SOURCE_DIR=${GITHUB_WORKSPACE}/${{ steps.detect_bindings.outputs.c_bindings_dir }}" >> $GITHUB_ENV
          echo "COOLBOX_C_BINDINGS_BUILD_DIR=${GITHUB_WORKSPACE}/${{ steps.detect_bindings.outputs.c_bindings_dir }}/build" >> $GITHUB_ENV
          echo "COOLBOX_C_BINDINGS_BUILD_CONFIG_DIR=${GITHUB_WORKSPACE}/${{ steps.detect_bindings.outputs.c_bindings_dir }}/build/Release" >> $GITHUB_ENV
          echo "COOLBOX_GO_BINDINGS_DIR=${GITHUB_WORKSPACE}/${{ steps.detect_bindings.outputs.go_bindings_dir }}" >> $GITHUB_ENV

      - name: Set up Go
        if: steps.detect_bindings.outputs.has_go_bindings == 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: ${{ steps.detect_bindings.outputs.go_bindings_dir }}/go.mod
          cache-dependency-path: ${{ steps.detect_bindings.outputs.go_bindings_dir }}/go.mod

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux' && steps.detect_bindings.outputs.has_go_bindings == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make libeigen3-dev

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS' && steps.detect_bindings.outputs.has_go_bindings == 'true'
        run: |
          brew list cmake &>/dev/null || brew install cmake
          brew list eigen &>/dev/null || brew install eigen

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows' && steps.detect_bindings.outputs.has_go_bindings == 'true'
        id: msys2
        env:
          FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: |
            make
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-eigen3

      - name: Ensure mingw64 in PATH (Windows)
        if: runner.os == 'Windows' && steps.detect_bindings.outputs.has_go_bindings == 'true'
        run: |
          $msysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          if ([string]::IsNullOrWhiteSpace($msysRoot) -or !(Test-Path $msysRoot)) {
            $msysRoot = "C:\msys64"
          }
          if (!(Test-Path $msysRoot)) { $msysRoot = "C:\tools\msys64" }
          $msysUsrBin = Join-Path $msysRoot "usr\bin"
          $msysBin = Join-Path $msysRoot "mingw64\bin"
          if (Test-Path $msysUsrBin) { echo "$msysUsrBin" >> $env:GITHUB_PATH }
          echo "$msysBin" >> $env:GITHUB_PATH
        shell: pwsh

      - name: Verify CMake is available (Windows)
        if: runner.os == 'Windows' && steps.detect_bindings.outputs.has_go_bindings == 'true'
        run: |
          command -v cmake
          cmake --version
        shell: msys2 {0}

      - name: Prepare Eigen headers (Linux/macOS)
        if: runner.os != 'Windows' && steps.detect_bindings.outputs.has_go_bindings == 'true'
        run: |
          BUILD_DIR="$GITHUB_WORKSPACE/build"
          if [[ -e "$BUILD_DIR" && ! -d "$BUILD_DIR" ]]; then
            rm -f "$BUILD_DIR"
          fi
          mkdir -p "$BUILD_DIR"

          candidates=()
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            if brew_prefix="$(brew --prefix eigen 2>/dev/null)"; then
              candidates+=("$brew_prefix/include/eigen3")
            fi
          fi
          candidates+=(
            /opt/homebrew/include/eigen3
            /opt/homebrew/opt/eigen/include/eigen3
            /usr/local/include/eigen3
            /usr/local/opt/eigen/include/eigen3
            /usr/include/eigen3
          )

          found_eigen=0
          for d in "${candidates[@]}"; do
            if [[ -d "$d" ]]; then
              rm -rf "$BUILD_DIR/eigen-src"
              cp -R "$d" "$BUILD_DIR/eigen-src"

              if [[ -f "$BUILD_DIR/eigen-src/Eigen/Core" ]]; then
                echo "Using Eigen headers from $d"
                found_eigen=1
                break
              fi

              if [[ -f "$BUILD_DIR/eigen-src/eigen3/Eigen/Core" ]]; then
                rm -rf "$BUILD_DIR/eigen-src"
                cp -R "$d" "$BUILD_DIR/eigen-src"
                mv "$BUILD_DIR/eigen-src/eigen3" "$BUILD_DIR/eigen-src.tmp"
                rm -rf "$BUILD_DIR/eigen-src"
                mv "$BUILD_DIR/eigen-src.tmp" "$BUILD_DIR/eigen-src"
                echo "Using Eigen headers from nested path in $d"
                found_eigen=1
                break
              fi

              rm -rf "$BUILD_DIR/eigen-src"
            fi
          done

          if [[ "$found_eigen" -ne 1 ]]; then
            echo "Checked Eigen candidates:"
            printf ' - %s\n' "${candidates[@]}"
            exit 1
          fi

      - name: Prepare Eigen headers (Windows)
        if: runner.os == 'Windows' && steps.detect_bindings.outputs.has_go_bindings == 'true'
        run: |
          $gcc = Get-Command g++.exe -ErrorAction SilentlyContinue
          if ($null -eq $gcc) {
            $gcc = Get-Command gcc.exe -ErrorAction SilentlyContinue
          }

          $derivedCandidates = @()
          if ($null -ne $gcc) {
            $mingwBin = Split-Path $gcc.Source -Parent
            $mingwRoot = Split-Path $mingwBin -Parent
            $derivedCandidates += @(
              (Join-Path $mingwRoot "include\eigen3"),
              (Join-Path $mingwRoot "include")
            )
          }

          $candidates = @(
            (Join-Path $env:RUNNER_TEMP "msys64\mingw64\include\eigen3"),
            (Join-Path $env:RUNNER_TEMP "msys64\mingw64\include"),
            "C:\msys64\mingw64\include\eigen3",
            "C:\msys64\mingw64\include",
            "C:\tools\msys64\mingw64\include\eigen3",
            "C:\tools\msys64\mingw64\include",
            "C:\vcpkg\installed\x64-windows\include\eigen3",
            "C:\vcpkg\installed\x64-windows\include"
          ) + $derivedCandidates

          $buildDir = Join-Path $env:GITHUB_WORKSPACE "build"
          if ((Test-Path $buildDir) -and -not (Test-Path $buildDir -PathType Container)) {
            Remove-Item -Force $buildDir
          }
          New-Item -ItemType Directory -Force -Path $buildDir | Out-Null

          foreach ($candidate in $candidates) {
            if ([string]::IsNullOrWhiteSpace($candidate)) { continue }
            if (Test-Path $candidate) {
              $eigenDest = Join-Path $buildDir "eigen-src"
              if (Test-Path $eigenDest) {
                Remove-Item -Recurse -Force $eigenDest
              }
              Copy-Item -Recurse -Force $candidate $eigenDest

              if (Test-Path (Join-Path $eigenDest "Eigen\Core")) {
                Write-Host "Using Eigen headers from $candidate"
                exit 0
              }

              $nestedEigen = Join-Path $eigenDest "eigen3"
              if (Test-Path (Join-Path $nestedEigen "Eigen\Core")) {
                Remove-Item -Recurse -Force $eigenDest
                Copy-Item -Recurse -Force $nestedEigen $eigenDest
                Write-Host "Using Eigen headers from nested path in $candidate"
                exit 0
              }

              Remove-Item -Recurse -Force $eigenDest -ErrorAction SilentlyContinue
            }
          }
          Write-Host "Checked Eigen candidates:"
          $candidates | ForEach-Object { Write-Host " - $_" }
          throw "Unable to locate Eigen headers for Go bindings"
        shell: pwsh

      - name: Show Go toolchain
        if: steps.detect_bindings.outputs.has_go_bindings == 'true'
        run: |
          go version
          go env

      - name: Build native libraries for Go bindings (Linux/macOS)
        if: runner.os != 'Windows' && steps.detect_bindings.outputs.has_go_bindings == 'true'
        run: |
          cmake -S "$COOLBOX_C_BINDINGS_SOURCE_DIR" -B "$COOLBOX_C_BINDINGS_SOURCE_DIR/build" -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$COOLBOX_C_BINDINGS_SOURCE_DIR/build" --config Release --parallel
          cmake -S "$COOLBOX_GO_BINDINGS_DIR/cbridge" -B "$COOLBOX_GO_BINDINGS_DIR/cbridge/build" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$COOLBOX_GO_BINDINGS_DIR/cbridge/build" --config Release --target coolboxbridge --parallel

      - name: Build native libraries for Go bindings (Windows)
        if: runner.os == 'Windows' && steps.detect_bindings.outputs.has_go_bindings == 'true'
        run: |
          cmake -S "$COOLBOX_C_BINDINGS_SOURCE_DIR" -B "$COOLBOX_C_BINDINGS_SOURCE_DIR/build" -G "MinGW Makefiles" -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release
          cmake --build "$COOLBOX_C_BINDINGS_SOURCE_DIR/build" --config Release --parallel
          cmake -S "$COOLBOX_GO_BINDINGS_DIR/cbridge" -B "$COOLBOX_GO_BINDINGS_DIR/cbridge/build" -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release
          cmake --build "$COOLBOX_GO_BINDINGS_DIR/cbridge/build" --config Release --target coolboxbridge --parallel
        shell: msys2 {0}

      - name: Verify native C bindings artifact for Go
        if: steps.detect_bindings.outputs.has_go_bindings == 'true'
        run: |
          candidates=()
          case "${RUNNER_OS}" in
            Linux)
              candidates=(
                "${COOLBOX_C_BINDINGS_BUILD_DIR}/libcoolbox_c_bindings.so"
                "${COOLBOX_C_BINDINGS_BUILD_CONFIG_DIR}/libcoolbox_c_bindings.so"
              )
              ;;
            macOS)
              candidates=(
                "${COOLBOX_C_BINDINGS_BUILD_DIR}/libcoolbox_c_bindings.dylib"
                "${COOLBOX_C_BINDINGS_BUILD_CONFIG_DIR}/libcoolbox_c_bindings.dylib"
              )
              ;;
            Windows)
              candidates=(
                "${COOLBOX_C_BINDINGS_BUILD_DIR}/coolbox_c_bindings.dll"
                "${COOLBOX_C_BINDINGS_BUILD_DIR}/libcoolbox_c_bindings.dll"
                "${COOLBOX_C_BINDINGS_BUILD_CONFIG_DIR}/coolbox_c_bindings.dll"
                "${COOLBOX_C_BINDINGS_BUILD_CONFIG_DIR}/libcoolbox_c_bindings.dll"
              )
              ;;
          esac

          found=""
          for candidate in "${candidates[@]}"; do
            if [ -f "$candidate" ]; then
              found="$candidate"
              break
            fi
          done

          if [ -z "$found" ]; then
            echo "Expected native C bindings artifact was not found for Go tests." >&2
            echo "Contents of ${COOLBOX_C_BINDINGS_BUILD_DIR}:" >&2
            ls -la "${COOLBOX_C_BINDINGS_BUILD_DIR}" >&2 || true
            echo "Contents of ${COOLBOX_C_BINDINGS_BUILD_CONFIG_DIR}:" >&2
            ls -la "${COOLBOX_C_BINDINGS_BUILD_CONFIG_DIR}" >&2 || true
            exit 1
          fi

          echo "Using native C bindings artifact: $found"

      - name: Build and test Go bindings
        if: steps.detect_bindings.outputs.has_go_bindings == 'true'
        run: |
          mkdir -p build/test-logs
          cd "$COOLBOX_GO_BINDINGS_DIR"
          if [ -d "${COOLBOX_C_BINDINGS_BUILD_DIR}" ]; then
            export LD_LIBRARY_PATH="${COOLBOX_C_BINDINGS_BUILD_DIR}:${COOLBOX_C_BINDINGS_BUILD_CONFIG_DIR}:${LD_LIBRARY_PATH:-}"
            export DYLD_LIBRARY_PATH="${COOLBOX_C_BINDINGS_BUILD_DIR}:${COOLBOX_C_BINDINGS_BUILD_CONFIG_DIR}:${DYLD_LIBRARY_PATH:-}"
          fi
          if [ "${RUNNER_OS}" = "Windows" ]; then
            export PATH="${COOLBOX_C_BINDINGS_BUILD_DIR};${COOLBOX_C_BINDINGS_BUILD_CONFIG_DIR};${PATH}"
          fi
          set -o pipefail
          go test -count=1 -v ./... | tee ../../build/test-logs/go-bindings-${{ matrix.platform }}.log

      - name: Package Go bindings
        if: steps.detect_bindings.outputs.has_go_bindings == 'true'
        run: |
          rm -rf release-assets staging-go
          mkdir -p release-assets staging-go
          cp -R "$COOLBOX_GO_BINDINGS_DIR"/. staging-go/
          rm -rf staging-go/.git staging-go/.github
          tar -C staging-go -czf release-assets/coolbox-go-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.tar.gz .
              python -c 'import pathlib,sys,zipfile; s=pathlib.Path(sys.argv[1]); z=pathlib.Path(sys.argv[2]); a=zipfile.ZipFile(z,"w",compression=zipfile.ZIP_DEFLATED); [a.write(p,p.relative_to(s)) for p in sorted(s.rglob("*")) if p.is_file()]; a.close()' \
            "staging-go" "release-assets/coolbox-go-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.zip"

      - name: Finalize Go release assets
        if: steps.detect_bindings.outputs.has_go_bindings == 'true'
        uses: ./.github/actions/finalize-purchase-assets
        with:
          assets_dir: release-assets
          ref_name: ${{ github.ref_name }}
          platform: ${{ matrix.platform }}
          workflow_name: ${{ github.workflow }}
          repository: ${{ github.repository }}
          commit_sha: ${{ github.sha }}
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}

      - name: Probe configured CMake tests and package test binaries
        if: steps.detect_bindings.outputs.has_go_bindings == 'true'
        run: |
          if [ -d build ]; then
            echo "--- CMake help (first 200 lines) ---"
            cmake --build build --target help 2>&1 | head -n 200 || true
            echo "--- CTest configured tests ---"
            ctest --test-dir build -N || true
            mkdir -p build/test-binaries || true
            shopt -s globstar || true
            for f in build/**/*_tests build/**/*_test build/**/tests/*; do
              if [ -f "$f" ] && [ -x "$f" ]; then
                cp "$f" build/test-binaries/ || true
              fi
            done
            if [ -d build/test-binaries ] && [ "$(ls -A build/test-binaries 2>/dev/null)" ]; then
              tar -czf build/test_binaries_go_job.tar.gz -C build test-binaries
              ls -la build/test_binaries_go_job.tar.gz || true
            else
              echo "No test binaries found to package"
            fi
          else
            echo "No build directory present; skipping CMake probe"
          fi

      - name: Upload test binaries artifact (Go job)
        if: steps.detect_bindings.outputs.has_go_bindings == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: go_test_binaries
          path: build/test_binaries_go_job.tar.gz
          retention-days: 14

      - name: Upload Go test log
        if: steps.detect_bindings.outputs.has_go_bindings == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: go-test-log-${{ matrix.platform }}
          path: build/test-logs/go-bindings-${{ matrix.platform }}.log
          retention-days: 14

      - name: Upload Go archives
        if: steps.detect_bindings.outputs.has_go_bindings == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: go-extension-${{ matrix.platform }}-${{ github.ref_name }}
          path: |
            release-assets/coolbox-go-bindings-${{ matrix.platform }}-${{ github.ref_name }}.tar.gz
            release-assets/coolbox-go-bindings-${{ matrix.platform }}-${{ github.ref_name }}.zip
            release-assets/manifest.txt
            release-assets/SHA256SUMS
          retention-days: 14

      - name: Attach Go archives to release
        if: startsWith(github.ref, 'refs/tags/v') && steps.detect_bindings.outputs.has_go_bindings == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release-assets/coolbox-go-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.tar.gz \
            release-assets/coolbox-go-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.zip \
            release-assets/manifest.txt#coolbox-go-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.manifest.txt \
            release-assets/SHA256SUMS#coolbox-go-bindings-${{ matrix.platform }}-${GITHUB_REF_NAME}.SHA256SUMS \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"