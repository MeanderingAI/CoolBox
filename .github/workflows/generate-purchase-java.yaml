name: generate_purchase_java

on:
  workflow_call:
    inputs:
      build_libs_run_id:
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: generate-purchase-java-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate_purchase_java:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      PLATFORM: linux-x86_64
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Compute artifact name
        id: compute_artifact
        run: |
          arch_env="${RUNNER_ARCH:-$(uname -m)}"
          arch_lc=$(echo "$arch_env" | tr '[:upper:]' '[:lower:]')
          if [[ "$arch_lc" == *arm* || "$arch_lc" == *aarch* ]]; then
            ARCH=arm64
          else
            ARCH=x86_64
          fi

          case "${RUNNER_OS}" in
            Linux) OSNAME=linux ;;
            macOS) OSNAME=macos ;;
            Windows) OSNAME=windows ;;
            *) OSNAME=linux ;;
          esac

          echo "artifact_name=coolbox-build-${OSNAME}-${ARCH}-${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          echo "osname=${OSNAME}" >> $GITHUB_OUTPUT
          echo "arch=${ARCH}" >> $GITHUB_OUTPUT

      - name: Download built C++ libraries (from build_libs) (with run-id)
        id: download_build_with_run
        if: "${{ inputs.build_libs_run_id != '' }}"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ steps.compute_artifact.outputs.artifact_name }}
          path: build/
          run-id: ${{ inputs.build_libs_run_id }}

      - name: Download built C++ libraries (from build_libs) (no run-id)
        id: download_build
        if: "${{ inputs.build_libs_run_id == '' }}"
        uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          name: ${{ steps.compute_artifact.outputs.artifact_name }}
          path: build/

      - name: Fallback download (run-id)
        if: "${{ inputs.build_libs_run_id != '' }}"
        uses: actions/download-artifact@v8
        with:
          pattern: "coolbox-build-${{ steps.compute_artifact.outputs.osname }}-${{ steps.compute_artifact.outputs.arch }}-*"
          path: build/
          merge-multiple: true

      - name: Fallback download (no run-id)
        if: "${{ inputs.build_libs_run_id == '' }}"
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ format('coolbox-build-{0}-{1}-*', steps.compute_artifact.outputs.osname, steps.compute_artifact.outputs.arch) }}
          path: build/
          merge-multiple: true

      - name: Set COOLBOX_LIB_DIR for Java build
        run: |
          echo "COOLBOX_LIB_DIR=${GITHUB_WORKSPACE}/build" >> $GITHUB_ENV

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Download prebuilt library assets (non-tag fallback)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/download-artifact@v8
        with:
          name: release-assets-linux-x86_64
          path: .prebuilt/release-assets

      - name: Download prebuilt C bindings (non-tag fallback)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/download-artifact@v8
        with:
          name: c-extension-linux-x86_64-${{ github.ref_name }}
          path: .prebuilt/c-extension

      - name: Download prebuilt native release assets
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf .prebuilt/release-assets .prebuilt/c-extension
          mkdir -p .prebuilt/release-assets .prebuilt/c-extension

          gh release download "${GITHUB_REF_NAME}" \
            --pattern "coolbox-misc-linux-x86_64-${GITHUB_REF_NAME}.tar.gz" \
            --dir .prebuilt/release-assets || true

          gh release download "${GITHUB_REF_NAME}" \
            --pattern "coolbox-libraries-linux-x86_64-${GITHUB_REF_NAME}.tar.gz" \
            --dir .prebuilt/release-assets || true

          gh release download "${GITHUB_REF_NAME}" \
            --pattern "coolbox-c-bindings-linux-x86_64-${GITHUB_REF_NAME}.tar.gz" \
            --dir .prebuilt/c-extension

      - name: Prepare native runtime assets
        run: |
          rm -rf .prebuilt/java-native
          mkdir -p .prebuilt/java-native

          if [ -f ".prebuilt/release-assets/coolbox-misc-linux-x86_64-${GITHUB_REF_NAME}.tar.gz" ]; then
            tar -xzf .prebuilt/release-assets/coolbox-misc-linux-x86_64-${GITHUB_REF_NAME}.tar.gz -C .prebuilt/java-native
          elif [ -f ".prebuilt/release-assets/coolbox-libraries-linux-x86_64-${GITHUB_REF_NAME}.tar.gz" ]; then
            tar -xzf .prebuilt/release-assets/coolbox-libraries-linux-x86_64-${GITHUB_REF_NAME}.tar.gz -C .prebuilt/java-native
          else
            echo "No misc/libraries archive found for Java native staging; continuing with C bindings archive only"
          fi

          if [ ! -f ".prebuilt/c-extension/coolbox-c-bindings-linux-x86_64-${GITHUB_REF_NAME}.tar.gz" ]; then
            echo "Missing required C bindings archive for Java packaging" >&2
            echo "Contents of .prebuilt/c-extension:" >&2
            ls -la .prebuilt/c-extension >&2 || true
            exit 1
          fi

          tar -xzf .prebuilt/c-extension/coolbox-c-bindings-linux-x86_64-${GITHUB_REF_NAME}.tar.gz -C .prebuilt/java-native

      - name: Build Java bindings
        env:
          COOLBOX_C_BINDINGS_DIR: ${{ github.workspace }}/.prebuilt/java-native/lib
          LD_LIBRARY_PATH: ${{ github.workspace }}/.prebuilt/java-native/lib
        run: |
          mvn \
            -f _deliverables/libraries/bindings/java_bindings/pom.xml \
            -Dskip.c.bindings.build=true \
            -Dcoolbox.c.bindings.dir=${GITHUB_WORKSPACE}/.prebuilt/java-native/lib \
            test package javadoc:javadoc

      - name: List configured tests (top-level build)
        run: |
          echo "--- CMake help (first 200 lines) ---"
          cmake --build build --target help 2>&1 | head -n 200 || true
          echo "--- CTest configured tests ---"
          ctest --test-dir build -N || true

      - name: Package built test binaries (if any)
        run: |
          mkdir -p build/test-binaries || true
          shopt -s globstar || true
          for f in build/**/*_tests build/**/*_test build/**/tests/*; do
            if [ -f "$f" ] && [ -x "$f" ]; then
              cp "$f" build/test-binaries/ || true
            fi
          done
          if [ -d build/test-binaries ] && [ "$(ls -A build/test-binaries 2>/dev/null)" ]; then
            tar -czf build/test_binaries_java_job.tar.gz -C build test-binaries
            ls -la build/test_binaries_java_job.tar.gz || true
          else
            echo "No test binaries found to package"
          fi

      - name: Package Java bindings
        run: |
          rm -rf release-assets staging-java
          mkdir -p release-assets staging-java
          cp -R _deliverables/libraries/bindings/java_bindings/target/. staging-java/
          mkdir -p staging-java/native
          cp -R .prebuilt/java-native/. staging-java/native/
          tar -C staging-java -czf release-assets/coolbox-java-bindings-${PLATFORM}-${GITHUB_REF_NAME}.tar.gz .
          python -c 'import pathlib,sys,zipfile; s=pathlib.Path(sys.argv[1]); z=pathlib.Path(sys.argv[2]); a=zipfile.ZipFile(z,"w",compression=zipfile.ZIP_DEFLATED); [a.write(p,p.relative_to(s)) for p in sorted(s.rglob("*")) if p.is_file()]; a.close()' \
            staging-java release-assets/coolbox-java-bindings-${PLATFORM}-${GITHUB_REF_NAME}.zip

      - name: Finalize Java release assets
        uses: ./.github/actions/finalize-purchase-assets
        with:
          assets_dir: release-assets
          ref_name: ${{ github.ref_name }}
          platform: ${{ env.PLATFORM }}
          workflow_name: ${{ github.workflow }}
          repository: ${{ github.repository }}
          commit_sha: ${{ github.sha }}
          run_id: ${{ github.run_id }}
          run_attempt: ${{ github.run_attempt }}

      - name: Upload Java archives
        uses: actions/upload-artifact@v7
        with:
          name: java-extension-${{ env.PLATFORM }}-${{ github.ref_name }}
          path: |
            release-assets/coolbox-java-bindings-${{ env.PLATFORM }}-${{ github.ref_name }}.tar.gz
            release-assets/coolbox-java-bindings-${{ env.PLATFORM }}-${{ github.ref_name }}.zip
            release-assets/manifest.txt
            release-assets/SHA256SUMS
          retention-days: 14

      - name: Attach Java archives to release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            release-assets/coolbox-java-bindings-${PLATFORM}-${GITHUB_REF_NAME}.tar.gz \
            release-assets/coolbox-java-bindings-${PLATFORM}-${GITHUB_REF_NAME}.zip \
            release-assets/manifest.txt#coolbox-java-bindings-${PLATFORM}-${GITHUB_REF_NAME}.manifest.txt \
            release-assets/SHA256SUMS#coolbox-java-bindings-${PLATFORM}-${GITHUB_REF_NAME}.SHA256SUMS \
            --clobber \
            --repo "${GITHUB_REPOSITORY}"