# macOS signing environment setup for CI builds
# Composite action

name: 'macOS Signing Setup'
description: 'Setup signing environment for macOS builds'
inputs:
  signing-cert-base64:
    description: 'Base64 encoded signing certificate'
    required: false
    default: ''
  signing-cert-password:
    description: 'Password for signing certificate'
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
  - name: Prepare macOS signing environment
    shell: bash
    env:
      COOLBOX_SIGNING_CERT_BASE64: ${{ inputs.signing-cert-base64 }}
      COOLBOX_SIGNING_CERT_PASSWORD: ${{ inputs.signing-cert-password }}
    run: |
      set -e
      if [ -z "$COOLBOX_SIGNING_CERT_BASE64" ]; then
        echo "No signing certificate provided. Skipping signing setup."
        exit 0
      fi
      mkdir -p "$HOME/.signing"
      echo "$COOLBOX_SIGNING_CERT_BASE64" | base64 -d > "$HOME/.signing/cert.p12"
      security create-keychain -p "" build.keychain
      security default-keychain -s build.keychain
      security unlock-keychain -p "" build.keychain
      security import "$HOME/.signing/cert.p12" -k build.keychain -P "$COOLBOX_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
      echo "COOLBOX_SIGNING_CERT_PATH=$HOME/.signing/cert.p12" >> $GITHUB_ENV
      if [ -n "$COOLBOX_SIGNING_CERT_PASSWORD" ]; then
        echo "COOLBOX_SIGNING_CERT_PASSWORD=$COOLBOX_SIGNING_CERT_PASSWORD" >> $GITHUB_ENV
      fi
