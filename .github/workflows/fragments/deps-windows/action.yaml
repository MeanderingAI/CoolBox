# Windows dependency setup for CI builds
# Composite action

name: 'Windows Dependencies Setup'
description: 'Install and configure dependencies for Windows builds'
runs:
  using: 'composite'
  steps:
    - name: Install vcpkg dependencies (Windows ARM64)
      shell: pwsh
      run: |
        $targetPlatform = '${{ matrix.platform }}'
        $isArm64Target = ($env:RUNNER_ARCH -eq 'ARM64') -or ($targetPlatform -eq 'windows-arm64')
        if ($env:RUNNER_OS -ne 'Windows' -or -not $isArm64Target) {
          Write-Host 'Skipping ARM64 vcpkg dependency install'
          exit 0
        }

        function Find-VcpkgExe {
          $command = Get-Command vcpkg.exe -ErrorAction SilentlyContinue
          $candidates = @(
            $(if ($null -ne $command) { $command.Source }),
            $(if ($null -ne $command) { $command.Path }),
            $(if ($env:VCPKG_ROOT) { Join-Path $env:VCPKG_ROOT 'vcpkg.exe' }),
            'C:\vcpkg\vcpkg.exe',
            $(if ($env:USERPROFILE) { Join-Path $env:USERPROFILE 'vcpkg\vcpkg.exe' }),
            $(if ($env:LOCALAPPDATA) { Join-Path $env:LOCALAPPDATA 'vcpkg\vcpkg.exe' })
          ) | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique

          foreach ($candidate in $candidates) {
            if (Test-Path $candidate) {
              return $candidate
            }
          }

          return $null
        }

        $vcpkgExe = Find-VcpkgExe
        if ($null -eq $vcpkgExe) {
          & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $PWD '_scripts\install_scripts\windows\install_vcpkg.ps1')
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
          $vcpkgExe = Find-VcpkgExe
        }

        if ($null -eq $vcpkgExe) {
          throw 'vcpkg.exe was not found after installation attempt. Windows ARM64 hosted cross-builds require vcpkg with arm64-windows dependencies.'
        }

        $vcpkgRoot = Split-Path -Parent $vcpkgExe
        Add-Content -Path $env:GITHUB_ENV -Value "VCPKG_ROOT=$vcpkgRoot"
        Add-Content -Path $env:GITHUB_ENV -Value 'VCPKG_DEFAULT_TRIPLET=arm64-windows'
        Add-Content -Path $env:GITHUB_PATH -Value $vcpkgRoot

        & $vcpkgExe install eigen3:arm64-windows sqlite3:arm64-windows gsl:arm64-windows openssl:arm64-windows
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

        $arm64Installed = Join-Path $vcpkgRoot 'installed\arm64-windows'
        Add-Content -Path $env:GITHUB_ENV -Value "CMAKE_PREFIX_PATH=$arm64Installed;$arm64Installed\share\gsl;$arm64Installed\lib\cmake\GSL;$arm64Installed\share\sqlite3;$arm64Installed\share\openssl"

    - name: Clean up stale MSYS2 install (all Windows)
      shell: pwsh
      run: |
        if ($env:RUNNER_OS -ne 'Windows' -or $env:RUNNER_ARCH -eq 'ARM64') {
          Write-Host 'Skipping MSYS2 cleanup'
          exit 0
        }
        if (Test-Path 'D:\a\_temp\msys64') { Remove-Item -Recurse -Force 'D:\a\_temp\msys64' }

    - name: Install MSYS2 (Windows)
      id: msys2
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        path-type: inherit
        update: true

    - name: Install MinGW GSL, SQLite3, and Bison (Windows x86_64)
      shell: msys2 {0}
      run: |
        if [ "$RUNNER_OS" != "Windows" ] || [ "$RUNNER_ARCH" != "X64" ] || [ "${{ matrix.platform }}" = "windows-arm64" ]; then
          echo "Skipping x86_64 MinGW dependency install"
          exit 0
        fi
        set -e
        pacman -S --noconfirm --needed mingw-w64-x86_64-gsl mingw-w64-x86_64-sqlite3 bison

    - name: Install MinGW and make (Windows ARM64)
      shell: msys2 {0}
      run: |
        if [ "$RUNNER_OS" != "Windows" ] || { [ "$RUNNER_ARCH" != "ARM64" ] && [ "${{ matrix.platform }}" != "windows-arm64" ]; }; then
          echo "Skipping ARM64 MinGW/make install"
          exit 0
        fi
        set -e
        pacman -S --noconfirm --needed mingw-w64-x86_64-toolchain mingw-w64-x86_64-gcc mingw-w64-x86_64-make make

    - name: Install Bison (Windows ARM64)
      shell: pwsh
      run: |
        $targetPlatform = '${{ matrix.platform }}'
        $isArm64Target = ($env:RUNNER_ARCH -eq 'ARM64') -or ($targetPlatform -eq 'windows-arm64')
        if ($env:RUNNER_OS -ne 'Windows' -or -not $isArm64Target) {
          Write-Host 'Skipping ARM64 bison install'
          exit 0
        }
        & powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File (Join-Path $PWD '_scripts\install_scripts\windows\install_bison.ps1')
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }
        Add-Content -Path $env:GITHUB_PATH -Value 'C:\ProgramData\chocolatey\lib\winflexbison\tools'

    - name: Configure CMake (Windows x86_64 / MSYS2)
      shell: msys2 {0}
      run: |
        if [ "$RUNNER_OS" != "Windows" ] || [ "$RUNNER_ARCH" != "X64" ] || [ "${{ matrix.platform }}" = "windows-arm64" ]; then
          echo "Skipping x86_64 CMake configure"
          exit 0
        fi
        cmake -S . -B build -Wno-dev -G 'MinGW Makefiles' -DBUILD_BINARIES=OFF -DBUILD_PRODUCTS=ON -DBUILD_PRODUCT_INSTALLER_ABSTRACTIONS=ON -DBUILD_IO_SQL=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH='/mingw64'

    - name: Configure CMake (Windows ARM64 / MinGW preferred)
      shell: pwsh
      run: |
        $targetPlatform = '${{ matrix.platform }}'
        $isArm64Target = ($env:RUNNER_ARCH -eq 'ARM64') -or ($targetPlatform -eq 'windows-arm64')
        if ($env:RUNNER_OS -ne 'Windows' -or -not $isArm64Target) {
          Write-Host 'Skipping ARM64 CMake configure'
          exit 0
        }
        function Find-VcpkgToolchain {
          $candidateRoots = @()
          if ($env:VCPKG_ROOT) { $candidateRoots += $env:VCPKG_ROOT }
          $command = Get-Command vcpkg.exe -ErrorAction SilentlyContinue
          if ($null -ne $command) {
            $candidateRoots += (Split-Path -Parent $command.Source)
            $candidateRoots += (Split-Path -Parent $command.Path)
          }
          if ($env:USERPROFILE) { $candidateRoots += (Join-Path $env:USERPROFILE 'vcpkg') }
          if ($env:LOCALAPPDATA) { $candidateRoots += (Join-Path $env:LOCALAPPDATA 'vcpkg') }
          $candidateRoots += 'C:\vcpkg'

          foreach ($candidateRoot in ($candidateRoots | Where-Object { -not [string]::IsNullOrWhiteSpace($_) } | Select-Object -Unique)) {
            $toolchain = Join-Path $candidateRoot 'scripts\buildsystems\vcpkg.cmake'
            if (Test-Path $toolchain) {
              return $toolchain
            }
          }

          return $null
        }

        $vcpkgToolchain = Find-VcpkgToolchain
        if ($null -eq $vcpkgToolchain) {
          throw 'Unable to locate vcpkg toolchain file. Set VCPKG_ROOT or install vcpkg so scripts\buildsystems\vcpkg.cmake is available.'
        }

        $vcpkgRoot = Split-Path -Parent (Split-Path -Parent (Split-Path -Parent $vcpkgToolchain))
        $arm64Installed = Join-Path $vcpkgRoot 'installed\arm64-windows'
        $bisonExecutable = 'C:\ProgramData\chocolatey\lib\winflexbison\tools\win_bison.exe'

        # Clean build dir to avoid generator mismatch
        Remove-Item -Recurse -Force build/CMakeCache.txt,build/CMakeFiles -ErrorAction SilentlyContinue
        # Use MSVC ARM64 cross-compile path directly on hosted Windows runners.
        $cmakeArgs = @(
          '-S', '.',
          '-B', 'build',
          '-Wno-dev',
          '-G', (& .\_scripts\detect_vs_generator.ps1),
          '-A', 'ARM64',
          '-DBUILD_BINARIES=OFF',
          '-DBUILD_PRODUCTS=ON',
          '-DBUILD_PRODUCT_INSTALLER_ABSTRACTIONS=ON',
          '-DBUILD_IO_SQL=ON',
          '-DBUILD_TESTING=ON',
          '-DBUILD_PYTHON_BINDINGS=OFF',
          '-DPYBIND11_FINDPYTHON=OFF',
          "-DCMAKE_TOOLCHAIN_FILE=$($vcpkgToolchain)",
          "-DCMAKE_PREFIX_PATH=$arm64Installed;$arm64Installed\share\gsl;$arm64Installed\lib\cmake\GSL;$arm64Installed\share\sqlite3;$arm64Installed\share\openssl",
          "-DGSL_ROOT_DIR=$arm64Installed",
          "-DBISON_EXECUTABLE=$bisonExecutable",
          '-DVCPKG_TARGET_TRIPLET=arm64-windows'
        )
        & cmake @cmakeArgs
        if ($LASTEXITCODE -ne 0) {
          exit $LASTEXITCODE
        }

    - name: Show CMake cache (Windows)
      shell: pwsh
      run: |
        if ($env:RUNNER_OS -ne 'Windows') {
          Write-Host 'Skipping cache dump on non-Windows runner'
          exit 0
        }
        Write-Host '=== build/CMakeCache.txt ==='
        if (Test-Path 'build/CMakeCache.txt') {
          Select-String -Path 'build/CMakeCache.txt' -Pattern 'BUILD_IO_SQL|SQLite3' -CaseSensitive:$false
        } else {
          Write-Host 'No CMakeCache.txt found'
        }
