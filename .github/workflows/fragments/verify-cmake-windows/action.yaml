# Verify CMake configuration and cache on Windows
name: 'verify-cmake-windows'
description: 'Composite action for verify-cmake-windows'
runs:
  using: 'composite'
  steps:
  - name: Show CMake cache (Windows)
    if: runner.os == 'Windows'
    shell: bash
    run: |
      echo "=== build/CMakeCache.txt ==="
      if [ -f build/CMakeCache.txt ]; then
        grep -i 'BUILD_IO_SQL\|SQLite3' build/CMakeCache.txt || true
      else
        echo "No CMakeCache.txt found"
      fi
