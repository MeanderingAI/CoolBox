# macOS signing environment setup for CI builds
# To use, add: `- uses: ./.github/workflows/fragments/setup-sign-macosx.yaml`

steps:
  - name: Prepare macOS signing environment
    shell: bash
    env:
      COOLBOX_SIGNING_CERT_BASE64: ${{ secrets.COOLBOX_SIGNING_CERT_BASE64 }}
      COOLBOX_SIGNING_CERT_PASSWORD: ${{ secrets.COOLBOX_SIGNING_CERT_PASSWORD }}
    run: |
      set -e
      if [ -z "$COOLBOX_SIGNING_CERT_BASE64" ]; then
        echo "No signing certificate provided. Skipping signing setup."
        exit 0
      fi
      mkdir -p "$HOME/.signing"
      echo "$COOLBOX_SIGNING_CERT_BASE64" | base64 -d > "$HOME/.signing/cert.p12"
      security create-keychain -p "" build.keychain
      security default-keychain -s build.keychain
      security unlock-keychain -p "" build.keychain
      security import "$HOME/.signing/cert.p12" -k build.keychain -P "$COOLBOX_SIGNING_CERT_PASSWORD" -T /usr/bin/codesign
      echo "COOLBOX_SIGNING_CERT_PATH=$HOME/.signing/cert.p12" >> $GITHUB_ENV
      if [ -n "$COOLBOX_SIGNING_CERT_PASSWORD" ]; then
        echo "COOLBOX_SIGNING_CERT_PASSWORD=$COOLBOX_SIGNING_CERT_PASSWORD" >> $GITHUB_ENV
      fi
