# Verify CMake configuration and cache on Linux
steps:
name: 'verify-cmake-linux'
description: 'Composite action for verify-cmake-linux'
runs:
  using: 'composite'
  steps:
  - name: Show CMake cache (Linux)
    if: runner.os == 'Linux'
    run: |
      echo "=== build/CMakeCache.txt ==="
      if [ -f build/CMakeCache.txt ]; then
        grep -i 'BUILD_IO_SQL\|SQLite3' build/CMakeCache.txt || true
      else
        echo "No CMakeCache.txt found"
      fi
