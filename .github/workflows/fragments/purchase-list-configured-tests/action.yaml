# List configured tests for C bindings
name: 'purchase-list-configured-tests'
description: 'Composite action for purchase-list-configured-tests'
runs:
  using: 'composite'
  steps:
  - name: List configured tests (c bindings)
    shell: bash
    run: |
      echo "--- CMake help for _deliverables/libraries/bindings/c_bindings/build (first 200 lines) ---"
      cmake --build _deliverables/libraries/bindings/c_bindings/build --target help 2>&1 | head -n 200 || true
      echo "--- CTest configured tests for _deliverables/libraries/bindings/c_bindings/build ---"
      ctest --test-dir _deliverables/libraries/bindings/c_bindings/build -N || true
