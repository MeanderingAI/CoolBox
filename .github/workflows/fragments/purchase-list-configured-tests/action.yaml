# List configured tests for C bindings
name: 'purchase-list-configured-tests'
description: 'Composite action for purchase-list-configured-tests'
runs:
  using: 'composite'
  steps:
  - name: List configured tests (c bindings)
    shell: bash
    run: |
      echo "--- CMake help for _libraries/c_bindings/build (first 200 lines) ---"
      cmake --build _libraries/c_bindings/build --target help 2>&1 | head -n 200 || true
      echo "--- CTest configured tests for _libraries/c_bindings/build ---"
      ctest --test-dir _libraries/c_bindings/build -N || true
