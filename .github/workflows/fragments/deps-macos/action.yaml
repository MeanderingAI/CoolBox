# macOS dependency setup for CI builds
# Composite action

name: 'macOS Dependencies Setup'
description: 'Install and configure dependencies for macOS builds'
runs:
  using: 'composite'
  steps:
  - name: Normalize Homebrew tap trust (macOS)
    if: runner.os == 'macOS'
    shell: bash
    run: |
      # GitHub runner images can contain third-party taps that are untrusted.
      # Keep CI deterministic by removing aws/tap when present.
      if brew tap | grep -q '^aws/tap$'; then
        brew untap aws/tap || true
      fi

  - name: Install dependencies (macOS)
    if: runner.os == 'macOS'
    shell: bash
    run: |
      for pkg in eigen gsl doxygen gcc sqlite; do
        brew list "$pkg" &>/dev/null || brew install "$pkg"
      done
      sqlite_prefix="$(brew --prefix sqlite)"
      echo "SQLITE3_ROOT=$sqlite_prefix" >> "$GITHUB_ENV"
      echo "SQLite3_ROOT=$sqlite_prefix" >> "$GITHUB_ENV"
      echo "PKG_CONFIG_PATH=$sqlite_prefix/lib/pkgconfig${PKG_CONFIG_PATH:+:$PKG_CONFIG_PATH}" >> "$GITHUB_ENV"
      echo "$sqlite_prefix/bin" >> "$GITHUB_PATH"

  - name: Verify CMake is available (macOS)
    if: runner.os == 'macOS'
    shell: bash
    run: |
      command -v cmake
      cmake --version

  - name: Configure CMake (macOS)
    if: runner.os == 'macOS'
    shell: bash
    run: |
      if [ -n "$SQLITE3_ROOT" ]; then
        CMAKE_SQLITE_ARGS="-DSQLITE3_ROOT=$SQLITE3_ROOT -DSQLite3_ROOT=$SQLITE3_ROOT -DCMAKE_PREFIX_PATH=$SQLITE3_ROOT"
      else
        CMAKE_SQLITE_ARGS=""
      fi
      if [ -n "$CMAKE_TOOLCHAIN_FILE" ]; then
        CMAKE_EXTRA_ARGS="-DCMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE"
        cmake -S . -B build -Wno-dev -DBUILD_BINARIES=OFF -DBUILD_PRODUCTS=ON -DBUILD_PRODUCT_INSTALLER_ABSTRACTIONS=ON -DBUILD_IO_SQL=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release $CMAKE_EXTRA_ARGS $CMAKE_SQLITE_ARGS
      else
        cmake -S . -B build -Wno-dev -DBUILD_BINARIES=OFF -DBUILD_PRODUCTS=ON -DBUILD_PRODUCT_INSTALLER_ABSTRACTIONS=ON -DBUILD_IO_SQL=ON -DBUILD_TESTING=ON -DCMAKE_BUILD_TYPE=Release $CMAKE_SQLITE_ARGS
      fi
