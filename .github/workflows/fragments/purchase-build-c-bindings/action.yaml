# Build C bindings for generate_purchase_c
name: 'purchase-build-c-bindings'
description: 'Composite action for purchase-build-c-bindings'
runs:
  using: 'composite'
  steps:
  - name: Build C bindings
    shell: bash
    run: |
      cmake --build _deliverables/libraries/bindings/c_bindings/build --config Release
