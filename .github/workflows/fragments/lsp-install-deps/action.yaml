# Common LSP dependencies for all LSP workflows
name: 'lsp-install-deps'
description: 'Composite action for lsp-install-deps'
runs:
  using: 'composite'
  steps:
  - name: Install dependencies
    shell: bash
    run: |
      sudo apt-get update
      sudo apt-get remove -y containerd.io || true
      sudo apt-get install -y build-essential cmake curl pkg-config
      sudo apt-get install -y --no-install-recommends docker.io
