name: build_purchase_pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_branch:
        description: Branch that should receive the generated documentation site
        required: false
        default: gh-pages
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-release-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_libs:
    uses: ./.github/workflows/build_libs.yml
    secrets: inherit

  build_cpp_docs:
    uses: ./.github/workflows/build_cpp_docs.yml
    secrets: inherit

  build_tutorials:
    uses: ./.github/workflows/build_tutorials.yml
    secrets: inherit

  build_ext_python:
    needs:
      - build_libs
    uses: ./.github/workflows/build_ext_python.yml
    secrets: inherit

  build_ext_js:
    needs:
      - build_libs
    uses: ./.github/workflows/build_ext_js.yml
    secrets: inherit

  build_ext_go:
    needs:
      - build_libs
    uses: ./.github/workflows/build_ext_go.yml
    secrets: inherit

  build_ext_c:
    needs:
      - build_libs
    uses: ./.github/workflows/build_ext_c.yml
    secrets: inherit

  build_ext_java:
    needs:
      - build_libs
      - build_ext_c
    uses: ./.github/workflows/build_ext_java.yml
    secrets: inherit

  build_ext_r:
    needs:
      - build_libs
    uses: ./.github/workflows/build_ext_r.yml
    secrets: inherit

  build_ext_rust:
    needs:
      - build_libs
    uses: ./.github/workflows/build_ext_rust.yml
    secrets: inherit

  docs_publish:
    if: ${{ always() && needs.build_cpp_docs.result == 'success' && needs.build_tutorials.result == 'success' }}
    needs:
      - build_cpp_docs
      - build_tutorials
      - build_ext_python
      - build_ext_js
      - build_ext_go
      - build_ext_c
      - build_ext_java
      - build_ext_r
      - build_ext_rust
    uses: ./.github/workflows/docs_publish.yml
    with:
      publish_branch: ${{ inputs.publish_branch }}
    secrets: inherit

  build_lsp_images:
    needs:
      - build_libs
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install docker
        run: |
          sudo apt-get update
          sudo apt-get install -y docker.io

      - name: Download LSP artifacts
        uses: actions/download-artifact@v4
        with:
          name: plang_lsp
          path: apps/lsp/dist

      - name: Download rust artifact
        uses: actions/download-artifact@v4
        with:
          name: plrust_lsp
          path: apps/lsp/dist

      - name: Download java artifact
        uses: actions/download-artifact@v4
        with:
          name: pljava_lsp
          path: apps/lsp/dist

      - name: Download python artifact
        uses: actions/download-artifact@v4
        with:
          name: plpython_lsp
          path: apps/lsp/dist

      - name: Ensure binaries are executable
        run: chmod +x apps/lsp/dist/* || true

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push LSP images
        run: |
          set -e
          docker build -f apps/lsp/docker/Dockerfile.plang -t ghcr.io/${{ github.repository_owner }}/plang-lsp:plang_lsp-${{ github.sha }} apps/lsp
          docker push ghcr.io/${{ github.repository_owner }}/plang-lsp:plang_lsp-${{ github.sha }}
          docker tag ghcr.io/${{ github.repository_owner }}/plang-lsp:plang_lsp-${{ github.sha }} ghcr.io/${{ github.repository_owner }}/plang-lsp:latest
          docker push ghcr.io/${{ github.repository_owner }}/plang-lsp:latest

          docker build -f apps/lsp/docker/Dockerfile.rust -t ghcr.io/${{ github.repository_owner }}/plrust-lsp:plrust_lsp-${{ github.sha }} apps/lsp
          docker push ghcr.io/${{ github.repository_owner }}/plrust-lsp:plrust_lsp-${{ github.sha }}
          docker tag ghcr.io/${{ github.repository_owner }}/plrust-lsp:plrust_lsp-${{ github.sha }} ghcr.io/${{ github.repository_owner }}/plrust-lsp:latest
          docker push ghcr.io/${{ github.repository_owner }}/plrust-lsp:latest

          docker build -f apps/lsp/docker/Dockerfile.java -t ghcr.io/${{ github.repository_owner }}/pljava-lsp:pljava_lsp-${{ github.sha }} apps/lsp
          docker push ghcr.io/${{ github.repository_owner }}/pljava-lsp:pljava_lsp-${{ github.sha }}
          docker tag ghcr.io/${{ github.repository_owner }}/pljava-lsp:pljava_lsp-${{ github.sha }} ghcr.io/${{ github.repository_owner }}/pljava-lsp:latest
          docker push ghcr.io/${{ github.repository_owner }}/pljava-lsp:latest

          docker build -f apps/lsp/docker/Dockerfile.python -t ghcr.io/${{ github.repository_owner }}/plpython-lsp:plpython_lsp-${{ github.sha }} apps/lsp
          docker push ghcr.io/${{ github.repository_owner }}/plpython-lsp:plpython_lsp-${{ github.sha }}
          docker tag ghcr.io/${{ github.repository_owner }}/plpython-lsp:plpython_lsp-${{ github.sha }} ghcr.io/${{ github.repository_owner }}/plpython-lsp:latest
          docker push ghcr.io/${{ github.repository_owner }}/plpython-lsp:latest
