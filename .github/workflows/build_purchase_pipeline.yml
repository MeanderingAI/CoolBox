name: build_purchase_pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_branch:
        description: Branch that should receive the generated documentation site
        required: false
        default: gh-pages
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-release-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_libs:
    uses: ./.github/workflows/build_libs.yml
    if: startsWith(github.ref, 'refs/tags/v')
    secrets: inherit

  build_cpp_docs:
    uses: ./.github/workflows/build_cpp_docs.yml
    if: startsWith(github.ref, 'refs/tags/v')
    secrets: inherit

  build_tutorials:
    uses: ./.github/workflows/build_tutorials.yml
    if: startsWith(github.ref, 'refs/tags/v')
    secrets: inherit

  build_ext_python:
    needs:
      - build_libs
    uses: ./.github/workflows/build_ext_python.yml
    if: startsWith(github.ref, 'refs/tags/v')
    secrets: inherit

  build_ext_js:
    needs:
      - build_libs
    uses: ./.github/workflows/build_ext_js.yml
    if: startsWith(github.ref, 'refs/tags/v')
    secrets: inherit

  build_ext_go:
    needs:
      - build_libs
    uses: ./.github/workflows/build_ext_go.yml
    if: startsWith(github.ref, 'refs/tags/v')
    secrets: inherit

  build_ext_c:
    needs:
      - build_libs
    uses: ./.github/workflows/build_ext_c.yml
    if: startsWith(github.ref, 'refs/tags/v')
    secrets: inherit

  build_ext_java:
    needs:
      - build_libs
      - build_ext_c
    uses: ./.github/workflows/build_ext_java.yml
    if: startsWith(github.ref, 'refs/tags/v')
    secrets: inherit

  build_ext_r:
    needs:
      - build_libs
    uses: ./.github/workflows/build_ext_r.yml
    if: startsWith(github.ref, 'refs/tags/v')
    secrets: inherit

  build_ext_rust:
    needs:
      - build_libs
    uses: ./.github/workflows/build_ext_rust.yml
    if: startsWith(github.ref, 'refs/tags/v')
    secrets: inherit

  docs_publish:
    if: ${{ always() && needs.build_cpp_docs.result == 'success' && needs.build_tutorials.result == 'success' && startsWith(github.ref, 'refs/tags/v') }}
    needs:
      - build_cpp_docs
      - build_tutorials
      - build_ext_python
      - build_ext_js
      - build_ext_go
      - build_ext_c
      - build_ext_java
      - build_ext_r
      - build_ext_rust
    uses: ./.github/workflows/docs_publish.yml
    with:
      publish_branch: ${{ inputs.publish_branch }}
    secrets: inherit

  generate_lsp_images:
    needs:
      - build_libs
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install docker
        run: |
          sudo apt-get update
          # Remove potential conflicting package installed from Docker repos
          sudo apt-get remove -y containerd.io || true
          sudo apt-get install -y --no-install-recommends docker.io

      - name: Download LSP artifacts
        uses: actions/download-artifact@v4
        with:
          name: plang_lsp
          path: apps/lsp/dist

      - name: Download rust artifact
        uses: actions/download-artifact@v4
        with:
          name: plrust_lsp
          path: apps/lsp/dist

      - name: Download java artifact
        uses: actions/download-artifact@v4
        with:
          name: pljava_lsp
          path: apps/lsp/dist

      - name: Download python artifact
        uses: actions/download-artifact@v4
        with:
          name: plpython_lsp
          path: apps/lsp/dist

      - name: Ensure binaries are executable
        run: chmod +x apps/lsp/dist/* || true

      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push plang LSP image
        uses: docker/build-push-action@v4
        with:
          context: apps/lsp
          file: apps/lsp/docker/Dockerfile.plang
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/plang-lsp:plang_lsp-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/plang-lsp:latest

      - name: Build & push plrust LSP image
        uses: docker/build-push-action@v4
        with:
          context: apps/lsp
          file: apps/lsp/docker/Dockerfile.rust
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/plrust-lsp:plrust_lsp-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/plrust-lsp:latest

      - name: Build & push pljava LSP image
        uses: docker/build-push-action@v4
        with:
          context: apps/lsp
          file: apps/lsp/docker/Dockerfile.java
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/pljava-lsp:pljava_lsp-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/pljava-lsp:latest

      - name: Build & push plpython LSP image
        uses: docker/build-push-action@v4
        with:
          context: apps/lsp
          file: apps/lsp/docker/Dockerfile.python
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/plpython-lsp:plpython_lsp-${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/plpython-lsp:latest

  
  publish_lsp_packages:
    needs:
      - generate_lsp_images
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download plang LSP artifact
        uses: actions/download-artifact@v4
        with:
          name: plang_lsp
          path: dist/plang

      - name: Download plrust LSP artifact
        uses: actions/download-artifact@v4
        with:
          name: plrust_lsp
          path: dist/plrust

      - name: Download pljava LSP artifact
        uses: actions/download-artifact@v4
        with:
          name: pljava_lsp
          path: dist/pljava

      - name: Download plpython LSP artifact
        uses: actions/download-artifact@v4
        with:
          name: plpython_lsp
          path: dist/plpython

      - name: Package artifacts
        run: |
          set -e
          mkdir -p release_assets
          # copy any downloaded artifact dirs into release_assets
          for d in dist/*; do
            if [ -e "$d" ]; then
              cp -r "$d" release_assets/ || true
            fi
          done
          # create tarballs per artifact
          for entry in release_assets/*; do
            if [ -d "$entry" ]; then
              base=$(basename "$entry")
              tar -czf "${base}-${GITHUB_REF_NAME}.tar.gz" -C "$entry" .
            fi
          done
          ls -la

      - name: Create release and upload packages
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ github.ref_name }}
          files: release_assets/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
