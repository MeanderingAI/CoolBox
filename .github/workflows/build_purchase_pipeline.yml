name: build_purchase_pipeline

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_branch:
        description: Branch that should receive the generated documentation site
        required: false
        default: gh-pages
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: build-release-pipeline-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_libs:
    uses: ./.github/workflows/build_libs.yml
    secrets: inherit

  build_cpp_docs:
    uses: ./.github/workflows/build_cpp_docs.yml
    secrets: inherit

  build_tutorials:
    uses: ./.github/workflows/build_tutorials.yml
    secrets: inherit

  build_ext_python:
    needs:
      - build_libs
    uses: ./.github/workflows/build_ext_python.yml
    secrets: inherit

  build_ext_js:
    needs:
      - build_libs
    uses: ./.github/workflows/build_ext_js.yml
    secrets: inherit

  build_ext_go:
    needs:
      - build_libs
    uses: ./.github/workflows/build_ext_go.yml
    secrets: inherit

  build_ext_c:
    needs:
      - build_libs
    uses: ./.github/workflows/build_ext_c.yml
    secrets: inherit

  build_ext_java:
    needs:
      - build_libs
      - build_ext_c
    uses: ./.github/workflows/build_ext_java.yml
    secrets: inherit

  build_ext_r:
    needs:
      - build_libs
    uses: ./.github/workflows/build_ext_r.yml
    secrets: inherit

  build_ext_rust:
    needs:
      - build_libs
    uses: ./.github/workflows/build_ext_rust.yml
    secrets: inherit

  docs_publish:
    if: ${{ always() && needs.build_cpp_docs.result == 'success' && needs.build_tutorials.result == 'success' }}
    needs:
      - build_cpp_docs
      - build_tutorials
      - build_ext_python
      - build_ext_js
      - build_ext_go
      - build_ext_c
      - build_ext_java
      - build_ext_r
      - build_ext_rust
    uses: ./.github/workflows/docs_publish.yml
    with:
      publish_branch: ${{ inputs.publish_branch }}
    secrets: inherit
