name: Finalize Purchase Assets
description: Generate a normalized manifest and SHA256SUMS for release-assets output.

inputs:
  assets_dir:
    description: Directory containing staged release assets.
    required: false
    default: release-assets
  ref_name:
    description: Git ref name for the package set.
    required: true
  platform:
    description: Platform tag associated with the package set.
    required: true
  workflow_name:
    description: Workflow name to record in the manifest.
    required: true
  repository:
    description: Repository slug to record in the manifest.
    required: true
  commit_sha:
    description: Commit SHA to record in the manifest.
    required: true
  run_id:
    description: GitHub Actions run id.
    required: true
  run_attempt:
    description: GitHub Actions run attempt.
    required: true

runs:
  using: composite
  steps:
    - name: Write manifest and checksums
      shell: bash
      run: |
        set -euo pipefail

        assets_dir="${{ inputs.assets_dir }}"
        manifest="${assets_dir}/manifest.txt"
        checksum_file="${assets_dir}/SHA256SUMS"

        if [ ! -d "${assets_dir}" ]; then
          echo "Assets directory '${assets_dir}' does not exist" >&2
          exit 1
        fi

        shopt -s nullglob
        asset_files=()
        for asset_path in "${assets_dir}"/*; do
          if [ -f "${asset_path}" ]; then
            asset_name="$(basename "${asset_path}")"
            if [ "${asset_name}" != "manifest.txt" ] && [ "${asset_name}" != "SHA256SUMS" ]; then
              asset_files+=("${asset_name}")
            fi
          fi
        done

        {
          printf 'schema=purchase-asset-manifest-v1\n'
          printf 'repository=%s\n' "${{ inputs.repository }}"
          printf 'workflow=%s\n' "${{ inputs.workflow_name }}"
          printf 'run_id=%s\n' "${{ inputs.run_id }}"
          printf 'run_attempt=%s\n' "${{ inputs.run_attempt }}"
          printf 'ref=%s\n' "${{ inputs.ref_name }}"
          printf 'commit_sha=%s\n' "${{ inputs.commit_sha }}"
          printf 'platform=%s\n' "${{ inputs.platform }}"
          printf 'asset_count=%s\n' "${#asset_files[@]}"
          for asset_name in "${asset_files[@]}"; do
            printf 'asset=%s\n' "${asset_name}"
          done
        } > "${manifest}"

        if command -v sha256sum >/dev/null 2>&1; then
          (cd "${assets_dir}" && sha256sum * > SHA256SUMS)
        elif command -v shasum >/dev/null 2>&1; then
          (cd "${assets_dir}" && shasum -a 256 * > SHA256SUMS)
        else
          echo "Neither sha256sum nor shasum is available" >&2
          exit 1
        fi